  const blank = (prev) => ({ key: uid(), date: prev ? addDays(prev.date, 1) : y, startTime: prev?.startTime || '21:00', endTime: prev?.endTime || '23:00', venueName: prev?.venueName || '', bandName: prev ? prev.bandName : (mainBands[0] || ''), members: prev ? prev.members : String(bandMembers[mainBands[0]] || 1), gigType: prev?.gigType || '', baseFee: prev?.baseFee || '', tips: '', isPaid: true });
  const [rows, setRows] = useState(() => [blank()]);
  const upd = (key, k, v) => setRows((rs) => rs.map((r) => (r.key === key ? { ...r, [k]: v } : r)));
  const presetFor = (name) => { const n = name.trim().toLowerCase(); const k = Object.keys(presets).find((x) => x.toLowerCase() === n); return k ? presets[k] : null; };
  const onVenueBlur = (r) => {
    const p = presetFor(r.venueName);
    if (p) setRows((rs) => rs.map((x) => (x.key === r.key ? { ...x, baseFee: x.baseFee || (p.baseFee ? String(p.baseFee) : ''), bandName: x.bandName || p.bandName || '' } : x)));
  };
  const status = (r) => {
    const empty = !r.venueName.trim();
    const ok = isValidDate(r.date) && isValidTime(r.startTime) && isValidTime(r.endTime) && !empty && !!GIG_TYPES[r.gigType];
    return { empty, ok };
  };
  const conflictKeys = useMemo(() => {
    const set = new Set();
    const pending = [];
    rows.forEach((r) => {
      const s = status(r);
      if (!s.ok) return;
      const cand = { id: r.key, date: r.date, startTime: r.startTime, endTime: r.endTime, status: 'confirmed', travelMinutes: 0 };
      if (findIssues(cand, [...gigs, ...pending]).conflicts.length) set.add(r.key);
      pending.push(cand);
    });
    return set;
  }, [rows, gigs]);
  const validRows = rows.filter((r) => status(r).ok);
  const invalidCount = rows.filter((r) => { const s = status(r); return !s.ok && !s.empty; }).length;
  const rowIncome = (r) => myIncome({ baseFee: parseMoney(r.baseFee), tips: parseMoney(r.tips), members: r.members });
  const sumS = validRows.reduce((a, r) => a + toSatang(rowIncome(r)), 0) / 100;
  const onBandChange = (r, v) => setRows((rs) => rs.map((x) => (x.key === r.key ? { ...x, bandName: v, members: bandMembers[v.trim()] ? String(bandMembers[v.trim()]) : x.members } : x)));

      </div>
      <div className="px-4 pb-2 text-[13px] text-[#8E8E93] shrink-0">กรอกได้หลายแถว เลื่อนตารางซ้าย-ขวาได้ · ต้องเลือกประเภทงานทุกแถว · ทิป = ทิปรวมทั้งวง (หารตามจำนวนคน) · บันทึกเป็นสถานะ “คอนเฟิร์ม” · งานก่อนวันนี้จะ <b className="st-confirmed">ปิดจ๊อบ (รับเงินแล้ว)</b> อัตโนมัติ · แถวที่ไม่มีชื่อร้านจะถูกข้าม</div>
      <datalist id="dl-venues">{Object.keys(presets).map((v) => <option key={v} value={v} />)}</datalist>
      <datalist id="dl-bands">{[...mainBands, ...bands.filter((b) => !mainBands.includes(b))].map((b) => <option key={b} value={b} />)}</datalist>
      <div className="flex-1 overflow-auto">
        <div className="mx-4 rounded-[12px] bg-white dark:bg-[#2C2C2E] inline-block min-w-[calc(100%-2rem)]">
          <table className="text-left border-separate border-spacing-0">
            <thead>
              <tr className="text-[12px] text-[#8E8E93] font-semibold">
                {['#', 'วันที่', 'เริ่ม', 'เลิก', 'ชื่อร้าน *', 'ชื่อวง', 'คน', 'ประเภท *', 'ค่าตัว (ฉัน)', 'ทิปรวม', 'สถานะ', ''].map((h, i) => (

                ))}

            </thead>
            <tbody>
              {rows.map((r, i) => {
                const s = status(r);

                    </td>
                    <td className="p-1"><input type="date" value={r.date} onChange={(e) => upd(r.key, 'date', e.target.value)} className={cell + ' w-[140px] text-left'} /></td>
                    <td className="p-1"><input type="time" value={r.startTime} onChange={(e) => upd(r.key, 'startTime', e.target.value)} className={cell + ' w-[92px]'} /></td>
                    <td className="p-1"><input type="time" value={r.endTime} onChange={(e) => upd(r.key, 'endTime', e.target.value)} className={cell + ' w-[92px]'} /></td>

                    <td className="p-1"><input inputMode="numeric" value={r.members} onChange={(e) => upd(r.key, 'members', e.target.value.replace(/[^\d]/g, '').slice(0, 2))} onBlur={() => upd(r.key, 'members', String(Math.min(Math.max(parseInt(r.members, 10) || 1, 1), 99)))} aria-label="จำนวนสมาชิก" className={cell + ' w-[52px] text-center tnum'} /></td>
                    <td className="p-1">
                      <select value={r.gigType} onChange={(e) => upd(r.key, 'gigType', e.target.value)} aria-label="ประเภทงาน" className={cell + ` w-[118px] ${!r.gigType && r.venueName.trim() ? 'ring-2 ring-[#FF9500]' : ''}`}>

                    <td className="p-1"><input inputMode="decimal" value={r.baseFee} placeholder="0" onChange={(e) => upd(r.key, 'baseFee', e.target.value.replace(/[^\d.,]/g, ''))} className={cell + ' w-[90px] text-right tnum'} /></td>
                    <td className="p-1">
                      <input inputMode="decimal" value={r.tips} placeholder="0" onChange={(e) => upd(r.key, 'tips', e.target.value.replace(/[^\d.,]/g, ''))} className={cell + ' w-[88px] text-right tnum'} />
                      {parseMoney(r.tips) > 0 && (parseInt(r.members, 10) || 1) > 1 && <div className="text-[10px] text-[#8E8E93] text-right tnum pr-1 mt-0.5">คนละ {fmtMoney(tipShare({ tips: parseMoney(r.tips), members: r.members }))}</div>}

                    </td>

          <button disabled={!validRows.length || invalidCount > 0} onClick={() => onSave(validRows)} className={`mt-3 w-full h-[50px] rounded-[14px] text-white font-semibold ${validRows.length && !invalidCount ? 'bg-[#5856D6]' : 'bg-[#5856D6]/40'}`}>บันทึก {validRows.length} งานพร้อมกัน</button>
        </div>

/* =====================================================================
   VERSION / UPDATE CHECK
   ===================================================================== */
const cmpVer = (a, b) => { const pa = String(a).split('.').map(Number), pb = String(b).split('.').map(Number); for (let i = 0; i < 3; i++) { const d = (pa[i] || 0) - (pb[i] || 0); if (d) return d; } return 0; };
function useUpdateCheck() {
  const [latest, setLatest] = useState(null);
  const [checking, setChecking] = useState(false);
  const check = useCallback(async () => {
    if (!/^https?:$/.test(location.protocol)) return { ok: false, reason: 'file' };
    setChecking(true);
    try {
      const path = location.pathname.endsWith('/') ? `${location.pathname}index.html` : location.pathname;
      const res = await fetch(`${path}?v=${Date.now()}`, { cache: 'no-store' });
      const m = (await res.text()).match(/GIGFLOW_VERSION\s*=\s*['"]([^'"]+)['"]/);
      const v = m ? m[1] : null;
      if (v) setLatest(v);
      return { ok: !!v, version: v };
    } catch (e) { return { ok: false, reason: 'offline' }; }
    finally { setChecking(false); }
  }, []);
  useEffect(() => {
    const t = setTimeout(check, 4000);
    const iv = setInterval(check, 30 * 60 * 1000);
    const onVis = () => { if (document.visibilityState === 'visible') check(); };
    document.addEventListener('visibilitychange', onVis);
    return () => { clearTimeout(t); clearInterval(iv); document.removeEventListener('visibilitychange', onVis); };
  }, []);
  return { latest, available: !!latest && cmpVer(latest, APP_VERSION) > 0, checking, check };
}
async function applyUpdate() {
  try { const reg = await navigator.serviceWorker?.getRegistration(); await reg?.update(); } catch (e) {}
  location.reload();
}
function fmtBuildDate(s) { if (!isValidDate(s)) return ''; const [y, m, d] = s.split('-').map(Number); return `${d} ${TH_MONTHS_SHORT[m - 1]} ${y + 543}`; }

/* =====================================================================
   INSTALL APP (PWA)
   ===================================================================== */
function useInstall() {
  const [, force] = useState(0);
  useEffect(() => {
    const f = () => force((x) => x + 1);
    window.addEventListener('gigflow-installable', f);
    return () => window.removeEventListener('gigflow-installable', f);
  }, []);
  const ua = navigator.userAgent;
  const isIOS = /iPad|iPhone|iPod/.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  return {
    canPrompt: !!window.__gigflowInstallPrompt,
    isIOS,
    isIOSSafari: isIOS && !/CriOS|FxiOS|EdgiOS/.test(ua),
    standalone: isStandalone(),
    async prompt() {
      const e = window.__gigflowInstallPrompt;
      if (!e) return null;
      e.prompt();
      const r = await e.userChoice.catch(() => ({ outcome: 'dismissed' }));
      window.__gigflowInstallPrompt = null;
      force((x) => x + 1);
      return r.outcome;
    },
  };
}

              <Step n={1} icon="ios_share">แตะปุ่ม <b>แชร์</b> ที่แถบด้านล่างของ Safari</Step>
              <Step n={2} icon="add_box">เลื่อนลงแล้วเลือก <b>“เพิ่มไปยังหน้าจอโฮม”</b></Step>
              <Step n={3} icon="check">แตะ <b>เพิ่ม</b> ที่มุมขวาบน — ไอคอน GigFlow จะอยู่บนหน้าจอโฮม</Step>
            </div>
          </>
        ) : install.canPrompt ? (
          <div className="px-4">
            <button onClick={async () => { const r = await install.prompt(); if (r === 'accepted') onClose(); }} className="w-full h-[52px] rounded-[14px] bg-[#5856D6] text-white text-[17px] font-semibold flex items-center justify-center gap-2"><Icon name="install_mobile" />ติดตั้ง GigFlow</button>
          </div>
        ) : (
          <>
            <GroupLabel>Android / คอมพิวเตอร์</GroupLabel>
            <div className="mx-4 rounded-[12px] bg-white dark:bg-[#2C2C2E] overflow-hidden divide-y divide-black/[0.08] dark:divide-white/[0.1]">
              <Step n={1} icon="more_vert">เปิดเมนูของเบราว์เซอร์ (⋮ ใน Chrome/Edge)</Step>
              <Step n={2} icon="install_desktop">เลือก <b>“ติดตั้งแอป”</b> หรือ <b>“เพิ่มลงในหน้าจอหลัก”</b></Step>
            </div>
            <div className="px-5 pt-2 text-[12px] text-[#8E8E93]">ถ้าไม่เห็นตัวเลือก: ต้องเปิดผ่านเว็บ https (เช่น ลิงก์ .web.app) ไม่ใช่ไฟล์ในเครื่อง</div>
          </>
        )}
      </div>
    </Sheet>
  );
}

/* =====================================================================
   ACCOUNT SETTINGS (วงหลัก · ตำแหน่งบ้าน · เผื่อเก็บของ)
   ===================================================================== */
function SettingsSheet({ settings, onSave, onClose }) {
  const [d, setD] = useState(() => ({ ...settings, bands: [...settings.bands], feePresets: [...settings.feePresets] }));
  const [bandInput, setBandInput] = useState('');
  const home = d.homeMapsUrl.trim();
  const ll = parseLatLng(home);
  const short = !ll && isShortMapsLink(home);
  const addBand = () => {
    const b = bandInput.trim();
    if (!b) return;
    setD((p) => (p.bands.some((x) => x.toLowerCase() === b.toLowerCase()) ? p : { ...p, bands: [...p.bands, b] }));
    setBandInput('');
  };
  const moveUp = (i) => setD((p) => { const a = [...p.bands]; [a[i - 1], a[i]] = [a[i], a[i - 1]]; return { ...p, bands: a }; });
  const dirty = stableStr(normalizeSettings(d)) !== stableStr(normalizeSettings(settings));
  const homeOk = !home || !!ll;
  return (
    <Sheet onClose={onClose} full z={70}>
      <div className="pt-4 px-2 flex items-center justify-between shrink-0">
        <button onClick={onClose} className="h-10 px-3 text-[17px] text-[#5856D6] dark:text-[#A5A3FF]">ยกเลิก</button>
        <div className="text-[17px] font-semibold">ตั้งค่าบัญชี</div>
        <button disabled={!dirty || !homeOk} onClick={() => onSave(normalizeSettings({ ...d, homeMapsUrl: home }))} className={`h-10 px-3 text-[17px] font-semibold ${dirty && homeOk ? 'text-[#5856D6] dark:text-[#A5A3FF]' : 'text-[#C7C7CC] dark:text-[#48484A]'}`}>บันทึก</button>
      </div>
      <div className="flex-1 overflow-y-auto no-scrollbar sheet-pad">
        <GroupLabel>วงหลักของฉัน</GroupLabel>
        <div className="mx-4 rounded-[12px] bg-white dark:bg-[#2C2C2E] overflow-hidden">
          {d.bands.map((b, i) => (
            <React.Fragment key={b}>
              {i > 0 && <Sep />}
              <div className="flex items-center gap-2 pl-4 pr-2 min-h-[48px]">
                <Icon name="star" fill size={18} className="text-[#FF9500]" />
                <span className="flex-1 text-[16px] truncate">{b}</span>
                {i === 0 ? <span className="text-[11px] font-semibold text-[#5856D6] dark:text-[#A5A3FF] px-2 py-[2px] rounded-full bg-[#5856D6]/10">ใส่อัตโนมัติ</span>
                  : <button onClick={() => moveUp(i)} aria-label={`เลื่อน ${b} ขึ้น`} className="w-8 h-8 rounded-full flex items-center justify-center text-[#8E8E93] active:bg-black/5"><Icon name="arrow_upward" size={18} /></button>}
                <button onClick={() => setD((p) => ({ ...p, bands: p.bands.filter((x) => x !== b) }))} aria-label={`ลบ ${b}`} className="w-8 h-8 rounded-full flex items-center justify-center text-[#FF3B30] active:bg-[#FF3B30]/10"><Icon name="remove_circle" fill size={20} /></button>
              </div>
            </React.Fragment>
          ))}
          {d.bands.length > 0 && <Sep />}
          <div className="flex items-center gap-2 pl-4 pr-2 min-h-[48px]">
            <Icon name="add_circle" fill size={20} className="text-[#34C759]" />
            <input value={bandInput} onChange={(e) => setBandInput(e.target.value)} onKeyDown={(e) => { if (e.key === 'Enter') addBand(); }} placeholder="เพิ่มชื่อวง" className="flex-1 bg-transparent outline-none text-[16px] placeholder:text-[#C7C7CC] dark:placeholder:text-[#5A5A5E]" />
            {bandInput.trim() && <button onClick={addBand} className="h-8 px-3 rounded-full bg-[#34C759] text-white text-[13px] font-semibold">เพิ่ม</button>}
          </div>
        </div>
        <div className="px-5 pt-2 text-[12px] text-[#8E8E93]">วงหลักจะขึ้นเป็นปุ่มลัดอันดับแรกตอนเพิ่มงาน และวงแรกจะถูกใส่ให้อัตโนมัติ (ทั้งหน้าเพิ่มงานและกรอกย้อนหลังรวดเดียว)</div>

        <GroupLabel>ทางลัดค่าตัว (สูงสุด 4 ราคา)</GroupLabel>
        <div className="mx-4 grid grid-cols-4 gap-2">
          {Array.from({ length: MAX_FEE_PRESETS }, (_, i) => (
            <input key={i} inputMode="decimal" placeholder="฿ —" aria-label={`ทางลัดค่าตัวช่องที่ ${i + 1}`}
              value={d.feePresets[i] !== undefined && d.feePresets[i] !== 0 ? String(d.feePresets[i]) : ''}
              onChange={(e) => { const v = e.target.value.replace(/[^\d.,]/g, ''); setD((p) => { const a = Array.from({ length: MAX_FEE_PRESETS }, (_, k) => p.feePresets[k] ?? ''); a[i] = v; return { ...p, feePresets: a }; }); }}
              className="h-11 rounded-[12px] bg-white dark:bg-[#2C2C2E] text-center text-[15px] font-semibold tnum outline-none focus:ring-2 focus:ring-[#5856D6] placeholder:text-[#C7C7CC] dark:placeholder:text-[#5A5A5E]" />
          ))}
        </div>
        <div className="px-5 pt-2 text-[12px] text-[#8E8E93]">ขึ้นเป็นปุ่มลัดในหน้าเพิ่มงาน (แท็บค่าตัว) — ช่องว่างจะไม่แสดง</div>

        <GroupLabel>ตำแหน่งบ้าน (ใช้คำนวณเวลาเดินทาง)</GroupLabel>
        <div className="mx-4 rounded-[12px] bg-white dark:bg-[#2C2C2E] overflow-hidden">
          <div className="flex items-center gap-3 px-4 min-h-[50px]">
            <span className="w-[30px] h-[30px] rounded-[8px] flex items-center justify-center text-white shrink-0 bg-[#34C759]"><Icon name="home" size={18} /></span>
            <input value={d.homeMapsUrl} onChange={(e) => setD((p) => ({ ...p, homeMapsUrl: e.target.value }))} placeholder="วางลิงก์ Google Maps หรือพิกัดบ้าน" className="flex-1 min-w-0 bg-transparent outline-none text-[15px] placeholder:text-[#C7C7CC] dark:placeholder:text-[#5A5A5E]" />
            {home && <button onClick={() => setD((p) => ({ ...p, homeMapsUrl: '' }))} aria-label="ล้าง"><Icon name="cancel" fill size={18} className="text-[#C7C7CC]" /></button>}
          </div>
          {ll && (
            <div className="px-4 pb-3 flex items-center justify-between gap-2 text-[13px] st-confirmed">
              <span className="flex items-center gap-1"><Icon name="check_circle" fill size={16} />อ่านพิกัดได้: <span className="tnum">{ll.lat.toFixed(5)}, {ll.lng.toFixed(5)}</span></span>
              <button onClick={() => openUrl(`https://www.google.com/maps/search/?api=1&query=${ll.lat},${ll.lng}`)} className="text-[#007AFF] dark:text-[#0A84FF] font-semibold">ดูบนแผนที่</button>
            </div>
          )}
          {short && (
            <div className="mx-4 mb-3 rounded-[10px] px-3 py-2.5 text-[13px] leading-relaxed" style={{ background: 'rgba(255,149,0,0.12)' }}>
              <div className="font-semibold st-issue flex items-center gap-1"><Icon name="link_off" size={16} />ลิงก์สั้น (maps.app.goo.gl) อ่านพิกัดไม่ได้</div>
              <div className="mt-1">ใช้วิธีใดวิธีหนึ่ง:</div>
              <div><b>ก.</b> เปิดลิงก์นี้ใน Safari/Chrome รอให้แผนที่โหลดเสร็จ แล้วคัดลอก<b>ลิงก์เต็ม</b>จากแถบที่อยู่ (ยาว ๆ มีตัวเลข @13.7…,100.5…) มาวางแทน</div>
              <div><b>ข.</b> ในแอป Google Maps แตะค้างที่บ้านจนขึ้นหมุดแดง แล้วแตะ<b>ตัวเลขพิกัด</b>ด้านบน (เช่น 13.7563, 100.5018) เพื่อคัดลอก แล้ววางที่นี่</div>
            </div>
          )}
          {home && !ll && !short && <div className="px-4 pb-3 text-[13px] st-cancelled flex items-center gap-1"><Icon name="error" size={16} fill />ไม่พบพิกัดในข้อความนี้ — วางลิงก์ Google Maps แบบเต็ม หรือพิกัด เช่น 13.7563, 100.5018</div>}
        </div>
        <div className="px-5 pt-2 text-[12px] text-[#8E8E93]">ตำแหน่งบ้านเก็บในบัญชีของคุณเท่านั้น ใช้ส่งให้ Google Maps คำนวณเส้นทางตอนเลือกร้าน</div>

        <GroupLabel>เผื่อเวลาเก็บของ / จอดรถ</GroupLabel>
        <div className="mx-4 rounded-[12px] bg-white dark:bg-[#2C2C2E] overflow-hidden">
          <Row label="บวกเพิ่มจากเวลาขับรถ" icon="inventory_2" iconBg="#FF9500">
            <input inputMode="numeric" value={String(d.packMinutes)} onChange={(e) => setD((p) => ({ ...p, packMinutes: parseIntSafe(e.target.value, 0) }))} className={inputCls + ' tnum w-14'} />
            <span className="text-[#8E8E93] ml-1">นาที</span>
          </Row>
        </div>
        <div className="flex gap-2 px-4 pt-2">
          {[0, 10, 15, 20, 30].map((v) => (
            <button key={v} onClick={() => setD((p) => ({ ...p, packMinutes: v }))} className={`flex-1 h-8 rounded-full text-[13px] font-semibold tnum ${d.packMinutes === v ? 'bg-[#FF9500] text-white' : 'bg-white dark:bg-[#2C2C2E]'}`}>{v}′</button>
          ))}
        </div>

        <GroupLabel>Google Maps</GroupLabel>
        <div className="mx-4 rounded-[12px] bg-white dark:bg-[#2C2C2E] px-4 py-3 text-[13px] leading-snug flex gap-2">
          {MAPS_KEY
            ? <><Icon name="check_circle" fill size={18} className="text-[#34C759] shrink-0" /><span>เชื่อม Google Maps (Routes API) แล้ว — คำนวณเวลาเดินทางอัตโนมัติเมื่อเลือกร้านที่ลิงก์มีพิกัดหรือชื่อสถานที่</span></>
            : <><Icon name="info" size={18} className="text-[#FF9500] shrink-0" /><span className="text-[#8E8E93]">ยังไม่ได้ใส่ Google Maps API key ในแอป จึงยังคำนวณเวลาเดินทางอัตโนมัติไม่ได้ (ดู SETUP-FIREBASE.md ข้อ 7)</span></>}
        </div>
      </div>
    </Sheet>
  );
}

/* =====================================================================
   HAMBURGER DRAWER
   ===================================================================== */
function DrawerRow({ icon, color, label, sub, onClick, destructive, right, badge }) {
  return (
    <button onClick={onClick} className="w-full flex items-center gap-3 px-4 py-2.5 min-h-[50px] text-left active:bg-black/[0.04] dark:active:bg-white/[0.06]">
      <span className="w-[30px] h-[30px] rounded-[8px] flex items-center justify-center text-white shrink-0" style={{ background: color }}><Icon name={icon} size={18} /></span>
      <div className="flex-1 min-w-0">
        <div className={`text-[16px] ${destructive ? 'text-[#FF3B30]' : ''}`}>{label}</div>
        {sub && <div className="text-[12px] text-[#8E8E93] truncate">{sub}</div>}
      </div>
      {badge ? <span className="min-w-[22px] h-[22px] px-1.5 rounded-full bg-[#FF9500] text-white text-[12px] font-bold flex items-center justify-center">{badge}</span> : null}
      {right !== undefined ? right : <Icon name="chevron_right" className="text-[#C7C7CC]" />}
    </button>
  );
}
function Drawer({ onClose, user, sync, issueCount, venueCount, settings, install, update, onSettings, onVenues, onInstall, onIssues, onSignOut, onDeleteAccount, toast }) {
  useEffect(() => {
    const prev = document.body.style.overflow;
    document.body.style.overflow = 'hidden';
    const onKey = (e) => { if (e.key === 'Escape') onClose(); };
    window.addEventListener('keydown', onKey);
    return () => { document.body.style.overflow = prev; window.removeEventListener('keydown', onKey); };
  }, []);
  const checkNow = async () => {
    const r = await update.check();
    if (!r.ok) toast(r.reason === 'file' ? 'ตรวจอัปเดตได้เมื่อเปิดผ่านเว็บ' : 'ตรวจสอบไม่สำเร็จ (ออฟไลน์?)', 'error');
    else if (cmpVer(r.version, APP_VERSION) > 0) toast(`มีเวอร์ชันใหม่ v${r.version}`, 'system_update');
    else toast(`ใช้เวอร์ชันล่าสุดแล้ว (v${APP_VERSION})`, 'verified');
  };
  const bandsSub = settings.bands.length ? settings.bands.join(', ') : 'ยังไม่ได้ตั้งวงหลัก';
  const homeSub = parseLatLng(settings.homeMapsUrl) ? 'ตั้งตำแหน่งบ้านแล้ว' : 'ยังไม่ได้ตั้งตำแหน่งบ้าน';
  return (
    <div className="fixed inset-0 z-[65]">
      <div className="absolute inset-0 bg-black/40 anim-fade" onClick={onClose} />
      <aside className="absolute top-0 bottom-0 left-0 w-[86%] max-w-[340px] bg-[#F2F2F7] dark:bg-[#1C1C1E] shadow-2xl anim-drawer flex flex-col" role="dialog" aria-label="เมนู">
        <div className="safe-top px-4 pb-2 flex items-center justify-between shrink-0">
          <div className="flex items-center gap-2.5 pt-1"><AppLogo size={30} /><span className="text-[20px] font-bold tracking-tight">GigFlow</span></div>
          <button onClick={onClose} aria-label="ปิดเมนู" className="w-9 h-9 rounded-full bg-[#767680]/[0.12] flex items-center justify-center"><Icon name="close" size={20} /></button>
        </div>
        <div className="flex-1 overflow-y-auto no-scrollbar pb-4">
          {/* บัญชี */}
          <div className="mx-3 mt-2 rounded-[14px] bg-white dark:bg-[#2C2C2E] p-3.5 flex items-center gap-3">
            {user ? <Avatar user={user} size={48} /> : <span className="w-12 h-12 rounded-full bg-[#8E8E93] text-white flex items-center justify-center"><Icon name="smartphone" /></span>}
            <div className="min-w-0 flex-1">
              <div className="text-[16px] font-semibold truncate">{user ? (user.displayName || 'ผู้ใช้ GigFlow') : 'โหมดเครื่องเดียว'}</div>
              <div className="text-[12.5px] text-[#8E8E93] truncate">{user ? user.email : 'ยังไม่ได้เชื่อม Firebase'}</div>
              <div className="mt-0.5"><SyncBadge state={sync.state} /></div>
            </div>
          </div>

          {(issueCount > 0 || update.available) && (
            <div className="mx-3 mt-3 rounded-[14px] bg-white dark:bg-[#2C2C2E] overflow-hidden">
              {issueCount > 0 && <DrawerRow icon="notification_important" color="#FF9500" label="ต้องเช็คปัญหา" sub="งานติดปัญหาที่เหลือไม่ถึง 2 วัน" badge={issueCount} onClick={onIssues} />}
              {issueCount > 0 && update.available && <Sep />}
              {update.available && <DrawerRow icon="system_update" color="#007AFF" label={`มีอัปเดตใหม่ v${update.latest}`} sub="แตะเพื่อโหลดเวอร์ชันล่าสุด" onClick={applyUpdate} />}
            </div>
          )}

          <div className="px-5 pt-5 pb-1.5 text-[13px] text-[#8E8E93] uppercase tracking-wide">ตั้งค่า</div>
          <div className="mx-3 rounded-[14px] bg-white dark:bg-[#2C2C2E] overflow-hidden">
            <DrawerRow icon="manage_accounts" color="#5856D6" label="ตั้งค่าบัญชีผู้ใช้" sub={`${bandsSub} · ${homeSub}`} onClick={onSettings} />
            <Sep />
            <DrawerRow icon="storefront" color="#AF52DE" label="ร้านที่บันทึกไว้" sub={`${venueCount} ร้าน · ดูหรือลบทีละร้าน`} onClick={onVenues} />
            <Sep />
            <DrawerRow icon="install_mobile" color="#34C759" label="ติดตั้งแอปลงเครื่อง" sub={install.standalone ? 'ติดตั้งแล้ว' : install.isIOS ? 'iPhone/iPad: เพิ่มไปยังหน้าจอโฮม' : install.canPrompt ? 'แตะเพื่อติดตั้ง' : 'Android / คอมพิวเตอร์'}
              right={install.standalone ? <Icon name="check_circle" fill className="text-[#34C759]" /> : undefined} onClick={onInstall} />
          </div>

          <div className="px-5 pt-5 pb-1.5 text-[13px] text-[#8E8E93] uppercase tracking-wide">บัญชี Google</div>
          <div className="mx-3 rounded-[14px] bg-white dark:bg-[#2C2C2E] overflow-hidden">
            {user ? (
              <>
                <div className="flex items-center gap-3 px-4 py-2.5 min-h-[50px]">
                  <span className="w-[30px] h-[30px] rounded-[8px] flex items-center justify-center bg-white border border-black/10 shrink-0"><GoogleG size={18} /></span>
                  <div className="flex-1 min-w-0"><div className="text-[16px]">ผูกกับบัญชี Google แล้ว</div><div className="text-[12px] text-[#8E8E93] truncate">{user.email}</div></div>
                  <Icon name="link" className="text-[#34C759]" />
                </div>
                <Sep />
                <DrawerRow icon="logout" color="#8E8E93" label="ออกจากระบบ" onClick={onSignOut} right={null} />
                <Sep />
                <DrawerRow icon="delete_forever" color="#FF3B30" label="ลบบัญชีและข้อมูลถาวร" destructive onClick={onDeleteAccount} right={null} />
              </>
            ) : (
              <div className="px-4 py-3 text-[13px] text-[#8E8E93] leading-snug">ยังไม่ได้เชื่อม Firebase จึงยังไม่มีระบบล็อกอิน — ดูวิธีตั้งค่าใน SETUP-FIREBASE.md</div>
            )}
          </div>

          <div className="mt-6 px-5 text-center">
            <div className="text-[13px] font-semibold">GigFlow v{APP_VERSION}</div>
            <div className="text-[12px] text-[#8E8E93]">อัปเดตล่าสุด {fmtBuildDate(APP_BUILD_DATE)}</div>
            <button onClick={checkNow} disabled={update.checking} className="mt-2 h-8 px-3.5 rounded-full bg-[#767680]/[0.12] text-[13px] font-semibold text-[#5856D6] dark:text-[#A5A3FF] inline-flex items-center gap-1 disabled:opacity-60">
              <Icon name={update.checking ? 'progress_activity' : 'refresh'} size={16} className={update.checking ? 'animate-spin' : ''} />{update.checking ? 'กำลังตรวจสอบ…' : 'ตรวจสอบอัปเดต'}
            </button>
          </div>
        </div>
      </aside>
    </div>
  );
}

/* =====================================================================
   TAB BAR
   ===================================================================== */
function TabBar({ tab, setTab, onAdd }) {
  const Item = ({ id, icon, label }) => {
    const on = tab === id;
    return (
      <button onClick={() => setTab(id)} className={`flex-1 flex flex-col items-center justify-center gap-0.5 pt-2 ${on ? 'text-[#5856D6] dark:text-[#A5A3FF]' : 'text-[#999999] dark:text-[#8E8E93]'}`}>
        <Icon name={icon} fill={on} size={26} />
        <span className="text-[10px] font-semibold">{label}</span>
      </button>
    );
  };
  return (

function applyScope(gigs, original, updated, scope) {
  const gid = original.recurringGroupId;
  if (scope === 'this' || !gid) return gigs.map((g) => (g.id === original.id ? updated : g));
  const patch = {};
  SERIES_FIELDS.forEach((k) => { if (updated[k] !== original[k]) patch[k] = updated[k]; });
  const ts = Date.now();
  if (scope === 'following') {
    // แยกชุดใหม่ตั้งแต่วันนี้ไป — งานที่ผ่านมาแล้ว (ก่อนวันนี้) ไม่ถูกแตะเลย ประวัติ/ยอดเงินคงเดิม
    const newGid = uid();
    return gigs.map((g) => {
      if (g.id === original.id) return { ...updated, recurringGroupId: newGid };
      if (g.recurringGroupId === gid && g.date >= original.date) return { ...g, ...patch, recurringGroupId: newGid, updatedAt: ts };
      return g;
    });
  }
  return gigs.map((g) => (g.id === original.id ? updated : g.recurringGroupId === gid ? { ...g, ...patch, updatedAt: ts } : g));
}

  // ย้ายข้อมูลเก่าจากโหมดเครื่องเดียว (ก่อนมีระบบล็อกอิน) ขึ้นบัญชี — ถามครั้งเดียวต่อบัญชี

    if (!cloud || !sync.ready) return;
    const flag = `gigflow.migrated.${user.uid}`;
    try { if (localStorage.getItem(flag)) return; } catch (e) { return; }
    const legacy = loadGigs();

    const legacyVenues = loadVenues();

    const clearLegacy = () => { try { localStorage.removeItem(KEY_GIGS); localStorage.removeItem(KEY_VENUES); } catch (e) {} };
    setAction({
      title: `พบข้อมูลเดิมในเครื่องนี้ ${legacy.length} งาน`,
      message: `ข้อมูลนี้บันทึกไว้ก่อนมีระบบล็อกอิน ต้องการย้ายขึ้นบัญชี ${user.email || ''} หรือไม่?`,
      actions: [
        { label: 'ย้ายขึ้นบัญชีนี้', bold: true, onClick: () => {
          setGigs((p) => { const m = new Map(p.map((g) => [g.id, g])); legacy.forEach((g) => { if (!m.has(g.id)) m.set(g.id, g); }); return [...m.values()]; });
          setVenues((v) => ({ ...legacyVenues, ...v }));
          clearLegacy(); done();
          toast(`ย้าย ${legacy.length} งานขึ้นบัญชีแล้ว`, 'cloud_upload');
        } },
        { label: 'ลบข้อมูลในเครื่องทิ้ง', destructive: true, onClick: () => { clearLegacy(); done(); } },
      ],
      onCancel: done,
    });

  const askSignOut = () => setAction({
    title: user?.email,
    message: 'ออกจากระบบแล้ว ข้อมูลยังอยู่ในบัญชีของคุณ ล็อกอินใหม่เมื่อไหร่ก็กลับมาเหมือนเดิม',
    actions: [{ label: 'ออกจากระบบ', destructive: true, onClick: () => fbAuth.signOut() }],
  });

  const presets = useMemo(() => {
    const p = {};
    [...gigs].sort((a, b) => (a.updatedAt - b.updatedAt) || cmpGig(a, b)).forEach((g) => {
      p[g.venueName] = { startTime: g.startTime, endTime: g.endTime, baseFee: g.baseFee, mapsUrl: g.mapsUrl, travelMinutes: g.travelMinutes, bandName: g.bandName, count: (p[g.venueName]?.count || 0) + 1 };
    });
    Object.entries(venues).forEach(([k, v]) => {
      if (v && v.deleted) { delete p[k]; return; }   // ร้านที่ผู้ใช้ลบออกจากรายการ (คิวงานเดิมยังอยู่ครบ)
      p[k] = { ...(p[k] || {}), ...v, count: p[k]?.count || 0 };
    });
    return p;
  }, [gigs, venues]);
  const [venueSheetOpen, setVenueSheetOpen] = useState(false);
  const askDeleteVenue = (name) => setAction({
    title: `ลบ “${name}” ออกจากร้านที่บันทึกไว้?`,
    message: 'ร้านนี้จะไม่ขึ้นในรายการแนะนำและจะไม่เติมค่าตัว/เวลา/แผนที่ให้อัตโนมัติอีก คิวงานเดิมของร้านนี้ไม่ถูกลบ (ถ้าบันทึกงานที่ร้านนี้อีกครั้ง ร้านจะกลับมาในรายการเอง)',
    actions: [{ label: 'ลบร้านนี้', destructive: true, onClick: () => {
      setVenues((v) => ({ ...v, [name]: { deleted: true, deletedAt: Date.now() } }));
      toast(`ลบ “${name}” ออกจากรายการแล้ว`, 'delete');

  });
  const bands = useMemo(() => {
    const c = {};
    gigs.forEach((g) => { if (g.bandName) c[g.bandName] = (c[g.bandName] || 0) + 1; });
    return Object.keys(c).sort((a, b) => c[b] - c[a]);
  }, [gigs]);

  /** จำจำนวนสมาชิกตามวง */
  const rememberBandMembers = (list) => {
    const upd = {};
    list.forEach((g) => { const b = (g.bandName || '').trim(); const n = parseInt(g.members, 10); if (b && n >= 1) upd[b] = n; });

  };
  const rememberVenue = (d) => {
    if (!d.venueName) return;
    setVenues((v) => ({ ...v, [d.venueName]: { startTime: d.startTime, endTime: d.endTime, baseFee: d.baseFee, mapsUrl: d.mapsUrl || v[d.venueName]?.mapsUrl || '', travelMinutes: d.travelMinutes, bandName: d.bandName, updatedAt: Date.now() } }));
  };

  const openCreate = (date) => setSheet({ mode: 'create', key: uid(), gig: { date: isValidDate(date) ? date : todayStr(), startTime: '21:00', endTime: '23:00', venueName: '', status: 'pending', bandName: settings.bands[0] || '', members: settings.bandMembers[settings.bands[0]] || 1, gigType: '', issueNote: '', baseFee: 0, mapsUrl: '', travelMinutes: 30, notes: '', tips: 0, isPaid: false, recurringGroupId: null } });
  const openEdit = (g) => setSheet({ mode: 'edit', key: g.id, gig: g });

  const askScope = (original, kind, onPick) => {

    const following = group.filter((g) => g.date >= original.date).length;

    const destructive = kind !== 'edit';
    setAction({
      title: kind === 'cancel' ? 'แคนเซิลงานร้านประจำ' : kind === 'delete' ? 'ลบงานร้านประจำ' : 'แก้ไขงานร้านประจำ',
      message: `“${original.venueName}” อยู่ในชุดร้านประจำ ${group.length} งาน ต้องการให้มีผลกับงานใด?${past ? ` (มีงานที่ผ่านมาแล้ว ${past} งาน)` : ''}`,
      actions: [
        { label: 'เฉพาะวันนี้วันเดียว', destructive, onClick: () => onPick('this') },
        { label: `ตั้งแต่วันนี้เป็นต้นไป (${following} งาน)`, destructive, onClick: () => onPick('following') },
        { label: `ทั้งหมดทุกสัปดาห์ (${group.length} งาน)`, destructive, onClick: () => onPick('all') },
      ],
    });
  };

  /** หลังบันทึกงานติดปัญหา: เสนอเพิ่มนัด "เช็คปัญหา" ลง Google Calendar (12:00 น. ของ 2 วันก่อนงาน) */
  const offerIssueCalendar = (g) => {
    if (g.status !== 'issue' || g.date < todayStr()) return;
    const r = issueReminderAbs(g);
    setAction({
      title: 'เพิ่มนัดเช็คปัญหาลง Google Calendar?',
      message: `“${g.issueNote}” — ให้ปฏิทินเตือน ${fmtDateShort(absToParts(r).date)} ${absToTime(r)} น. เพื่อเช็คอีกครั้งก่อนงาน${g.venueName ? ` ที่ ${g.venueName}` : ''} (${fmtDateShort(g.date)})`,
      actions: [{ label: 'เพิ่มลง Google Calendar', bold: true, onClick: () => openUrl(issueCalendarUrl(g)) }],
    });
  };
  /** ปัญหาเคลียร์แล้ว → เปลี่ยนเป็นคอนเฟิร์ม และลบข้อความปัญหาทิ้ง (เฉพาะงานนั้น) */
  const resolveIssue = (g) => {
    setGigs((p) => p.map((x) => (x.id === g.id ? { ...x, status: 'confirmed', issueNote: '', updatedAt: Date.now() } : x)));
    toast(`${g.venueName}: ปัญหาเคลียร์แล้ว → คอนเฟิร์ม`, 'check_circle');
  };

  const handleSave = ({ mode, original, data, rec }) => {
    const ts = Date.now();
    if (mode === 'create') {
      const dates = rec && rec.dates.length ? rec.dates : [data.date];
      const gid = rec && dates.length > 1 ? uid() : null;
      const created = dates.map((d, i) => closeRetro({ ...data, id: uid(), date: d, recurringGroupId: gid, tips: i === 0 ? data.tips : 0, isPaid: i === 0 ? data.isPaid : false, createdAt: ts, updatedAt: ts }));
      const retro = created.filter((g) => isPastDate(g.date) && g.status !== 'cancelled').length;
      setGigs((p) => [...p, ...created]);
      rememberVenue(data);
      rememberBandMembers([data]);
      setSheet(null);
      toast((created.length > 1 ? `เพิ่มงานประจำ ${created.length} งานแล้ว` : 'เพิ่มคิวงานแล้ว') + (retro ? ` · ปิดจ๊อบย้อนหลัง ${retro} งาน` : ''));
      if (created.length === 1) offerIssueCalendar(created[0]);
      return;
    }
    const updated = { ...original, ...data, updatedAt: ts };
    const groupSize = original.recurringGroupId ? gigs.filter((g) => g.recurringGroupId === original.recurringGroupId).length : 0;
    const seriesChanged = SERIES_FIELDS.some((k) => updated[k] !== original[k]);
    const commit = (scope) => {
      setGigs((p) => applyScope(p, original, updated, scope));
      rememberVenue(updated);
      rememberBandMembers([updated]);
      setSheet(null);
      toast(updated.status === 'cancelled' && original.status !== 'cancelled' ? 'แคนเซิลงานแล้ว' : 'บันทึกการแก้ไขแล้ว');
      if (original.status !== 'issue' || original.issueNote !== updated.issueNote || original.date !== updated.date) offerIssueCalendar(updated);
    };
    if (groupSize > 1 && seriesChanged) {
      askScope(original, updated.status === 'cancelled' && original.status !== 'cancelled' ? 'cancel' : 'edit', commit);
    } else commit('this');
  };

  const handleDelete = (original) => {
    const gid = original.recurringGroupId;

        if (scope === 'following') return g.date < original.date;
        return true;
      }));

      toast('ลบงานแล้ว', 'delete');

    if (groupSize > 1) askScope(original, 'delete', doDelete);
    else setAction({ title: 'ลบงานนี้?', message: `${original.venueName} · ${fmtDateShort(original.date)} — ลบแล้วกู้คืนไม่ได้`, actions: [{ label: 'ลบงาน', destructive: true, onClick: () => doDelete('this') }] });

      const ok = await copyText(buildLineText(gigs, from, to, label));

    setAction({
      title: 'ก๊อปปี้คิวงานส่ง LINE',

        { label: `เดือน${monthLabel(cy, cm)}`, onClick: () => doCopy(mFrom, mTo, `เดือน${TH_MONTHS[cm - 1]}`) },

  const handleBatchSave = (rows) => {

      return normalizeGig({
        id: uid(), date: r.date, startTime: r.startTime, endTime: r.endTime, venueName: k || name, bandName: r.bandName,

      });
    }).filter(Boolean).map(closeRetro);
    setGigs((p) => [...p, ...created]);

  const handleExport = () => {
    const payload = { app: 'GigFlow', version: 2, appVersion: APP_VERSION, exportedAt: new Date().toISOString(), gigs, venues, settings };

    const a = document.createElement('a');
    a.href = url; a.download = `gigflow-backup-${todayStr()}.json`;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1500);

  const handleImport = (file) => {

      let data;
      try { data = JSON.parse(reader.result); } catch (e) { toast('ไฟล์ไม่ใช่ JSON ที่ถูกต้อง', 'error'); return; }
      const rawGigs = Array.isArray(data) ? data : data?.gigs;
      if (!Array.isArray(rawGigs)) { toast('ไม่พบข้อมูลงานในไฟล์', 'error'); return; }
      const incoming = rawGigs.map(normalizeGig).filter(Boolean);
      const inVenues = data && typeof data.venues === 'object' && !Array.isArray(data.venues) ? data.venues : {};
      const skipped = rawGigs.length - incoming.length;
      setAction({
        title: `พบ ${incoming.length} งานในไฟล์${skipped ? ` (ข้าม ${skipped} รายการที่ไม่ถูกต้อง)` : ''}`,
        message: 'ต้องการนำเข้าแบบใด?',
        actions: [
          { label: 'รวมกับข้อมูลเดิม', bold: true, onClick: () => {
            setGigs((p) => { const m = new Map(p.map((g) => [g.id, g])); incoming.forEach((g) => m.set(g.id, g)); return [...m.values()]; });
            setVenues((v) => ({ ...v, ...inVenues }));
            toast(`นำเข้า ${incoming.length} งานแล้ว`, 'upload');
          } },
          { label: 'แทนที่ข้อมูลทั้งหมด', destructive: true, onClick: () => { setGigs(incoming); setVenues(inVenues); if (data && data.settings) setSettings(normalizeSettings(data.settings)); toast('กู้คืนข้อมูลแล้ว', 'upload'); } },
        ],
      });
    };
    reader.onerror = () => toast('อ่านไฟล์ไม่สำเร็จ', 'error');
    reader.readAsText(file);
  };

  const loadDemo = () => {
    const go = () => { const d = makeDemo(); setGigs(d.gigs); setVenues(d.venues); setSettings((st) => ({ ...st, bandMembers: { ...d.bandMembers, ...st.bandMembers } })); setTab('home'); toast(`โหลดข้อมูลตัวอย่าง ${d.gigs.length} งานแล้ว`, 'science'); };
    if (!gigs.length) return go();

  };
  const clearAll = () => setAction({ title: 'ล้างข้อมูลทั้งหมด?', message: `งาน ${gigs.length} รายการและโปรไฟล์ร้านทั้งหมดจะถูกลบถาวร${cloud ? ' (รวมถึงในบัญชีบนคลาวด์ทุกเครื่อง)' : ''}`, actions: [{ label: 'ล้างข้อมูลทั้งหมด', destructive: true, onClick: () => { setGigs([]); setVenues({}); toast('ล้างข้อมูลแล้ว', 'delete'); } }] });

  const isOpenPast = (g) => isPastDate(g.date) && g.status !== 'cancelled' && (!g.isPaid || g.status === 'pending');

    setAction({
      title: `ปิดจ๊อบงานที่ผ่านมา ${openPast.length} งาน?`,
      message: `ทุกงานก่อนวันนี้จะถูกตั้งเป็น “รับเงินแล้ว” (ยอดค้างจ่ายรวม ${fmtMoney(money)})${pend ? ` และงานรอคอนเฟิร์ม ${pend} งานจะเปลี่ยนเป็นคอนเฟิร์ม` : ''} · ไม่แตะงานที่แคนเซิลและงานตั้งแต่วันนี้เป็นต้นไป`,
      actions: [{ label: `ปิดจ๊อบ ${openPast.length} งาน`, bold: true, onClick: () => {
        const ts = Date.now();
        setGigs((p) => p.map((g) => (isOpenPast(g) ? { ...closeRetro(g), updatedAt: ts } : g)));
        toast(`ปิดจ๊อบ ${openPast.length} งานแล้ว`, 'task_alt');
      } }],
    });
  };
  const markPaid = (g) => { setGigs((p) => p.map((x) => (x.id === g.id ? { ...x, isPaid: true, updatedAt: Date.now() } : x))); toast(`รับเงิน ${fmtMoney(myIncome(g))} แล้ว`, 'paid'); };

  /* ---------- ลบบัญชีและข้อมูลถาวร (ยืนยัน 2 ชั้น) ---------- */
  const doDeleteAccount = async () => {
    const cur = fbAuth?.currentUser;
    if (!cur) return;
    try {
      toast('กำลังลบบัญชี…', 'progress_activity');
      // Firebase ต้องล็อกอินมาไม่นาน (~5 นาที) ถึงจะลบบัญชีได้ → ยืนยันตัวตนใหม่ก่อนลบข้อมูล (ถ้ายกเลิก จะไม่มีอะไรถูกลบ)
      const last = Date.parse(cur.metadata?.lastSignInTime || 0) || 0;
      if (Date.now() - last > 4 * 60 * 1000) {
        const provider = new firebase.auth.GoogleAuthProvider();
        provider.setCustomParameters({ login_hint: cur.email || '' });
        await cur.reauthenticateWithPopup(provider);
      }
      const base = fbDb.collection('users').doc(cur.uid);
      const snap = await base.collection('gigs').get();
      const ops = snap.docs.map((d) => ({ type: 'del', ref: d.ref }));
      ops.push({ type: 'del', ref: base.collection('meta').doc('venues') }, { type: 'del', ref: base.collection('meta').doc('settings') });
      await commitOps(ops);
      try { localStorage.removeItem(`gigflow.migrated.${cur.uid}`); } catch (e) {}
      await cur.delete();                       // → onAuthStateChanged(null) → กลับหน้าล็อกอิน
    } catch (e) {
      console.error(e);
      const msg = e?.code === 'auth/popup-closed-by-user' || e?.code === 'auth/cancelled-popup-request' ? 'ยกเลิกการลบบัญชี — ไม่มีข้อมูลถูกลบ'
        : e?.code === 'auth/popup-blocked' || e?.code === 'auth/operation-not-supported-in-this-environment' ? 'ยืนยันตัวตนไม่ได้ในโหมดแอป — เปิดผ่าน Safari แล้วลองใหม่'
        : e?.code === 'auth/user-mismatch' ? 'ต้องยืนยันด้วยบัญชี Google เดิม'
        : 'ลบบัญชีไม่สำเร็จ กรุณาลองใหม่';
      toast(msg, 'error');
    }
  };
  const askDeleteAccount = () => setAction({
    title: 'ลบบัญชีและข้อมูลถาวร?',
    message: `ข้อมูลทั้งหมดของ ${user?.email || 'บัญชีนี้'} — คิวงาน ${gigs.length} รายการ ร้านที่บันทึกไว้ และการตั้งค่า — จะถูกลบออกจากคลาวด์และทุกเครื่อง แล้วออกจากระบบ`,
    actions: [{ label: 'ดำเนินการต่อ…', destructive: true, onClick: () => setAction({
      title: 'ยืนยันครั้งสุดท้าย: ลบถาวร กู้คืนไม่ได้',
      message: 'แนะนำให้ Export สำรองข้อมูลเก็บไว้ก่อน ระบบจะขอให้ยืนยันบัญชี Google อีกครั้ง',
      actions: [
        { label: 'Export สำรองข้อมูลก่อน', bold: true, onClick: handleExport },
        { label: 'ลบบัญชีและข้อมูลถาวร', destructive: true, onClick: doDeleteAccount },
      ],
    }) }],
  });

  if (!sync.ready) return <Splash text="กำลังโหลดข้อมูลของคุณ…" />;

  const closeDrawerThen = (fn) => () => { setDrawerOpen(false); fn(); };
  return (
    <MenuCtx.Provider value={{ open: () => setDrawerOpen(true), badge: issueCount, update: update.available }}>
    <div className="min-h-screen">
      <main className="max-w-md mx-auto min-h-screen relative">
        {update.available && (
          <button onClick={applyUpdate} className="sticky top-0 z-30 w-full text-white text-[13px] font-semibold flex items-center justify-center gap-1.5 py-2 bg-[#007AFF]" style={{ paddingTop: 'calc(env(safe-area-inset-top) + 8px)' }}>
            <Icon name="system_update" size={17} />มีอัปเดตใหม่ v{update.latest} — แตะเพื่อโหลด
          </button>
        )}
        {tab === 'home' && <HomeView gigs={gigs} now={now} theme={theme} setTheme={setTheme} onAdd={openCreate} onEdit={openEdit} onDemo={loadDemo} goTab={setTab} user={user} sync={sync} onAccount={() => setDrawerOpen(true)} onResolveIssue={resolveIssue} />}
        {tab === 'schedule' && <ScheduleView gigs={gigs} now={now} theme={theme} setTheme={setTheme} onAdd={openCreate} onEdit={openEdit} onLineShare={handleLineShare} />}
        {tab === 'finance' && <FinanceView gigs={gigs} now={now} theme={theme} setTheme={setTheme} onEdit={openEdit} onMarkPaid={markPaid} onBatch={() => setBatchOpen(true)} onExport={handleExport} onImport={handleImport} onDemo={loadDemo} onClear={clearAll} user={user} openPastCount={openPast.length} onClosePast={askClosePast} />}
      </main>
      <TabBar tab={tab} setTab={setTab} onAdd={() => openCreate()} />
      {drawerOpen && (
        <Drawer onClose={() => setDrawerOpen(false)} user={user} sync={sync} issueCount={issueCount} venueCount={Object.keys(presets).length} settings={settings} install={install} update={update} toast={toast}
          onSettings={closeDrawerThen(() => setSettingsOpen(true))}
          onVenues={closeDrawerThen(() => setVenueSheetOpen(true))}
          onInstall={closeDrawerThen(() => setInstallOpen(true))}
          onIssues={closeDrawerThen(() => { setTab('home'); setTimeout(() => document.getElementById('issue-alerts')?.scrollIntoView({ behavior: 'smooth', block: 'center' }), 80); })}
          onSignOut={closeDrawerThen(askSignOut)}
          onDeleteAccount={closeDrawerThen(askDeleteAccount)} />
      )}
      {settingsOpen && <SettingsSheet settings={settings} onClose={() => setSettingsOpen(false)} onSave={(s) => { setSettings(s); setSettingsOpen(false); toast('บันทึกการตั้งค่าแล้ว'); }} />}
      {installOpen && <InstallSheet install={install} onClose={() => setInstallOpen(false)} />}
      {sheet && <GigSheet key={sheet.key} mode={sheet.mode} initial={sheet.gig} gigs={gigs} presets={presets} bands={bands} settings={settings} onUpdateSettings={(patch) => setSettings((st) => normalizeSettings({ ...st, ...patch }))} onDeleteVenue={askDeleteVenue} onClose={() => setSheet(null)} onSave={handleSave} onDelete={handleDelete} toast={toast} />}
      {venueSheetOpen && <VenueSheet presets={presets} onClose={() => setVenueSheetOpen(false)} onDelete={askDeleteVenue} />}
      {batchOpen && <BatchSheet gigs={gigs} presets={presets} bands={bands} mainBands={settings.bands} bandMembers={settings.bandMembers} onClose={() => setBatchOpen(false)} onSave={handleBatchSave} />}
      <ActionSheet config={action} onClose={() => setAction(null)} />
      <Toast toast={toastState} />
    </div>
    </MenuCtx.Provider>
  );
}

// expose pure logic for self-tests in the console: window.GigFlowLogic
window.GigFlowLogic = { gigRange, findIssues, genRecurringDates, applyScope, computeStats, calendarUrl, mapsDirUrl, buildLineText, makeDemo, sumMoney, parseMoney, parseLatLng, routeTargetFromUrl, issueCalendarUrl, issueReminderAbs, needsIssueCheck, normalizeGig, cmpVer };

/* =====================================================================
   ROOT: ถ้าตั้งค่า Firebase แล้ว → ต้องล็อกอินด้วย Google ก่อนใช้งาน (ข้อมูลแยกตามบัญชี)
   ===================================================================== */
function AuthGate() {
  const [st, setSt] = useAuthState();
  const setError = (error) => setSt((s) => ({ ...s, error }));
  if (st.status === 'loading') return <Splash />;
  if (st.status === 'out') return <LoginScreen error={st.error} setError={setError} />;
  return <App key={st.user.uid} user={st.user} />;
}
function Root() {
  if (!CLOUD_CONFIGURED) return <App />;
  if (!fbAuth) {
    return (
      <div className="min-h-screen flex flex-col items-center justify-center gap-4 px-8 text-center">
        <AppLogo size={72} />
        <div className="text-[17px] font-semibold">โหลดระบบล็อกอินไม่สำเร็จ</div>
        <div className="text-[14px] text-[#8E8E93]">กรุณาตรวจสอบการเชื่อมต่ออินเทอร์เน็ต หรือค่า Firebase config ในไฟล์ index.html</div>
        <button onClick={() => location.reload()} className="h-11 px-6 rounded-full bg-[#5856D6] text-white font-semibold">ลองใหม่</button>
      </div>
    );
  }
  return <AuthGate />;
}

ReactDOM.createRoot(document.getElementById('root')).render(<Root />);
</script>
</body>
</html>

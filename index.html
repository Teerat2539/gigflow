const GroupLabel = ({ children }) => <div className="px-4 pt-5 pb-1.5 text-[13px] text-[#8E8E93] uppercase tracking-wide">{children}</div>;
const inputCls = 'bg-transparent outline-none text-right text-[16px] w-full placeholder:text-[#C7C7CC] dark:placeholder:text-[#5A5A5E] text-[#3C3C43] dark:text-[#EBEBF5]';

/* ---------- ทางลัดค่าตัว: สูงสุด 4 ราคา กรอก/แก้เองได้ (จำไว้ในตั้งค่าบัญชี) ---------- */
function FeePresets({ presets, value, onPick, onChange }) {
  const [editing, setEditing] = useState(false);
  const [draft, setDraft] = useState([]);
  const [focusIdx, setFocusIdx] = useState(0);
  const start = (i) => { setDraft(Array.from({ length: MAX_FEE_PRESETS }, (_, k) => (presets[k] ? String(presets[k]) : ''))); setFocusIdx(i); setEditing(true); };
  const done = () => { onChange(draft.map(parseMoney).filter((v) => v > 0)); setEditing(false); };
  if (editing) {
    return (
      <div className="px-4 pt-2 anim-fade">
        <div className="flex gap-2">
          {draft.map((d, i) => (
            <div key={i} className="flex-1 min-w-0 relative">
              <input autoFocus={i === focusIdx} inputMode="decimal" value={d} placeholder="฿"
                onChange={(e) => { const v = e.target.value.replace(/[^\d.,]/g, ''); setDraft((x) => x.map((y, k) => (k === i ? v : y))); }}
                onKeyDown={(e) => { if (e.key === 'Enter') done(); }}
                aria-label={`ทางลัดค่าตัวช่องที่ ${i + 1}`}
                className="w-full h-9 rounded-full text-center text-[13px] font-semibold tnum bg-white dark:bg-[#2C2C2E] outline-none ring-2 ring-[#5856D6]/40 focus:ring-[#5856D6] placeholder:text-[#C7C7CC]" />
              {d && <button onClick={() => setDraft((x) => x.map((y, k) => (k === i ? '' : y)))} aria-label="ล้างช่องนี้" className="absolute -top-1.5 -right-1 w-5 h-5 rounded-full bg-[#8E8E93] text-white flex items-center justify-center"><Icon name="close" size={13} /></button>}
            </div>
          ))}
        </div>
        <div className="flex justify-end gap-2 mt-2">
          <button onClick={() => setEditing(false)} className="h-8 px-3 rounded-full text-[13px] font-semibold text-[#8E8E93]">ยกเลิก</button>
          <button onClick={done} className="h-8 px-4 rounded-full bg-[#5856D6] text-white text-[13px] font-semibold">บันทึกทางลัด</button>
        </div>
      </div>
    );
  }
  return (
    <div className="flex gap-2 px-4 pt-2 items-center">
      {Array.from({ length: MAX_FEE_PRESETS }, (_, i) => presets[i]).map((v, i) => v ? (
        <button key={i} onClick={() => onPick(v)} className={`flex-1 min-w-0 h-8 rounded-full text-[13px] font-semibold tnum whitespace-nowrap ${parseMoney(value) === v ? 'bg-[#5856D6] text-white' : 'bg-white dark:bg-[#2C2C2E]'}`}>{fmtMoney(v)}</button>
      ) : (
        <button key={i} onClick={() => start(i)} aria-label={`เพิ่มทางลัดค่าตัวช่องที่ ${i + 1}`} className="flex-1 min-w-0 h-8 rounded-full border-2 border-dashed border-[#C7C7CC] dark:border-[#48484A] text-[#8E8E93] text-[12px] font-semibold flex items-center justify-center gap-0.5"><Icon name="add" size={15} />ราคา</button>
      ))}
      <button onClick={() => start(0)} aria-label="แก้ไขทางลัดค่าตัว" className="w-8 h-8 shrink-0 rounded-full bg-[#767680]/[0.12] text-[#5856D6] dark:text-[#A5A3FF] flex items-center justify-center"><Icon name="edit" size={16} /></button>
    </div>
  );
}

function IssueBanners({ issues, multiDates }) {
  if (!issues.conflicts.length && !issues.tight.length) return null;
  const fmtG = (x) => `${x.gig.venueName} (${x.gig.startTime}–${x.gig.endTime}${multiDates ? `, ${fmtDateShort(x.date)}` : ''})`;
  return (
    <div className="px-4 pt-3 space-y-2">
      {issues.conflicts.length > 0 && (
        <div className="rounded-[14px] bg-[#FF3B30] text-white px-3.5 py-3 flex gap-2.5 anim-pop">
          <Icon name="event_busy" fill size={22} />
          <div className="text-[13.5px] leading-snug">
            <div className="font-bold">คิวชน! ทับซ้อนกับงานอื่น {issues.conflicts.length} รายการ</div>
            {issues.conflicts.slice(0, 3).map((x, i) => <div key={i} className="opacity-90">• {fmtG(x)}</div>)}
            {issues.conflicts.length > 3 && <div className="opacity-80">และอีก {issues.conflicts.length - 3} รายการ</div>}
          </div>
        </div>
      )}
      {issues.tight.length > 0 && (
        <div className="rounded-[14px] bg-[#FF9500] text-white px-3.5 py-3 flex gap-2.5 anim-pop">
          <Icon name="directions_car" fill size={22} />
          <div className="text-[13.5px] leading-snug">
            <div className="font-bold">เวลาเก็บของ & เดินทางอาจไม่ทัน</div>
            {issues.tight.slice(0, 3).map((x, i) => (
              <div key={i} className="opacity-95">• {x.dir === 'before' ? 'หลังจบ' : 'ก่อนไป'} {fmtG(x)} เหลือเวลา {fmtDur(x.gap)} (ต้องใช้ {fmtDur(x.need)})</div>
            ))}
          </div>
        </div>
      )}
    </div>
  );
}

/* =====================================================================
   GIG FORM — หน้าเดียว (เพิ่มคิว / แก้ไข / สร้างสำเนา)
   ===================================================================== */
const defaultStatusFor = (type) => (type === 'regular' || type === 'rehearsal' ? 'confirmed' : 'pending');

function GigForm({ mode, initial, gigs, profiles, bands, settings = DEFAULT_SETTINGS, onUpdateSettings = () => {}, onClose, onSave, onDelete, toast }) {
  const isEdit = mode === 'edit';
  const isCopy = mode === 'copy';
  const [f, setF] = useState(() => ({
    gigType: initial.gigType || '',
    venueName: initial.venueName || '',
    mapsUrl: initial.mapsUrl || '',
    baseFee: initial.baseFee ? String(initial.baseFee) : '',
    venueNote: (profiles[initial.venueName] && profiles[initial.venueName].note) || '',
    date: isCopy ? '' : (initial.date || ''),
    startTime: initial.startTime || '21:00',
    duration: initial.startTime && initial.endTime ? durBetween(initial.startTime, initial.endTime) : DEFAULT_DURATION,
    bandName: initial.bandName || '',
    members: String(initial.members || 1),
    status: initial.status || (initial.gigType ? defaultStatusFor(initial.gigType) : 'pending'),
    issueNote: initial.issueNote || '',
    notes: initial.notes || '',
    travelMinutes: String(initial.travelMinutes ?? 30),
  }));
  const set = (k, v) => setF((p) => ({ ...p, [k]: v }));
  const [days, setDays] = useState(() => (isValidDate(initial.date) ? [weekdayOf(initial.date)] : []));
  const [venueOpen, setVenueOpen] = useState(isEdit ? false : !profiles[initial.venueName]);
  const [venueFocus, setVenueFocus] = useState(false);
  const [statusOpen, setStatusOpen] = useState(false);
  const statusTouched = useRef(isEdit || isCopy);
  const membersManual = useRef(isEdit);

  const type = GIG_TYPES[f.gigType] ? f.gigType : '';
  const money = type !== 'rehearsal';
  const endTime = endTimeFrom(f.startTime, f.duration);
  const overnight = isValidTime(f.startTime) && toMin(endTime) <= toMin(f.startTime);
  const membersN = Math.min(Math.max(parseInt(f.members, 10) || 1, 1), 99);
  const regularMulti = !isEdit && type === 'regular';
  const allDates = regularMulti ? genMonthDates(f.date, days) : (isValidDate(f.date) ? [f.date] : []);
  const cancelled = isEdit && initial.status === 'cancelled';

  /* ---------- ร้าน: ดรอปดาวน์ ร้านประเภทนี้ก่อน + ร้านอื่น ---------- */
  const findProfile = (name) => { const n = name.trim().toLowerCase(); const k = Object.keys(profiles).find((x) => x.toLowerCase() === n); return k ? profiles[k] : null; };
  const applyProfile = (p, t = type) => {
    const d = p.byType[t];
    setF((prev) => ({
      ...prev, venueName: p.name, mapsUrl: p.mapsUrl || prev.mapsUrl, venueNote: p.note || '',
      ...(d ? {
        startTime: isValidTime(d.startTime) ? d.startTime : prev.startTime,
        duration: d.duration || prev.duration,
        baseFee: d.baseFee ? String(d.baseFee) : prev.baseFee,
        bandName: d.bandName || prev.bandName,
        members: d.members ? String(d.members) : prev.members,
      } : {}),
    }));
    if (d && d.members) membersManual.current = true;
    setVenueOpen(false);
    if (d) toast(`ใส่ค่าเริ่มต้นของ “${p.name}” แล้ว`, 'auto_awesome');
  };
  const q = f.venueName.trim().toLowerCase();
  const matches = Object.values(profiles).filter((p) => !q || (p.name.toLowerCase().includes(q) && p.name.toLowerCase() !== q));
  const sameType = matches.filter((p) => type && p.byType[type]).sort((a, b) => b.count - a.count);
  const otherType = matches.filter((p) => !(type && p.byType[type])).sort((a, b) => b.count - a.count);
  const chooseType = (t) => {
    set('gigType', t);
    if (!statusTouched.current) set('status', defaultStatusFor(t));
    if (!isEdit && t === 'regular' && !days.length && isValidDate(f.date)) setDays([weekdayOf(f.date)]);
    const p = findProfile(f.venueName);
    if (p && p.byType[t] && !isEdit) applyProfile(p, t);
  };

  /* ---------- จำนวนสมาชิก: เติมตามวง ---------- */
  const lastBand = useRef(f.bandName);
  useEffect(() => {
    if (lastBand.current === f.bandName) return;
    lastBand.current = f.bandName;
    membersManual.current = false;
    const n = settings.bandMembers[f.bandName.trim()];
    if (n) set('members', String(n));
  }, [f.bandName]);
  const setMembers = (n) => { membersManual.current = true; set('members', String(Math.min(Math.max(n, 1), 99))); };
  const allBands = [...settings.bands, ...bands.filter((b) => !settings.bands.includes(b))];

  /* ---------- เช็คคิวชน (งานใหม่: ชน = บันทึกไม่ได้) ---------- */
  const draft = { ...f, endTime, travelMinutes: parseIntSafe(f.travelMinutes, 30), status: cancelled ? 'cancelled' : f.status };
  const neighbors = useMemo(() => {
    if (!isValidDate(f.date) || !isValidTime(f.startTime) || regularMulti) return { prev: null, next: null };
    const me = { ...draft, id: initial.id || '__new' };
    const [, e] = gigRange(me);
    const prev = findPrevGig(me, gigs);
    let next = null;
    gigs.forEach((g) => { if (g.id === me.id || !ACTIVE.has(g.status)) return; const [gs] = gigRange(g); if (gs >= e && gs - e < 360 && (!next || gs < gigRange(next)[0])) next = g; });
    return { prev, next };
  }, [f.date, f.startTime, f.duration, gigs, regularMulti]);

  const [travelInfo, setTravelInfo] = useState(null);
  const [nextLeg, setNextLeg] = useState(null);
  const manualTravel = useRef(false);
  const runId = useRef(0);
  const travelKey = `${f.venueName.trim()}|${f.mapsUrl.trim()}|${f.date}|${neighbors.prev ? neighbors.prev.id : 'home'}|${settings.homeMapsUrl}|${settings.packMinutes}`;
  const initialTravelKey = useRef(isEdit ? travelKey : null);
  const calcTravel = useCallback((force) => {
    const id = ++runId.current;
    if (!f.venueName.trim()) { setTravelInfo(null); setNextLeg(null); return; }
    const ref = homeLatLng(settings);
    const dest = routeTargetFromUrl(f.mapsUrl, ref);
    const nx = neighbors.next;
    const nxDest = nx ? routeTargetFromUrl(nx.mapsUrl, ref) : null;
    if (dest && nxDest && MAPS_KEY) {
      fetchDriveMinutes(dest, nxDest, gigRange(nx)[0] - 60)
        .then((r) => { if (id === runId.current) setNextLeg({ gigId: nx.id, need: r.minutes + settings.packMinutes, text: `ไป ${nx.venueName} ขับรถ ${r.minutes} นาที + เผื่อเก็บของ ${settings.packMinutes} นาที` }); })
        .catch(() => { if (id === runId.current) setNextLeg(null); });
    } else setNextLeg(null);
    if (!dest) { setTravelInfo({ state: 'manual', text: !f.mapsUrl.trim() ? 'ร้านนี้ยังไม่มีโลเคชั่น — ใส่ Plus Code หรือลิงก์ Google Maps เพื่อคำนวณอัตโนมัติ' : `${mapRefStatus(f.mapsUrl, ref).text}` }); return; }
    let origin, from;
    if (neighbors.prev) {
      origin = routeTargetFromUrl(neighbors.prev.mapsUrl, ref); from = neighbors.prev.venueName;
      if (!origin) { setTravelInfo({ state: 'manual', text: `ร้านก่อนหน้า (${from}) ยังไม่มีโลเคชั่นที่อ่านได้ — กรอกเวลาเอง` }); return; }
    } else {
      origin = homeTarget(settings); from = 'บ้าน';
      if (!origin) { setTravelInfo({ state: 'manual', text: 'ยังไม่ได้ตั้งตำแหน่งบ้าน — ตั้งได้ที่เมนู ☰ › ตั้งค่าบัญชี' }); return; }
    }
    if (!MAPS_KEY) { setTravelInfo({ state: 'manual', text: routeErrorText({ code: 'no-key' }) }); return; }
    if (!force && manualTravel.current) return;
    setTravelInfo({ state: 'loading', text: `กำลังคำนวณเวลาเดินทางจาก${from}…` });
    const startAbs = isValidDate(f.date) && isValidTime(f.startTime) ? gigRange({ date: f.date, startTime: f.startTime, endTime })[0] : 0;
    fetchDriveMinutes(origin, dest, startAbs ? startAbs - 60 : 0)
      .then((r) => {
        if (id !== runId.current) return;
        manualTravel.current = false;
        setF((p) => ({ ...p, travelMinutes: String(r.minutes + settings.packMinutes) }));
        setTravelInfo({ state: 'ok', text: `ขับรถจาก${from} ${r.minutes} นาที (${r.km} กม.${r.traffic ? ' · คิดสภาพจราจร' : ''}) + เผื่อเก็บของ ${settings.packMinutes} นาที` });
      })
      .catch((e) => { if (id === runId.current) setTravelInfo({ state: 'error', text: routeErrorText(e) }); });
  }, [f.venueName, f.mapsUrl, f.date, f.startTime, endTime, neighbors, settings]);
  useEffect(() => {
    if (initialTravelKey.current === travelKey) return;
    initialTravelKey.current = null;
    manualTravel.current = false;
    const t = setTimeout(() => calcTravel(false), 700);
    return () => clearTimeout(t);
  }, [travelKey]);

  const exclude = new Set(isEdit ? [initial.id] : []);
  const perDate = allDates.map((d) => ({ date: d, ...findIssues({ ...draft, date: d }, gigs, exclude, nextLeg ? { [nextLeg.gigId]: nextLeg.need } : {}) }));
  const clashDates = perDate.filter((x) => x.conflicts.length).map((x) => x.date);
  const okDates = allDates.filter((d) => !clashDates.includes(d));
  const issues = { conflicts: perDate.flatMap((x) => x.conflicts), tight: perDate.flatMap((x) => x.tight) };
  const blockedByClash = !isEdit && allDates.length > 0 && okDates.length === 0;

  /* ---------- ตรวจความครบถ้วน ---------- */
  const missing = [];
  if (!type) missing.push('ประเภทงาน');
  if (!f.venueName.trim()) missing.push('ชื่อร้าน');
  if (!isValidDate(f.date)) missing.push('วันที่เล่น');
  if (!isValidTime(f.startTime)) missing.push('เวลาเริ่ม');
  if (!(f.duration > 0)) missing.push('ระยะเวลาเล่น');
  if (f.status === 'issue' && !f.issueNote.trim()) missing.push('ปัญหาที่ติด');
  if (regularMulti && !days.length) missing.push('วันประจำ');
  if (regularMulti && isValidDate(f.date) && days.length && !allDates.length) missing.push('วันประจำที่เหลือในเดือนนี้');
  const valid = !missing.length && !blockedByClash;
  const isRetro = !isEdit && isPastDate(f.date);

  const submit = () => {
    if (missing.length) { toast(`ยังไม่ได้กรอก: ${missing.join(', ')}`, 'error'); return; }
    if (blockedByClash) { toast('เวลาชนกับงานที่มีอยู่แล้ว — บันทึกไม่ได้', 'error'); return; }
    const data = {
      gigType: type, venueName: f.venueName.trim(), mapsUrl: isMapRef(f.mapsUrl) ? f.mapsUrl.trim() : '',
      baseFee: money ? parseMoney(f.baseFee) : 0, date: f.date, startTime: f.startTime, endTime,
      bandName: f.bandName.trim(), members: membersN, status: cancelled ? 'cancelled' : f.status,
      issueNote: f.status === 'issue' ? f.issueNote.trim() : '', notes: f.notes,
      travelMinutes: parseIntSafe(f.travelMinutes, 30),
    };
    onSave({ mode: isEdit ? 'edit' : 'create', original: initial, data, venueNote: f.venueNote.trim(), dates: isEdit ? [f.date] : okDates, skipped: isEdit ? [] : clashDates });
  };

  const durH = Math.floor(f.duration / 60), durM = f.duration % 60;
  const selCls = 'h-9 rounded-[9px] bg-[#767680]/[0.12] dark:bg-[#767680]/[0.24] px-2 text-[16px] font-semibold tnum outline-none appearance-none text-center';
  const title = isEdit ? 'แก้ไขงาน' : isCopy ? 'สร้างสำเนางาน' : 'เพิ่มคิวงาน';
  const saveLabel = isEdit ? 'บันทึก' : okDates.length > 1 ? `บันทึก ${okDates.length} งาน` : 'บันทึก';

  return (
    <Sheet onClose={onClose} full>
      <div className="pt-4 px-2 flex items-center justify-between shrink-0">
        <button onClick={onClose} className="h-10 px-3 text-[17px] text-[#5856D6] dark:text-[#A5A3FF]">ยกเลิก</button>
        <div className="text-[17px] font-semibold">{title}</div>
        <button onClick={submit} className={`h-10 px-3 text-[17px] font-semibold ${valid ? 'text-[#5856D6] dark:text-[#A5A3FF]' : 'text-[#C7C7CC] dark:text-[#48484A]'}`}>{isEdit ? 'บันทึก' : 'เพิ่ม'}</button>
      </div>
      <IssueBanners issues={isEdit || !regularMulti ? issues : { conflicts: [], tight: issues.tight }} multiDates={regularMulti} />
      {!isEdit && issues.conflicts.length > 0 && (
        <div className="px-4 pt-2 text-[13px] st-cancelled font-semibold">
          {blockedByClash ? 'มีงานในเวลานี้อยู่แล้ว — เปลี่ยนวัน/เวลาก่อนบันทึก' : `จะข้ามวันที่ชน ${clashDates.length} วัน: ${clashDates.map(fmtDateShort).join(', ')}`}
        </div>
      )}

      <div className="flex-1 overflow-y-auto no-scrollbar sheet-pad">
        {/* 1. ประเภทงาน */}
        <GroupLabel>ประเภทงาน *</GroupLabel>
        <div className="mx-4 grid grid-cols-4 gap-1.5">
          {GIG_TYPE_ORDER.map((k) => {
            const t = GIG_TYPES[k], on = type === k;
            return (
              <button key={k} onClick={() => chooseType(k)} aria-pressed={on}
                className={`min-h-[58px] rounded-[12px] px-1 py-1.5 flex flex-col items-center justify-center gap-0.5 text-[12.5px] font-semibold leading-tight border-2 transition-all ${on ? 'bg-white dark:bg-[#2C2C2E]' : 'bg-white/60 dark:bg-[#2C2C2E]/50 border-transparent text-black/60 dark:text-white/60'}`}
                style={on ? { borderColor: t.color } : {}}>
                <Icon name={t.icon} fill={on} size={21} style={{ color: t.color }} />{t.short === 'อีเว้นท์' ? 'อีเว้นท์' : t.short}
              </button>
            );
          })}
        </div>

        {/* 2. ชื่อร้าน + รายละเอียดร้าน (พับได้) */}
        <GroupLabel>ร้าน / สถานที่ *</GroupLabel>
        <div className="mx-4 rounded-[12px] bg-white dark:bg-[#2C2C2E] overflow-hidden">
          <div className="flex items-center gap-3 px-4 min-h-[50px]">
            <span className="w-[30px] h-[30px] rounded-[8px] flex items-center justify-center text-white shrink-0 bg-[#5856D6]"><Icon name="storefront" size={18} /></span>
            <input value={f.venueName} placeholder={type ? `ชื่อร้าน (${GIG_TYPES[type].short})` : 'ชื่อร้าน'} autoComplete="off"
              onChange={(e) => set('venueName', e.target.value)}
              onFocus={() => setVenueFocus(true)}
              onBlur={() => { setVenueFocus(false); const p = findProfile(f.venueName); if (p && !isEdit && p.name !== initial.venueName) applyProfile(p); }}
              className="flex-1 min-w-0 bg-transparent outline-none text-[16px] placeholder:text-[#C7C7CC] dark:placeholder:text-[#5A5A5E]" />
            {f.venueName.trim() && (
              <button onClick={() => setVenueOpen((o) => !o)} aria-expanded={venueOpen} aria-label="รายละเอียดร้าน" className="shrink-0 h-8 pl-2.5 pr-1.5 rounded-full bg-[#767680]/[0.12] text-[12px] font-semibold text-[#5856D6] dark:text-[#A5A3FF] flex items-center">
                รายละเอียด<Icon name={venueOpen ? 'expand_less' : 'expand_more'} size={18} />
              </button>
            )}
          </div>
          {venueFocus && (sameType.length + otherType.length) > 0 && (
            <div className="border-t border-black/[0.08] dark:border-white/[0.1] max-h-[260px] overflow-y-auto">
              {[[type ? `ร้าน${GIG_TYPES[type].short}` : 'ร้านที่เคยบันทึก', sameType], ['ร้านอื่น ๆ', otherType]].map(([label, list]) => list.length > 0 && (
                <div key={label}>
                  <div className="px-4 pt-2 pb-0.5 text-[11px] font-semibold text-[#8E8E93] uppercase">{label}</div>
                  {list.slice(0, 8).map((p) => {
                    const d = type && p.byType[type];
                    return (
                      <button key={p.name} onMouseDown={(e) => e.preventDefault()} onClick={() => { applyProfile(p); setVenueFocus(false); document.activeElement && document.activeElement.blur(); }}
                        className="w-full flex items-center gap-3 px-4 py-2 text-left active:bg-black/5 dark:active:bg-white/5">
                        <Icon name="history" size={18} className="text-[#8E8E93]" />
                        <div className="flex-1 min-w-0">
                          <div className="text-[15px] font-medium truncate">{p.name}</div>
                          <div className="text-[12px] text-[#8E8E93] tnum truncate">{d ? `${d.startTime} · ${fmtDurShort(d.duration)}${d.baseFee ? ` · ${fmtMoney(d.baseFee)}` : ''}${d.bandName ? ` · ${d.bandName}` : ''}` : p.mapsUrl ? 'มีโลเคชั่น' : 'ยังไม่มีค่าเริ่มต้นของประเภทนี้'}</div>
                        </div>
                      </button>
                    );
                  })}
                </div>
              ))}
            </div>
          )}
          {venueOpen && f.venueName.trim() && (
            <div className="border-t border-black/[0.08] dark:border-white/[0.1] anim-fade">
              <div className="flex items-center gap-3 px-4 min-h-[48px]">
                <span className="w-[30px] h-[30px] rounded-[8px] flex items-center justify-center text-white shrink-0 bg-[#34C759]"><Icon name="location_on" size={18} /></span>
                <input type="text" autoCapitalize="characters" autoCorrect="off" spellCheck={false} value={f.mapsUrl} onChange={(e) => set('mapsUrl', e.target.value)} placeholder="โลเคชั่น: Plus Code หรือลิงก์ Google Maps" className="flex-1 min-w-0 bg-transparent outline-none text-[15px] placeholder:text-[#C7C7CC] dark:placeholder:text-[#5A5A5E]" />
                {isMapRef(f.mapsUrl) && <button onClick={() => openUrl(mapsPlaceUrl({ venueName: f.venueName, mapsUrl: f.mapsUrl }))} className="text-[13px] font-semibold text-[#5856D6] dark:text-[#A5A3FF] shrink-0">ดูแมพ</button>}
              </div>
              {f.mapsUrl.trim() && (() => { const st = mapRefStatus(f.mapsUrl, homeLatLng(settings)); return <div className={`px-4 pb-2 -mt-1 text-[12px] flex items-start gap-1 ${st.ok ? 'st-confirmed' : 'st-issue'}`}><Icon name={st.ok ? 'check_circle' : 'info'} size={14} fill={st.ok} />{st.text}</div>; })()}
              {money && (<>
                <Sep />
                <Row label="ค่าตัว (ของฉัน)" icon="payments" iconBg="#5856D6">
                  <input inputMode="decimal" value={f.baseFee} onChange={(e) => set('baseFee', e.target.value.replace(/[^\d.,]/g, ''))} placeholder="0" className={inputCls + ' tnum font-semibold'} />
                </Row>
                <div className="pb-2.5 -mt-1">
                  <FeePresets presets={settings.feePresets} value={f.baseFee} onPick={(v) => set('baseFee', String(v))}
                    onChange={(arr) => { onUpdateSettings({ feePresets: arr }); toast('บันทึกทางลัดค่าตัวแล้ว', 'bolt'); }} />
                </div>
              </>)}
              <Sep />
              <div className="flex gap-3 px-4 py-2.5">
                <span className="w-[30px] h-[30px] rounded-[8px] flex items-center justify-center text-white shrink-0 bg-[#FF9500]"><Icon name="sticky_note_2" size={18} /></span>
                <textarea value={f.venueNote} onChange={(e) => set('venueNote', e.target.value)} rows={2} placeholder="โน้ตของร้าน เช่น ที่จอดรถ เบอร์ผู้จัดการ (ใช้กับทุกงานของร้านนี้)" className="flex-1 bg-transparent outline-none text-[15px] resize-none placeholder:text-[#C7C7CC] dark:placeholder:text-[#5A5A5E]" />
              </div>
            </div>
          )}
        </div>
        {!venueOpen && f.venueName.trim() && (
          <button onClick={() => setVenueOpen(true)} className="mx-5 mt-1.5 text-left text-[12.5px] text-[#8E8E93] flex flex-wrap gap-x-2">
            <span className="flex items-center gap-0.5"><Icon name="location_on" size={14} />{f.mapsUrl.trim() ? (mapRefStatus(f.mapsUrl, homeLatLng(settings)).ok ? 'มีโลเคชั่น' : 'โลเคชั่นอ่านไม่ได้') : 'ยังไม่มีโลเคชั่น'}</span>
            {money && <span className="tnum">· ค่าตัว {fmtMoney(parseMoney(f.baseFee))}</span>}
            {f.venueNote.trim() && <span className="truncate max-w-[180px]">· {f.venueNote.trim()}</span>}
          </button>
        )}

        {/* 3. วันเวลา */}
        <GroupLabel>{regularMulti ? 'เริ่มวันที่ · เวลา *' : 'วันที่ · เวลา *'}</GroupLabel>
        <div className="mx-4 rounded-[12px] bg-white dark:bg-[#2C2C2E] overflow-hidden">
          <Row label="วันที่เล่น" icon="calendar_today" iconBg="#FF3B30"><input type="date" value={f.date} onChange={(e) => { set('date', e.target.value); if (regularMulti && isValidDate(e.target.value) && !days.length) setDays([weekdayOf(e.target.value)]); }} className={inputCls} /></Row>
          <Sep />
          <Row label="เวลาเริ่ม" icon="play_arrow" iconBg="#34C759"><input type="time" value={f.startTime} onChange={(e) => set('startTime', e.target.value)} className={inputCls} /></Row>
          <Sep />
          <Row label="เล่นนาน" icon="timelapse" iconBg="#FF9500">
            <div className="flex items-center gap-1.5">
              <select aria-label="ชั่วโมง" value={durH} onChange={(e) => set('duration', Number(e.target.value) * 60 + durM)} className={selCls}>
                {Array.from({ length: 13 }, (_, h) => <option key={h} value={h}>{h}</option>)}
              </select>
              <span className="text-[14px] text-[#8E8E93]">ชม.</span>
              <select aria-label="นาที" value={durM} onChange={(e) => set('duration', durH * 60 + Number(e.target.value))} className={selCls}>
                {Array.from({ length: 12 }, (_, i) => i * 5).map((m) => <option key={m} value={m}>{pad(m)}</option>)}
              </select>
              <span className="text-[14px] text-[#8E8E93]">นาที</span>
            </div>
          </Row>
          {isValidTime(f.startTime) && f.duration > 0 && (
            <div className="px-4 pb-2.5 text-[13px] text-right tnum">
              เลิก <b>{endTime}</b>{overnight && <span className="text-[#5856D6] dark:text-[#A5A3FF] font-semibold"> (ข้ามคืน → {isValidDate(f.date) ? fmtDateShort(addDays(f.date, 1)) : 'วันถัดไป'})</span>}
            </div>
          )}
        </div>
        {regularMulti && (
          <div className="mx-4 mt-2 rounded-[12px] bg-white dark:bg-[#2C2C2E] px-4 py-3 anim-fade">
            <div className="text-[13px] text-[#8E8E93] mb-2">ประจำทุกวัน</div>
            <div className="grid grid-cols-7 gap-1.5">
              {[1, 2, 3, 4, 5, 6, 0].map((d) => {
                const on = days.includes(d);
                return <button key={d} onClick={() => setDays((x) => (on ? x.filter((y) => y !== d) : [...x, d]))} aria-pressed={on} className={`h-10 rounded-full text-[14px] font-semibold ${on ? 'bg-[#007AFF] text-white' : 'bg-[#F2F2F7] dark:bg-[#3A3A3C]'}`}>{TH_DAYS_MINI[d]}</button>;
              })}
            </div>
            <div className="mt-2.5 text-[12.5px] text-[#007AFF] dark:text-[#64D2FF] flex items-start gap-1">
              <Icon name="info" size={15} />
              {allDates.length ? `สร้าง ${okDates.length} งานถึงสิ้นเดือน (${fmtDateShort(allDates[0])} – ${fmtDateShort(allDates[allDates.length - 1])}) · เดือนหน้าแอปจะถามว่ายังต่อสัญญาอยู่ไหม` : 'เลือกวันที่เริ่มและวันประจำ'}
            </div>
          </div>
        )}
        {isRetro && (
          <div className="mx-4 mt-2 rounded-[12px] px-3.5 py-2.5 text-[13px] st-confirmed flex items-start gap-2" style={{ background: 'rgba(52,199,89,0.12)' }}>
            <Icon name="task_alt" size={18} fill /><span>งานย้อนหลัง — จะบันทึกเป็น <b>ปิดจ๊อบเรียบร้อย</b> อัตโนมัติ{regularMulti ? ' เฉพาะวันที่ผ่านมาแล้ว' : ''}</span>
          </div>
        )}

        {/* 4. วง + สมาชิก */}
        <GroupLabel>ชื่อวง · จำนวนสมาชิก</GroupLabel>
        <div className="mx-4 rounded-[12px] bg-white dark:bg-[#2C2C2E] overflow-hidden">
          <div className="flex items-center gap-3 px-4 min-h-[50px]">
            <span className="w-[30px] h-[30px] rounded-[8px] flex items-center justify-center text-white shrink-0 bg-[#FF2D55]"><Icon name="groups" size={18} /></span>
            <input value={f.bandName} onChange={(e) => set('bandName', e.target.value)} placeholder="ชื่อวง" className="flex-1 bg-transparent outline-none text-[16px] placeholder:text-[#C7C7CC] dark:placeholder:text-[#5A5A5E]" />
            {f.bandName && <button onClick={() => set('bandName', '')} aria-label="ล้างชื่อวง"><Icon name="cancel" fill size={18} className="text-[#C7C7CC]" /></button>}
          </div>
          <Sep />
          <div className="flex items-center gap-3 px-4 min-h-[50px]">
            <span className="w-[30px] h-[30px] rounded-[8px] flex items-center justify-center text-white shrink-0 bg-[#5AC8FA]"><Icon name="group" size={18} /></span>
            <span className="text-[16px] flex-1">สมาชิก <span className="text-[12px] text-[#8E8E93]">(สำหรับหารทิป)</span></span>
            <div className="flex items-center rounded-[9px] bg-[#767680]/[0.12] dark:bg-[#767680]/[0.24] h-8">
              <button onClick={() => setMembers(membersN - 1)} disabled={membersN <= 1} aria-label="ลดจำนวนสมาชิก" className="w-10 h-8 flex items-center justify-center disabled:opacity-30"><Icon name="remove" size={18} /></button>
              <span className="w-px h-4 bg-black/15 dark:bg-white/20" />
              <button onClick={() => setMembers(membersN + 1)} aria-label="เพิ่มจำนวนสมาชิก" className="w-10 h-8 flex items-center justify-center"><Icon name="add" size={18} /></button>
            </div>
            <span className="w-12 text-right text-[16px] font-semibold tnum">{membersN} คน</span>
          </div>
        </div>
        {allBands.length > 0 && (
          <div className="flex gap-2 overflow-x-auto no-scrollbar px-4 pt-2">
            {allBands.map((b) => (
              <button key={b} onClick={() => set('bandName', f.bandName === b ? '' : b)} className={`h-8 px-3 rounded-full text-[13px] font-semibold whitespace-nowrap flex items-center gap-1 ${f.bandName === b ? 'bg-[#FF2D55] text-white' : 'bg-white dark:bg-[#2C2C2E]'}`}>
                {settings.bands.includes(b) && <Icon name="star" fill size={14} className={f.bandName === b ? 'text-white' : 'text-[#FF9500]'} />}{b}
              </button>
            ))}
          </div>
        )}

        {/* 5. สถานะ (ย่อไว้ แตะเพื่อเลือก) */}
        <GroupLabel>สถานะงาน</GroupLabel>
        <div className="mx-4 rounded-[12px] bg-white dark:bg-[#2C2C2E] overflow-hidden">
          {cancelled ? (
            <div className="px-4 py-3 text-[14px] st-cancelled flex items-center gap-2"><Icon name="cancel" fill size={20} />งานนี้ถูกแคนเซิล — กู้คืนได้ที่หน้ารายละเอียดงาน</div>
          ) : (<>
            <button onClick={() => setStatusOpen((o) => !o)} aria-expanded={statusOpen} className="w-full flex items-center gap-3 px-4 min-h-[52px] text-left">
              <Icon name={STATUS[f.status].icon} fill size={24} style={{ color: STATUS[f.status].color }} />
              <div className="flex-1 min-w-0"><div className="text-[16px] font-semibold">{STATUS[f.status].label}</div><div className="text-[12px] text-[#8E8E93] truncate">{STATUS_HELP[f.status]}</div></div>
              <Icon name={statusOpen ? 'expand_less' : 'expand_more'} className="text-[#C7C7CC]" />
            </button>
            {statusOpen && ['confirmed', 'pending', 'issue'].map((k) => (
              <button key={k} onClick={() => { statusTouched.current = true; set('status', k); setStatusOpen(false); }}
                className={`w-full flex items-start gap-3 px-4 py-2.5 text-left border-t border-black/[0.08] dark:border-white/[0.1] ${f.status === k ? 'bg-black/[0.03] dark:bg-white/[0.05]' : ''}`}>
                <Icon name={STATUS[k].icon} fill={f.status === k} size={22} style={{ color: STATUS[k].color }} />
                <div className="flex-1"><div className="text-[15px] font-semibold">{STATUS[k].label}</div><div className="text-[12.5px] text-[#8E8E93] leading-snug">{STATUS_HELP[k]}</div></div>
                {f.status === k && <Icon name="check" className="text-[#5856D6] dark:text-[#A5A3FF]" />}
              </button>
            ))}
            {f.status === 'issue' && (
              <div className="border-t border-black/[0.08] dark:border-white/[0.1]">
                <textarea value={f.issueNote} onChange={(e) => set('issueNote', e.target.value)} rows={2} placeholder="ติดปัญหาอะไร? * เช่น ร้านยังไม่ยืนยันเรื่องเครื่องเสียง"
                  className={`w-full px-4 py-2.5 bg-transparent outline-none text-[15px] resize-none placeholder:text-[#C7C7CC] dark:placeholder:text-[#5A5A5E] ${!f.issueNote.trim() ? 'ring-2 ring-inset ring-[#FF3B30]/50' : ''}`} />
              </div>
            )}
            {FOLLOWUP_DAYS[f.status] && <div className="px-4 pb-2.5 text-[12px] text-[#8E8E93]">แอปจะเตือนให้ตามงานตั้งแต่ {FOLLOWUP_DAYS[f.status]} วันก่อนงาน</div>}
          </>)}
        </div>

        {/* หน้าแก้ไข: เพิ่มเติม */}
        {isEdit && (<>
          <GroupLabel>เพิ่มเติม</GroupLabel>
          <div className="mx-4 rounded-[12px] bg-white dark:bg-[#2C2C2E] overflow-hidden">
            <textarea value={f.notes} onChange={(e) => set('notes', e.target.value)} rows={3} placeholder="โน้ตงานนี้ เช่น คีย์เพลง การแต่งกายคืนนี้…" className="w-full px-4 py-3 bg-transparent outline-none text-[15px] resize-none placeholder:text-[#C7C7CC] dark:placeholder:text-[#5A5A5E]" />
            <Sep />
            <Row label="เก็บของ + เดินทาง" icon="directions_car" iconBg="#FF9500">
              <input inputMode="numeric" value={f.travelMinutes} onChange={(e) => { manualTravel.current = true; set('travelMinutes', e.target.value.replace(/[^\d]/g, '')); }} className={inputCls + ' tnum w-16'} />
              <span className="text-[#8E8E93] ml-1">นาที</span>
            </Row>
            <div className="px-4 pb-3 -mt-0.5 flex items-start gap-2">
              <div className={`flex-1 text-[12.5px] leading-snug ${!travelInfo ? 'text-[#8E8E93]' : travelInfo.state === 'ok' ? 'st-confirmed' : travelInfo.state === 'loading' ? 'text-[#8E8E93]' : 'st-issue'}`}>{travelInfo ? travelInfo.text : `คำนวณจาก${neighbors.prev ? ` ${neighbors.prev.venueName} (งานก่อนหน้า)` : 'บ้าน'} · เผื่อเก็บของ ${settings.packMinutes} นาที`}</div>
              {f.venueName.trim() && <button onClick={() => calcTravel(true)} className="shrink-0 h-7 px-2.5 rounded-full bg-[#FF9500]/15 st-issue text-[12px] font-semibold flex items-center gap-1"><Icon name="refresh" size={14} />คำนวณใหม่</button>}
            </div>
          </div>
          <div className="mx-4 mt-5 rounded-[12px] bg-white dark:bg-[#2C2C2E] overflow-hidden">
            <button onClick={() => onDelete(initial)} className="w-full h-[50px] text-[16px] text-[#FF3B30] flex items-center justify-center gap-1.5"><Icon name="delete" size={20} />ลบงาน</button>
          </div>
        </>)}

        <div className="px-4 pt-6">
          {!valid && missing.length > 0 && <div className="text-[12.5px] text-[#8E8E93] text-center mb-2">ยังไม่ได้กรอก: {missing.join(', ')}</div>}
          <button onClick={submit} className={`w-full h-[52px] rounded-[14px] text-[17px] font-semibold text-white ${valid ? 'bg-[#5856D6] active:opacity-85' : 'bg-[#5856D6]/40'}`}>{saveLabel}</button>
        </div>
      </div>
    </Sheet>
  );
}

/* =====================================================================
   GIG DETAIL — แตะการ์ดงานแล้วเปิดหน้านี้ (ดูอย่างเดียว)
   ===================================================================== */
function DetailRow({ icon, color, label, children }) {
  return (
    <div className="flex items-start gap-3 px-4 py-2.5">
      <span className="w-[30px] h-[30px] rounded-[8px] flex items-center justify-center text-white shrink-0" style={{ background: color }}><Icon name={icon} size={18} /></span>
      <div className="flex-1 min-w-0"><div className="text-[12px] text-[#8E8E93]">{label}</div><div className="text-[15px] break-words">{children}</div></div>
    </div>
  );
}
function GigDetail({ gig, profile, now, onClose, onEdit, onCopy, onCloseJob, onCancel, onRestore, onResolve }) {
  const st = STATUS[gig.status];
  const t = GIG_TYPES[gig.gigType];
  const cancelled = gig.status === 'cancelled';
  const [s] = gigRange(gig);
  const started = now >= s;
  const money = isPaidWork(gig);
  const dur = durBetween(gig.startTime, gig.endTime);
  return (
    <Sheet onClose={onClose} full>
      <div className="pt-4 px-2 flex items-center justify-between shrink-0">
        <button onClick={onClose} className="h-10 px-3 text-[17px] text-[#5856D6] dark:text-[#A5A3FF] flex items-center"><Icon name="chevron_left" size={24} />ปิด</button>
        <div className="flex items-center">
          <button onClick={onCopy} className="h-10 px-3 text-[16px] text-[#5856D6] dark:text-[#A5A3FF] flex items-center gap-1"><Icon name="content_copy" size={18} />สร้างสำเนา</button>
          {!cancelled && <button onClick={onEdit} className="h-10 px-3 text-[17px] font-semibold text-[#5856D6] dark:text-[#A5A3FF]">แก้ไข</button>}
        </div>
      </div>
      <div className="flex-1 overflow-y-auto no-scrollbar sheet-pad">
        <div className="px-5 pt-2 pb-4">
          <div className="flex items-center gap-2 flex-wrap">
            {t && <span className="text-[12px] font-bold px-2 py-[2px] rounded-full" style={{ color: t.color, background: t.color + '1F' }}>{t.label}</span>}
            <StatusBadge status={gig.status} />
            {gig.recurringGroupId && <span className="text-[12px] text-[#8E8E93] flex items-center gap-0.5"><Icon name="repeat" size={14} />งานประจำ</span>}
            {gig.jobClosed && !cancelled && <span className="text-[12px] font-semibold st-confirmed flex items-center gap-0.5"><Icon name="task_alt" size={14} fill />ปิดจ๊อบแล้ว</span>}
          </div>
          <h2 className={`text-[28px] font-bold tracking-tight leading-tight mt-2 ${cancelled ? 'line-through text-[#8E8E93]' : ''}`}>{gig.venueName}</h2>
          <div className="text-[15px] text-[#8E8E93] mt-0.5">{fmtDateLong(gig.date)}</div>
          <div className="text-[20px] font-semibold tnum mt-1">{gig.startTime} – {gig.endTime} <span className="text-[14px] font-normal text-[#8E8E93]">({fmtDurShort(dur)}{isOvernight(gig) ? ' · ข้ามคืน' : ''})</span></div>
        </div>

        {gig.status === 'issue' && (
          <div className="mx-4 mb-3 rounded-[12px] px-3.5 py-3 text-[14px] flex gap-2" style={{ background: 'rgba(255,149,0,0.12)' }}>
            <Icon name="error" fill size={20} className="st-issue shrink-0" />
            <div className="flex-1"><div className="font-semibold st-issue">ติดปัญหา</div><div>{gig.issueNote || '-'}</div></div>
            <button onClick={() => onResolve(gig)} className="self-center h-8 px-3 rounded-full bg-[#34C759] text-white text-[13px] font-semibold shrink-0">เคลียร์แล้ว</button>
          </div>
        )}
        {gig.status === 'pending' && !cancelled && (
          <div className="mx-4 mb-3 rounded-[12px] px-3.5 py-3 text-[14px] flex gap-2 items-center" style={{ background: 'rgba(255,204,0,0.15)' }}>
            <Icon name="hourglass_top" fill size={20} className="st-pending shrink-0" />
            <div className="flex-1">รอเจ้าของงานคอนเฟิร์ม</div>
            <button onClick={() => onResolve(gig)} className="h-8 px-3 rounded-full bg-[#34C759] text-white text-[13px] font-semibold shrink-0">คอนเฟิร์มแล้ว</button>
          </div>
        )}

        <div className="mx-4 rounded-[12px] bg-white dark:bg-[#2C2C2E] overflow-hidden divide-y divide-black/[0.06] dark:divide-white/[0.08]">
          {(gig.bandName || gig.members > 1) && <DetailRow icon="groups" color="#FF2D55" label="วง · สมาชิก">{gig.bandName || '-'} · {gig.members} คน</DetailRow>}
          {money && <DetailRow icon="payments" color="#5856D6" label="ค่าตัว (ของฉัน)"><span className="tnum font-semibold">{fmtMoney(gig.baseFee)}</span></DetailRow>}
          <DetailRow icon="location_on" color="#34C759" label="โลเคชั่น">
            <div className="flex items-center gap-2 flex-wrap">
              <span>{gig.mapsUrl ? placeQuery(gig) : 'ยังไม่มีโลเคชั่น'}</span>
              <button onClick={() => openUrl(mapsPlaceUrl(gig))} className="text-[13px] font-semibold text-[#007AFF] dark:text-[#0A84FF] flex items-center gap-0.5"><Icon name="near_me" size={15} />นำทาง</button>
            </div>
          </DetailRow>
          {gig.travelMinutes > 0 && <DetailRow icon="directions_car" color="#FF9500" label="เก็บของ + เดินทาง">{gig.travelMinutes} นาที · ออกก่อน {absToTime(s - gig.travelMinutes)}</DetailRow>}
          {profile && profile.note && <DetailRow icon="sticky_note_2" color="#FF9500" label="โน้ตของร้าน"><span className="whitespace-pre-wrap">{profile.note}</span></DetailRow>}
          {gig.notes && <DetailRow icon="edit_note" color="#8E8E93" label="โน้ตงานนี้"><span className="whitespace-pre-wrap">{gig.notes}</span></DetailRow>}
          <button onClick={() => openUrl(calendarUrl(gig))} className="w-full flex items-center gap-3 px-4 py-2.5 text-left text-[15px] text-[#007AFF] dark:text-[#0A84FF]"><span className="w-[30px] h-[30px] rounded-[8px] flex items-center justify-center text-white shrink-0 bg-[#007AFF]"><Icon name="event" size={18} /></span>เพิ่มลง Google Calendar</button>
        </div>

        {money && gig.jobClosed && !cancelled && (
          <div className="mx-4 mt-3 rounded-[12px] bg-white dark:bg-[#2C2C2E] px-4 py-3 text-[14px] tnum">
            <div className="flex justify-between"><span className="text-[#8E8E93]">ทิปรวม ÷ {gig.members} คน</span><span>{fmtMoney(gig.tips)} → คนละ {fmtMoney(tipShare(gig))}</span></div>
            <div className="flex justify-between mt-1 font-semibold"><span>ได้รับต่อคน</span><span>{fmtMoney(myIncome(gig))}</span></div>
            <div className={`mt-1 text-[13px] ${gig.isPaid ? 'st-confirmed' : 'st-issue'}`}>{gig.isPaid ? 'ได้รับค่าตัวแล้ว' : 'ยังไม่ได้รับค่าตัว'}</div>
          </div>
        )}

        <div className="px-4 pt-5 space-y-2.5">
          {money && !cancelled && (
            <button onClick={() => started && onCloseJob(gig)} disabled={!started}
              className={`w-full h-[52px] rounded-[14px] text-[17px] font-semibold flex items-center justify-center gap-2 ${started ? 'bg-[#34C759] text-white active:opacity-85' : 'bg-[#767680]/[0.15] text-[#8E8E93]'}`}>
              <Icon name="task_alt" size={22} fill={started} />{gig.jobClosed ? 'แก้ไขปิดจ๊อบ & ทิป' : 'ปิดจ๊อบ & ทิป'}
            </button>
          )}
          {money && !cancelled && !started && <div className="text-[12px] text-center text-[#8E8E93] -mt-1">กดได้ตั้งแต่เวลาเริ่มงาน ({fmtDateShort(gig.date)} {gig.startTime})</div>}
          {cancelled
            ? <button onClick={() => onRestore(gig)} className="w-full h-[50px] rounded-[14px] bg-white dark:bg-[#2C2C2E] text-[16px] font-semibold text-[#007AFF] dark:text-[#0A84FF] flex items-center justify-center gap-1.5"><Icon name="restore" size={20} />กู้คืนงาน</button>
            : <button onClick={() => onCancel(gig)} className="w-full h-[50px] rounded-[14px] bg-white dark:bg-[#2C2C2E] text-[16px] font-semibold text-[#FF3B30] flex items-center justify-center gap-1.5"><Icon name="event_busy" size={20} />แคนเซิลงานนี้</button>}
        </div>
      </div>
    </Sheet>
  );
}

/* =====================================================================
   CLOSE JOB & TIPS — ทิปรวม (ไม่บังคับ) · เงินต่อคน · ได้รับค่าตัวแล้วหรือยัง
   ===================================================================== */
function CloseJobSheet({ gig, onClose, onSave }) {
  const [tips, setTips] = useState(gig.tips ? String(gig.tips) : '');
  const [paid, setPaid] = useState(gig.jobClosed ? gig.isPaid : true);
  const preview = { ...gig, tips: parseMoney(tips) };
  const share = tipShare(preview), rest = tipRemainder(preview);
  return (
    <Sheet onClose={onClose} z={60}>
      <div className="pt-4 px-2 flex items-center justify-between shrink-0">
        <button onClick={onClose} className="h-10 px-3 text-[17px] text-[#5856D6] dark:text-[#A5A3FF]">ยกเลิก</button>
        <div className="text-[17px] font-semibold">ปิดจ๊อบ & ทิป</div>
        <button onClick={() => onSave(gig, parseMoney(tips), paid)} className="h-10 px-3 text-[17px] font-semibold text-[#5856D6] dark:text-[#A5A3FF]">บันทึก</button>
      </div>
      <div className="overflow-y-auto no-scrollbar sheet-pad">
        <div className="px-5 pt-1 pb-3 text-[14px] text-[#8E8E93]">{gig.venueName} · {fmtDateShort(gig.date)} {gig.startTime}–{gig.endTime}</div>
        <div className="mx-4 rounded-[12px] bg-white dark:bg-[#2C2C2E] overflow-hidden">
          <Row label="ทิปรวมทั้งวง" icon="volunteer_activism" iconBg="#34C759">
            <input autoFocus inputMode="decimal" value={tips} onChange={(e) => setTips(e.target.value.replace(/[^\d.,]/g, ''))} placeholder="0 (ไม่บังคับ)" className={inputCls + ' tnum font-semibold'} />
          </Row>
        </div>
        <div className="flex gap-2 px-4 pt-2">
          {[100, 200, 500, 1000].map((v) => <button key={v} onClick={() => setTips(String(addMoney(parseMoney(tips), v)))} className="flex-1 h-8 rounded-full text-[13px] font-semibold tnum bg-white dark:bg-[#2C2C2E]">+{v}</button>)}
          <button onClick={() => setTips('')} className="h-8 px-3 rounded-full text-[13px] font-semibold bg-white dark:bg-[#2C2C2E] text-[#8E8E93]">ล้าง</button>
        </div>
        <div className="mx-4 mt-4 rounded-[16px] p-4 text-white tnum" style={{ background: 'linear-gradient(145deg,#312E81,#1E1B4B)' }}>
          <div className="flex justify-between text-[14px] text-white/75"><span>ค่าตัว (ต่อคน)</span><span>{fmtMoney(gig.baseFee)}</span></div>
          <div className="flex justify-between text-[14px] text-white/75 mt-1"><span>ทิปต่อคน ({fmtMoney(parseMoney(tips))} ÷ {gig.members})</span><span>{fmtMoney(share)}</span></div>
          {rest > 0 && <div className="text-[12px] text-[#FFD60A] text-right mt-0.5">เศษ {fmtMoney(rest)} (หารไม่ลงตัว)</div>}
          <div className="h-px bg-white/15 my-2.5" />
          <div className="flex justify-between items-end"><span className="text-[14px] font-semibold">แต่ละคนได้รับ</span><span className="text-[28px] font-bold">{fmtMoney(addMoney(gig.baseFee, share))}</span></div>
        </div>
        <div className="mx-4 mt-4 grid grid-cols-2 gap-2">
          {[[true, 'ได้รับค่าตัวแล้ว', 'paid', '#34C759'], [false, 'ยังไม่ได้รับ', 'pending_actions', '#FF9500']].map(([v, label, icon, c]) => (
            <button key={label} onClick={() => setPaid(v)} aria-pressed={paid === v}
              className={`h-[54px] rounded-[14px] border-2 text-[15px] font-semibold flex items-center justify-center gap-1.5 ${paid === v ? 'bg-white dark:bg-[#2C2C2E]' : 'bg-white/60 dark:bg-[#2C2C2E]/50 border-transparent text-black/60 dark:text-white/60'}`}
              style={paid === v ? { borderColor: c } : {}}>
              <Icon name={icon} fill={paid === v} size={20} style={{ color: c }} />{label}
            </button>
          ))}
        </div>
        <div className="px-4 pt-5"><button onClick={() => onSave(gig, parseMoney(tips), paid)} className="w-full h-[52px] rounded-[14px] bg-[#34C759] text-white text-[17px] font-semibold">ปิดจ๊อบ</button></div>
      </div>
    </Sheet>
  );
}

/* =====================================================================
   SAVED VENUES (Venue Presets) — ดู/ลบทีละร้าน
   ===================================================================== */
function VenueSheet({ presets, onClose, onDelete }) {
  const [q, setQ] = useState('');
  const list = Object.entries(presets)
    .map(([name, v]) => ({ name, ...v }))
    .filter((v) => !q.trim() || v.name.toLowerCase().includes(q.trim().toLowerCase()))
    .sort((a, b) => (b.count || 0) - (a.count || 0) || a.name.localeCompare(b.name, 'th'));
  return (
    <Sheet onClose={onClose} full z={60}>
      <div className="pt-4 px-2 flex items-center justify-between shrink-0">
        <span className="w-[72px]" />
        <div className="text-[17px] font-semibold">ร้านที่บันทึกไว้</div>
        <button onClick={onClose} className="h-10 px-3 w-[72px] text-[17px] font-semibold text-[#5856D6] dark:text-[#A5A3FF]">เสร็จ</button>
      </div>
      <div className="px-4 pt-2 pb-2 shrink-0">
        <div className="flex items-center gap-2 h-9 px-2.5 rounded-[10px] bg-[#767680]/[0.12] dark:bg-[#767680]/[0.24]">
          <Icon name="search" size={18} className="text-[#8E8E93]" />
          <input value={q} onChange={(e) => setQ(e.target.value)} placeholder="ค้นหาร้าน" className="flex-1 bg-transparent outline-none text-[16px] placeholder:text-[#8E8E93]" />
          {q && <button onClick={() => setQ('')} aria-label="ล้าง"><Icon name="cancel" fill size={17} className="text-[#8E8E93]" /></button>}
        </div>
      </div>
      <div className="flex-1 overflow-y-auto no-scrollbar sheet-pad">
        <div className="px-5 pb-1.5 text-[13px] text-[#8E8E93]">ใช้สำหรับเติมค่าตัว เวลาเล่น แผนที่ และเวลาเดินทางอัตโนมัติ · การลบร้านไม่ลบคิวงานเดิม</div>
        <div className="mx-4 rounded-[12px] bg-white dark:bg-[#2C2C2E] overflow-hidden">
          {list.length ? list.map((v, i) => (
            <React.Fragment key={v.name}>
              {i > 0 && <Sep />}
              <div className="flex items-center gap-3 pl-4 pr-2 py-2.5">
                <span className="w-[34px] h-[34px] rounded-[9px] flex items-center justify-center text-white shrink-0 bg-[#AF52DE]"><Icon name="storefront" size={19} /></span>
                <div className="flex-1 min-w-0">
                  <div className="text-[16px] font-semibold truncate">{v.name}</div>
                  <div className="text-[12px] text-[#8E8E93] tnum truncate">
                    {[isValidTime(v.startTime) && isValidTime(v.endTime) ? `${v.startTime}–${v.endTime}` : null, v.baseFee ? fmtMoney(v.baseFee) : null, v.travelMinutes !== undefined ? `เดินทาง ${v.travelMinutes} นาที` : null, `${v.count || 0} งาน`].filter(Boolean).join(' · ')}
                  </div>
                </div>
                {isMapRef(v.mapsUrl) && (
                  <button onClick={() => openUrl(mapsPlaceUrl({ venueName: v.name, mapsUrl: v.mapsUrl }))} aria-label={`เปิดแผนที่ ${v.name}`} className="w-9 h-9 rounded-full flex items-center justify-center text-[#34C759] active:bg-[#34C759]/10"><Icon name="map" size={20} /></button>
                )}
                <button onClick={() => onDelete(v.name)} aria-label={`ลบร้าน ${v.name}`} className="w-9 h-9 rounded-full flex items-center justify-center text-[#FF3B30] active:bg-[#FF3B30]/10"><Icon name="delete" size={20} /></button>
              </div>
            </React.Fragment>
          )) : <div className="py-10 text-center text-[15px] text-[#8E8E93]">{q ? 'ไม่พบร้านที่ค้นหา' : 'ยังไม่มีร้านที่บันทึกไว้'}</div>}
        </div>
      </div>
    </Sheet>
  );
}

/* =====================================================================
   BATCH RETROACTIVE ENTRY
   ===================================================================== */
function BatchSheet({ gigs, presets, bands, mainBands = [], bandMembers = {}, onClose, onSave }) {
  const y = addDays(todayStr(), -1);
  const blank = (prev) => ({ key: uid(), date: prev ? addDays(prev.date, 1) : y, startTime: prev?.startTime || '21:00', endTime: prev?.endTime || '23:00', venueName: prev?.venueName || '', bandName: prev ? prev.bandName : (mainBands[0] || ''), members: prev ? prev.members : String(bandMembers[mainBands[0]] || 1), gigType: prev?.gigType || '', baseFee: prev?.baseFee || '', tips: '', isPaid: true });
  const [rows, setRows] = useState(() => [blank()]);
  const upd = (key, k, v) => setRows((rs) => rs.map((r) => (r.key === key ? { ...r, [k]: v } : r)));
  const presetFor = (name) => { const n = name.trim().toLowerCase(); const k = Object.keys(presets).find((x) => x.toLowerCase() === n); return k ? presets[k] : null; };
  const onVenueBlur = (r) => {
    const p = presetFor(r.venueName);
    if (p) setRows((rs) => rs.map((x) => (x.key === r.key ? { ...x, baseFee: x.baseFee || (p.baseFee ? String(p.baseFee) : ''), bandName: x.bandName || p.bandName || '' } : x)));
  };
  const status = (r) => {
    const empty = !r.venueName.trim();
    const ok = isValidDate(r.date) && isValidTime(r.startTime) && isValidTime(r.endTime) && !empty && !!GIG_TYPES[r.gigType];
    return { empty, ok };
  };
  const conflictKeys = useMemo(() => {
    const set = new Set();
    const pending = [];
    rows.forEach((r) => {
      const s = status(r);
      if (!s.ok) return;
      const cand = { id: r.key, date: r.date, startTime: r.startTime, endTime: r.endTime, status: 'confirmed', travelMinutes: 0 };
      if (findIssues(cand, [...gigs, ...pending]).conflicts.length) set.add(r.key);
      pending.push(cand);
    });
    return set;
  }, [rows, gigs]);
  const validRows = rows.filter((r) => status(r).ok);
  const invalidCount = rows.filter((r) => { const s = status(r); return !s.ok && !s.empty; }).length;
  const rowIncome = (r) => myIncome({ baseFee: parseMoney(r.baseFee), tips: parseMoney(r.tips), members: r.members });
  const sumS = validRows.reduce((a, r) => a + toSatang(rowIncome(r)), 0) / 100;
  const onBandChange = (r, v) => setRows((rs) => rs.map((x) => (x.key === r.key ? { ...x, bandName: v, members: bandMembers[v.trim()] ? String(bandMembers[v.trim()]) : x.members } : x)));
  const cell = 'h-10 px-2 rounded-[8px] bg-[#F2F2F7] dark:bg-[#3A3A3C] outline-none text-[14px] w-full';

  return (
    <Sheet onClose={onClose} full z={60}>
      <div className="pt-4 px-2 flex items-center justify-between shrink-0">
        <button onClick={onClose} className="h-10 px-3 text-[17px] text-[#5856D6] dark:text-[#A5A3FF]">ยกเลิก</button>
        <div className="text-[17px] font-semibold">กรอกงานย้อนหลัง</div>
        <button disabled={!validRows.length || invalidCount > 0} onClick={() => onSave(validRows)} className={`h-10 px-3 text-[17px] font-semibold ${validRows.length && !invalidCount ? 'text-[#5856D6] dark:text-[#A5A3FF]' : 'text-[#C7C7CC] dark:text-[#48484A]'}`}>บันทึก</button>
      </div>
      <div className="px-4 pb-2 text-[13px] text-[#8E8E93] shrink-0">กรอกได้หลายแถว เลื่อนตารางซ้าย-ขวาได้ · ต้องเลือกประเภทงานทุกแถว · ทิป = ทิปรวมทั้งวง (หารตามจำนวนคน) · บันทึกเป็นสถานะ “คอนเฟิร์ม” · งานก่อนวันนี้จะ <b className="st-confirmed">ปิดจ๊อบ (รับเงินแล้ว)</b> อัตโนมัติ · แถวที่ไม่มีชื่อร้านจะถูกข้าม</div>
      <datalist id="dl-venues">{Object.keys(presets).map((v) => <option key={v} value={v} />)}</datalist>
      <datalist id="dl-bands">{[...mainBands, ...bands.filter((b) => !mainBands.includes(b))].map((b) => <option key={b} value={b} />)}</datalist>
      <div className="flex-1 overflow-auto">
        <div className="mx-4 rounded-[12px] bg-white dark:bg-[#2C2C2E] inline-block min-w-[calc(100%-2rem)]">
          <table className="text-left border-separate border-spacing-0">
            <thead>
              <tr className="text-[12px] text-[#8E8E93] font-semibold">
                {['#', 'วันที่', 'เริ่ม', 'เลิก', 'ชื่อร้าน *', 'ชื่อวง', 'คน', 'ประเภท *', 'ค่าตัว (ฉัน)', 'ทิปรวม', 'สถานะ', ''].map((h, i) => (
                  <th key={i} className={`px-1.5 py-2 font-semibold whitespace-nowrap border-b border-black/[0.08] dark:border-white/[0.1] ${i === 0 ? 'sticky left-0 bg-white dark:bg-[#2C2C2E] z-10 pl-3' : ''}`}>{h}</th>
                ))}
              </tr>
            </thead>
            <tbody>
              {rows.map((r, i) => {
                const s = status(r);
                const bad = !s.ok && !s.empty;
                const conflict = conflictKeys.has(r.key);
                return (
                  <tr key={r.key} className={bad ? 'bg-[#FF3B30]/[0.06]' : conflict ? 'bg-[#FF3B30]/[0.04]' : ''}>
                    <td className="sticky left-0 bg-white dark:bg-[#2C2C2E] z-10 pl-3 pr-1 text-[12px] text-[#8E8E93] tnum">
                      {conflict ? <Icon name="warning" fill size={16} className="text-[#FF3B30]" title="คิวชน" /> : i + 1}
                    </td>
                    <td className="p-1"><input type="date" value={r.date} onChange={(e) => upd(r.key, 'date', e.target.value)} className={cell + ' w-[140px] text-left'} /></td>
                    <td className="p-1"><input type="time" value={r.startTime} onChange={(e) => upd(r.key, 'startTime', e.target.value)} className={cell + ' w-[92px]'} /></td>
                    <td className="p-1"><input type="time" value={r.endTime} onChange={(e) => upd(r.key, 'endTime', e.target.value)} className={cell + ' w-[92px]'} /></td>
                    <td className="p-1"><input list="dl-venues" value={r.venueName} placeholder="ชื่อร้าน" onBlur={() => onVenueBlur(r)} onChange={(e) => upd(r.key, 'venueName', e.target.value)} className={cell + ` w-[170px] ${bad && !r.venueName.trim() ? 'ring-2 ring-[#FF3B30]' : ''}`} /></td>
                    <td className="p-1"><input list="dl-bands" value={r.bandName} placeholder="ชื่อวง" onChange={(e) => onBandChange(r, e.target.value)} className={cell + ' w-[140px]'} /></td>
                    <td className="p-1"><input inputMode="numeric" value={r.members} onChange={(e) => upd(r.key, 'members', e.target.value.replace(/[^\d]/g, '').slice(0, 2))} onBlur={() => upd(r.key, 'members', String(Math.min(Math.max(parseInt(r.members, 10) || 1, 1), 99)))} aria-label="จำนวนสมาชิก" className={cell + ' w-[52px] text-center tnum'} /></td>
                    <td className="p-1">
                      <select value={r.gigType} onChange={(e) => upd(r.key, 'gigType', e.target.value)} aria-label="ประเภทงาน" className={cell + ` w-[118px] ${!r.gigType && r.venueName.trim() ? 'ring-2 ring-[#FF9500]' : ''}`}>
                        <option value="">เลือกประเภท</option>
                        {GIG_TYPE_ORDER.map((k) => <option key={k} value={k}>{GIG_TYPES[k].label}</option>)}
                      </select>
                    </td>
                    <td className="p-1"><input inputMode="decimal" value={r.baseFee} placeholder="0" onChange={(e) => upd(r.key, 'baseFee', e.target.value.replace(/[^\d.,]/g, ''))} className={cell + ' w-[90px] text-right tnum'} /></td>
                    <td className="p-1">
                      <input inputMode="decimal" value={r.tips} placeholder="0" onChange={(e) => upd(r.key, 'tips', e.target.value.replace(/[^\d.,]/g, ''))} className={cell + ' w-[88px] text-right tnum'} />
                      {parseMoney(r.tips) > 0 && (parseInt(r.members, 10) || 1) > 1 && <div className="text-[10px] text-[#8E8E93] text-right tnum pr-1 mt-0.5">คนละ {fmtMoney(tipShare({ tips: parseMoney(r.tips), members: r.members }))}</div>}
                    </td>
                    <td className="p-1 text-center whitespace-nowrap">
                      {isPastDate(r.date)
                        ? <span className="text-[11px] font-semibold st-confirmed px-2 py-[3px] rounded-full inline-flex items-center gap-0.5" style={{ background: 'rgba(52,199,89,0.15)' }}><Icon name="task_alt" size={13} />ปิดจ๊อบ</span>
                        : <span className="text-[11px] font-semibold text-[#8E8E93] px-2 py-[3px] rounded-full bg-[#F2F2F7] dark:bg-[#3A3A3C]">รอเล่น</span>}
                    </td>
                    <td className="p-1 pr-2"><button aria-label="ลบแถว" onClick={() => setRows((rs) => (rs.length > 1 ? rs.filter((x) => x.key !== r.key) : [blank()]))} className="w-9 h-9 rounded-full flex items-center justify-center text-[#FF3B30] active:bg-[#FF3B30]/10"><Icon name="remove_circle" fill size={20} /></button></td>
                  </tr>
                );
              })}
            </tbody>
          </table>
        </div>
        <div className="px-4 pt-3 flex gap-2.5">
          <button onClick={() => setRows((rs) => [...rs, blank(rs[rs.length - 1])])} className="h-11 px-5 rounded-[12px] bg-white dark:bg-[#2C2C2E] text-[#5856D6] dark:text-[#A5A3FF] font-semibold flex items-center gap-1"><Icon name="add" size={20} />เพิ่มแถว</button>
          <button onClick={() => setRows((rs) => [...rs, ...Array.from({ length: 5 }, (_, k) => blank())].map((r, idx, arr) => r))} className="h-11 px-4 rounded-[12px] bg-white dark:bg-[#2C2C2E] text-[#8E8E93] font-semibold">+5 แถวว่าง</button>
        </div>
        <div className="mx-4 mt-4 mb-4 rounded-[14px] bg-white dark:bg-[#2C2C2E] p-4 sheet-pad">
          <div className="flex justify-between text-[14px]"><span className="text-[#8E8E93]">พร้อมบันทึก</span><span className="font-semibold tnum">{validRows.length} งาน</span></div>
          <div className="flex justify-between text-[14px] mt-1"><span className="text-[#8E8E93]">รวมรายได้</span><span className="font-bold tnum">{fmtMoney(sumS)}</span></div>
          {invalidCount > 0 && <div className="text-[13px] st-cancelled mt-2">มี {invalidCount} แถวที่ข้อมูลไม่ครบ/ไม่ถูกต้อง</div>}
          {conflictKeys.size > 0 && <div className="text-[13px] st-cancelled mt-1 flex items-center gap-1"><Icon name="warning" size={15} fill />{conflictKeys.size} แถวทับซ้อนกับคิวที่มีอยู่ (บันทึกได้ แต่ควรตรวจสอบ)</div>}
          <button disabled={!validRows.length || invalidCount > 0} onClick={() => onSave(validRows)} className={`mt-3 w-full h-[50px] rounded-[14px] text-white font-semibold ${validRows.length && !invalidCount ? 'bg-[#5856D6]' : 'bg-[#5856D6]/40'}`}>บันทึก {validRows.length} งานพร้อมกัน</button>
        </div>
      </div>
    </Sheet>
  );
}

/* =====================================================================
   VERSION / UPDATE CHECK
   ===================================================================== */
const cmpVer = (a, b) => { const pa = String(a).split('.').map(Number), pb = String(b).split('.').map(Number); for (let i = 0; i < 3; i++) { const d = (pa[i] || 0) - (pb[i] || 0); if (d) return d; } return 0; };
function useUpdateCheck() {
  const [latest, setLatest] = useState(null);
  const [checking, setChecking] = useState(false);
  const check = useCallback(async () => {
    if (!/^https?:$/.test(location.protocol)) return { ok: false, reason: 'file' };
    setChecking(true);
    try {
      const path = location.pathname.endsWith('/') ? `${location.pathname}index.html` : location.pathname;
      const res = await fetch(`${path}?v=${Date.now()}`, { cache: 'no-store' });
      const m = (await res.text()).match(/GIGFLOW_VERSION\s*=\s*['"]([^'"]+)['"]/);
      const v = m ? m[1] : null;
      if (v) setLatest(v);
      return { ok: !!v, version: v };
    } catch (e) { return { ok: false, reason: 'offline' }; }
    finally { setChecking(false); }
  }, []);
  useEffect(() => {
    const t = setTimeout(check, 4000);
    const iv = setInterval(check, 30 * 60 * 1000);
    const onVis = () => { if (document.visibilityState === 'visible') check(); };
    document.addEventListener('visibilitychange', onVis);
    return () => { clearTimeout(t); clearInterval(iv); document.removeEventListener('visibilitychange', onVis); };
  }, []);
  return { latest, available: !!latest && cmpVer(latest, APP_VERSION) > 0, checking, check };
}
async function applyUpdate() {
  try { const reg = await navigator.serviceWorker?.getRegistration(); await reg?.update(); } catch (e) {}
  location.reload();
}
function fmtBuildDate(s) { if (!isValidDate(s)) return ''; const [y, m, d] = s.split('-').map(Number); return `${d} ${TH_MONTHS_SHORT[m - 1]} ${y + 543}`; }

/* =====================================================================
   INSTALL APP (PWA)
   ===================================================================== */
function useInstall() {
  const [, force] = useState(0);
  useEffect(() => {
    const f = () => force((x) => x + 1);
    window.addEventListener('gigflow-installable', f);
    return () => window.removeEventListener('gigflow-installable', f);
  }, []);
  const ua = navigator.userAgent;
  const isIOS = /iPad|iPhone|iPod/.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  return {
    canPrompt: !!window.__gigflowInstallPrompt,
    isIOS,
    isIOSSafari: isIOS && !/CriOS|FxiOS|EdgiOS/.test(ua),
    standalone: isStandalone(),
    async prompt() {
      const e = window.__gigflowInstallPrompt;
      if (!e) return null;
      e.prompt();
      const r = await e.userChoice.catch(() => ({ outcome: 'dismissed' }));
      window.__gigflowInstallPrompt = null;
      force((x) => x + 1);
      return r.outcome;
    },
  };
}

  const [scope, setScope] = useState('from');

  const venueGigs = gigs.filter((g) => g.venueName === profile.name);
  const inScope = (g) => scope === 'all' || (scope === 'date' ? g.date === date : g.date >= date);
  const typeChanged = ['startTime', 'duration', 'baseFee', 'bandName', 'members'].some((k) => String(v[k] ?? '') !== String((profile.byType[type] || {})[k] ?? ''));
  const mapChanged = mapsUrl.trim() !== (profile.mapsUrl || '').trim();
  const noteChanged = note.trim() !== (profile.note || '').trim();
  const affected = venueGigs.filter((g) => inScope(g) && (mapChanged || (typeChanged && g.gigType === type)));
  const past = affected.filter((g) => g.date < todayStr()).length;
  const badMap = mapsUrl.trim() && !isMapRef(mapsUrl);
  const canSave = (typeChanged || mapChanged || noteChanged) && !badMap && (scope === 'all' || isValidDate(date));
  const durH = Math.floor(v.duration / 60), durM = v.duration % 60;
  const selCls = 'h-9 rounded-[9px] bg-[#767680]/[0.12] dark:bg-[#767680]/[0.24] px-2 text-[16px] font-semibold tnum outline-none appearance-none text-center';
  const st = mapsUrl.trim() ? mapRefStatus(mapsUrl, homeLatLng(settings)) : null;
  return (
    <Sheet onClose={onClose} full z={75}>
      <div className="pt-4 px-2 flex items-center justify-between shrink-0">
        <button onClick={onClose} className="h-10 px-3 text-[17px] text-[#5856D6] dark:text-[#A5A3FF]">ยกเลิก</button>
        <div className="text-[17px] font-semibold truncate max-w-[55%]">{profile.name}</div>
        <button disabled={!canSave} onClick={() => onApply({ name: profile.name, type, vals: v, typeChanged, mapsUrl: mapsUrl.trim(), mapChanged, note: note.trim(), scope, date, affected, past })}
          className={`h-10 px-3 text-[17px] font-semibold ${canSave ? 'text-[#5856D6] dark:text-[#A5A3FF]' : 'text-[#C7C7CC] dark:text-[#48484A]'}`}>บันทึก</button>
      </div>
      <div className="flex-1 overflow-y-auto no-scrollbar sheet-pad">
        <GroupLabel>ใช้กับทุกประเภทงานของร้านนี้</GroupLabel>
        <div className="mx-4 rounded-[12px] bg-white dark:bg-[#2C2C2E] overflow-hidden">
          <div className="flex items-center gap-3 px-4 min-h-[48px]">
            <span className="w-[30px] h-[30px] rounded-[8px] flex items-center justify-center text-white shrink-0 bg-[#34C759]"><Icon name="location_on" size={18} /></span>
            <input value={mapsUrl} onChange={(e) => setMapsUrl(e.target.value)} autoCapitalize="characters" autoCorrect="off" spellCheck={false} placeholder="โลเคชั่น: Plus Code หรือลิงก์ Google Maps" className="flex-1 min-w-0 bg-transparent outline-none text-[15px] placeholder:text-[#C7C7CC] dark:placeholder:text-[#5A5A5E]" />
          </div>
          {st && <div className={`px-4 pb-2 -mt-1 text-[12px] flex items-start gap-1 ${st.ok ? 'st-confirmed' : 'st-issue'}`}><Icon name={st.ok ? 'check_circle' : 'info'} size={14} fill={st.ok} />{st.text}</div>}
          <Sep />
          <textarea value={note} onChange={(e) => setNote(e.target.value)} rows={2} placeholder="โน้ตของร้าน (เช่น ที่จอดรถ เบอร์ผู้จัดการ)" className="w-full px-4 py-3 bg-transparent outline-none text-[15px] resize-none placeholder:text-[#C7C7CC] dark:placeholder:text-[#5A5A5E]" />
        </div>

        <GroupLabel>ค่าเริ่มต้นตามประเภทงาน</GroupLabel>
        <div className="mx-4"><Segmented value={type} onChange={setType} options={GIG_TYPE_ORDER.map((t) => ({ value: t, label: GIG_TYPES[t].short }))} /></div>
        {!profile.byType[type] && <div className="px-5 pt-1.5 text-[12px] text-[#8E8E93]">ร้านนี้ยังไม่เคยมีงาน{GIG_TYPES[type].short} — ตั้งค่าเริ่มต้นไว้ล่วงหน้าได้</div>}
        <div className="mx-4 mt-2 rounded-[12px] bg-white dark:bg-[#2C2C2E] overflow-hidden">
          <Row label="เวลาเริ่ม" icon="play_arrow" iconBg="#34C759"><input type="time" value={v.startTime} onChange={(e) => setV('startTime', e.target.value)} className={inputCls} /></Row>
          <Sep />
          <Row label="เล่นนาน" icon="timelapse" iconBg="#FF9500">
            <div className="flex items-center gap-1.5">
              <select aria-label="ชั่วโมง" value={durH} onChange={(e) => setV('duration', Number(e.target.value) * 60 + durM)} className={selCls}>{Array.from({ length: 13 }, (_, h) => <option key={h} value={h}>{h}</option>)}</select>
              <span className="text-[14px] text-[#8E8E93]">ชม.</span>
              <select aria-label="นาที" value={durM} onChange={(e) => setV('duration', durH * 60 + Number(e.target.value))} className={selCls}>{Array.from({ length: 12 }, (_, i) => i * 5).map((m) => <option key={m} value={m}>{pad(m)}</option>)}</select>
              <span className="text-[14px] text-[#8E8E93]">นาที</span>
            </div>
          </Row>
          {type !== 'rehearsal' && (<><Sep /><Row label="ค่าตัว (ของฉัน)" icon="payments" iconBg="#5856D6"><input inputMode="decimal" value={v.baseFee || ''} placeholder="0" onChange={(e) => setV('baseFee', parseMoney(e.target.value.replace(/[^\d.,]/g, '')))} className={inputCls + ' tnum font-semibold'} /></Row></>)}
          <Sep />
          <Row label="ชื่อวง" icon="groups" iconBg="#FF2D55"><input value={v.bandName || ''} onChange={(e) => setV('bandName', e.target.value)} placeholder="-" className={inputCls} /></Row>
          <Sep />
          <Row label="สมาชิก" icon="group" iconBg="#5AC8FA">
            <input inputMode="numeric" value={v.members || 1} onChange={(e) => setV('members', Math.min(Math.max(parseInt(e.target.value, 10) || 1, 1), 99))} className={inputCls + ' tnum w-12'} /><span className="text-[#8E8E93] ml-1">คน</span>
          </Row>
        </div>

        <GroupLabel>ใช้กับงานไหนบ้าง</GroupLabel>
        <div className="mx-4"><Segmented value={scope} onChange={setScope} options={[{ value: 'all', label: 'ทั้งหมด' }, { value: 'date', label: 'เฉพาะวันที่' }, { value: 'from', label: 'ตั้งแต่วันที่' }]} /></div>
        {scope !== 'all' && (
          <div className="mx-4 mt-2 rounded-[12px] bg-white dark:bg-[#2C2C2E] overflow-hidden">
            <Row label={scope === 'date' ? 'วันที่' : 'ตั้งแต่วันที่'} icon="calendar_today" iconBg="#FF3B30"><input type="date" value={date} onChange={(e) => setDate(e.target.value)} className={inputCls} /></Row>
          </div>
        )}
        <div className="px-5 pt-2 text-[12.5px] leading-relaxed text-[#8E8E93]">
          {scope === 'all' && 'เปลี่ยนทุกงานของร้านนี้ รวมงานที่ผ่านมาแล้ว (ยอดเงินย้อนหลังเปลี่ยนตาม) และใช้เป็นค่าเริ่มต้นใหม่'}
          {scope === 'date' && 'เปลี่ยนเฉพาะงานวันนั้น — ค่าเริ่มต้นของร้านไม่เปลี่ยน'}
          {scope === 'from' && 'เปลี่ยนงานตั้งแต่วันนั้นเป็นต้นไป และใช้เป็นค่าเริ่มต้นใหม่ — งานก่อนหน้านั้นไม่เปลี่ยน'}
          <div className={`mt-1 font-semibold ${past ? 'st-issue' : 'text-black dark:text-white'}`}>จะเปลี่ยน {affected.length} งาน{past ? ` (เป็นงานที่ผ่านมาแล้ว ${past} งาน)` : ''}{noteChanged ? ' · อัปเดตโน้ตร้าน' : ''}</div>
        </div>
      </div>
    </Sheet>
  );
}

/* =====================================================================
   MONTHLY RENEWAL — เดือนหน้ายังมีร้านไหนประจำอยู่บ้าง
   ===================================================================== */
const ymLabel = (ym) => { const [y, m] = ym.split('-').map(Number); return monthLabel(y, m); };
const shiftYM = (ym, n) => { let [y, m] = ym.split('-').map(Number); m += n; while (m > 12) { m -= 12; y++; } while (m < 1) { m += 12; y--; } return `${y}-${pad(m)}`; };
function RenewSheet({ target, candidates, onConfirm, onSkip }) {
  const [rows, setRows] = useState(() => candidates.map((c) => ({ ...c, on: true })));
  const upd = (i, patch) => setRows((r) => r.map((x, k) => (k === i ? { ...x, ...patch } : x)));
  const chosen = rows.filter((r) => r.on && r.days.length);
  return (
    <Sheet onClose={onSkip} z={70}>
      <div className="pt-5 px-5 pb-2 shrink-0">
        <div className="text-[13px] font-semibold text-[#8E8E93]">ต่อสัญญางานประจำ</div>
        <div className="text-[22px] font-bold leading-tight">{ymLabel(target)} ยังประจำร้านไหนอยู่บ้าง?</div>
        <div className="text-[13px] text-[#8E8E93] mt-1">ติ๊กร้านที่ยังต่อสัญญา แก้วันประจำได้ แล้วแอปจะลงคิวทั้งเดือนให้</div>
      </div>
      <div className="overflow-y-auto no-scrollbar sheet-pad">
        <div className="mx-4 rounded-[12px] bg-white dark:bg-[#2C2C2E] overflow-hidden divide-y divide-black/[0.06] dark:divide-white/[0.08]">
          {rows.map((r, i) => (
            <div key={r.venueName} className={`px-4 py-3 ${r.on ? '' : 'opacity-50'}`}>
              <button onClick={() => upd(i, { on: !r.on })} className="w-full flex items-center gap-3 text-left" aria-pressed={r.on}>
                <Icon name={r.on ? 'check_circle' : 'radio_button_unchecked'} fill={r.on} size={24} className={r.on ? 'text-[#34C759]' : 'text-[#C7C7CC]'} />
                <div className="flex-1 min-w-0">
                  <div className="text-[16px] font-semibold truncate">{r.venueName}</div>
                  <div className="text-[12.5px] text-[#8E8E93] tnum">{r.template.startTime}–{r.template.endTime}{r.template.bandName ? ` · ${r.template.bandName}` : ''}{r.template.baseFee ? ` · ${fmtMoney(r.template.baseFee)}` : ''}</div>
                </div>
              </button>
              {r.on && (
                <div className="grid grid-cols-7 gap-1.5 mt-2.5 pl-9">
                  {[1, 2, 3, 4, 5, 6, 0].map((d) => {
                    const on = r.days.includes(d);
                    return <button key={d} onClick={() => upd(i, { days: on ? r.days.filter((x) => x !== d) : [...r.days, d] })} aria-pressed={on} className={`h-8 rounded-full text-[13px] font-semibold ${on ? 'bg-[#007AFF] text-white' : 'bg-[#F2F2F7] dark:bg-[#3A3A3C]'}`}>{TH_DAYS_MINI[d]}</button>;
                  })}
                </div>
              )}
            </div>
          ))}
        </div>
        <div className="px-4 pt-5 space-y-2.5">
          <button disabled={!chosen.length} onClick={() => onConfirm(target, chosen)} className={`w-full h-[52px] rounded-[14px] text-[17px] font-semibold text-white ${chosen.length ? 'bg-[#5856D6]' : 'bg-[#5856D6]/40'}`}>ลงคิว{ymLabel(target)} ({chosen.length} ร้าน)</button>
          <button onClick={onSkip} className="w-full h-[46px] rounded-[14px] bg-white dark:bg-[#2C2C2E] text-[15px] font-semibold text-[#8E8E93]">ไม่มีร้านไหนต่อสัญญา</button>
        </div>
      </div>
    </Sheet>
  );
}

  return (
    <button onClick={onClick} className="w-full flex items-center gap-3 px-4 py-2.5 min-h-[50px] text-left active:bg-black/[0.04] dark:active:bg-white/[0.06]">
      <span className="w-[30px] h-[30px] rounded-[8px] flex items-center justify-center text-white shrink-0" style={{ background: color }}><Icon name={icon} size={18} /></span>
      <div className="flex-1 min-w-0">
        <div className={`text-[16px] ${destructive ? 'text-[#FF3B30]' : ''}`}>{label}</div>
        {sub && <div className="text-[12px] text-[#8E8E93] truncate">{sub}</div>}
      </div>
      {badge ? <span className="min-w-[22px] h-[22px] px-1.5 rounded-full bg-[#FF9500] text-white text-[12px] font-bold flex items-center justify-center">{badge}</span> : null}

function Drawer({ onClose, user, sync, issueCount, venueCount, settings, install, update, onSettings, onVenues, onInstall, onIssues, onSignOut, onDeleteAccount, toast }) {
  useEffect(() => {
    const prev = document.body.style.overflow;
    document.body.style.overflow = 'hidden';
    const onKey = (e) => { if (e.key === 'Escape') onClose(); };
    window.addEventListener('keydown', onKey);
    return () => { document.body.style.overflow = prev; window.removeEventListener('keydown', onKey); };
  }, []);
  const checkNow = async () => {
    const r = await update.check();
    if (!r.ok) toast(r.reason === 'file' ? 'ตรวจอัปเดตได้เมื่อเปิดผ่านเว็บ' : 'ตรวจสอบไม่สำเร็จ (ออฟไลน์?)', 'error');
    else if (cmpVer(r.version, APP_VERSION) > 0) toast(`มีเวอร์ชันใหม่ v${r.version}`, 'system_update');
    else toast(`ใช้เวอร์ชันล่าสุดแล้ว (v${APP_VERSION})`, 'verified');

  const bandsSub = settings.bands.length ? settings.bands.join(', ') : 'ยังไม่ได้ตั้งวงหลัก';
  const homeSub = homeTarget(settings) ? 'ตั้งตำแหน่งบ้านแล้ว' : 'ยังไม่ได้ตั้งตำแหน่งบ้าน';
  return (

      <div className="absolute inset-0 bg-black/40 anim-fade" onClick={onClose} />
      <aside className="absolute top-0 bottom-0 left-0 w-[86%] max-w-[340px] bg-[#F2F2F7] dark:bg-[#1C1C1E] shadow-2xl anim-drawer flex flex-col" role="dialog" aria-label="เมนู">
        <div className="safe-top px-4 pb-2 flex items-center justify-between shrink-0">
          <div className="flex items-center gap-2.5 pt-1"><AppLogo size={30} /><span className="text-[20px] font-bold tracking-tight">GigFlow</span></div>
          <button onClick={onClose} aria-label="ปิดเมนู" className="w-9 h-9 rounded-full bg-[#767680]/[0.12] flex items-center justify-center"><Icon name="close" size={20} /></button>
        </div>
        <div className="flex-1 overflow-y-auto no-scrollbar pb-4">
          {/* บัญชี */}
          <div className="mx-3 mt-2 rounded-[14px] bg-white dark:bg-[#2C2C2E] p-3.5 flex items-center gap-3">
            {user ? <Avatar user={user} size={48} /> : <span className="w-12 h-12 rounded-full bg-[#8E8E93] text-white flex items-center justify-center"><Icon name="smartphone" /></span>}
            <div className="min-w-0 flex-1">
              <div className="text-[16px] font-semibold truncate">{user ? (user.displayName || 'ผู้ใช้ GigFlow') : 'โหมดเครื่องเดียว'}</div>
              <div className="text-[12.5px] text-[#8E8E93] truncate">{user ? user.email : 'ยังไม่ได้ตั้งค่า Google Client ID'}</div>
              <div className="mt-0.5"><SyncBadge state={sync.state} dirty={sync.dirty} onClick={() => sync.syncNow(true)} /></div>
              {user && <div className="text-[11px] text-[#8E8E93]">{fmtAgo(sync.lastSyncAt)}</div>}
            </div>
          </div>

          {(issueCount > 0 || update.available) && (
            <div className="mx-3 mt-3 rounded-[14px] bg-white dark:bg-[#2C2C2E] overflow-hidden">
              {issueCount > 0 && <DrawerRow icon="notification_important" color="#FF9500" label="ต้องตามงาน" sub="รอคอนเฟิร์ม / ติดปัญหา ใกล้ถึงวันงาน" badge={issueCount} onClick={onIssues} />}
              {issueCount > 0 && update.available && <Sep />}
              {update.available && <DrawerRow icon="system_update" color="#007AFF" label={`มีอัปเดตใหม่ v${update.latest}`} sub="แตะเพื่อโหลดเวอร์ชันล่าสุด" onClick={applyUpdate} />}
            </div>
          )}

          <div className="px-5 pt-5 pb-1.5 text-[13px] text-[#8E8E93] uppercase tracking-wide">ตั้งค่า</div>
          <div className="mx-3 rounded-[14px] bg-white dark:bg-[#2C2C2E] overflow-hidden">
            <DrawerRow icon="manage_accounts" color="#5856D6" label="ตั้งค่าบัญชีผู้ใช้" sub={`${bandsSub} · ${homeSub}`} onClick={onSettings} />
            <Sep />
            <DrawerRow icon="storefront" color="#AF52DE" label="ร้านที่บันทึกไว้" sub={`${venueCount} ร้าน · ดูหรือลบทีละร้าน`} onClick={onVenues} />
            <Sep />
            <DrawerRow icon="install_mobile" color="#34C759" label="ติดตั้งแอปลงเครื่อง" sub={install.standalone ? 'ติดตั้งแล้ว' : install.isIOS ? 'iPhone/iPad: เพิ่มไปยังหน้าจอโฮม' : install.canPrompt ? 'แตะเพื่อติดตั้ง' : 'Android / คอมพิวเตอร์'}
              right={install.standalone ? <Icon name="check_circle" fill className="text-[#34C759]" /> : undefined} onClick={onInstall} />

                  <Icon name="link" className="text-[#34C759]" />

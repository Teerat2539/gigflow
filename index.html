<script>
  /* ===================== เวอร์ชันแอป =====================
     เปลี่ยนเลขนี้ทุกครั้งที่ deploy เวอร์ชันใหม่ — แอปที่เปิดค้างไว้จะเห็นแถบ "มีอัปเดตใหม่" */
  window.GIGFLOW_VERSION = '1.5.0';
  window.GIGFLOW_BUILD_DATE = '2026-11-23';

  /* ===================== Google Maps (Routes API) =====================
     ใช้คำนวณเวลาเดินทาง บ้าน → ร้าน และ ร้าน → ร้าน อัตโนมัติ (ดูวิธีสร้าง key ใน SETUP-FIREBASE.md ข้อ 7)
     เว้นว่างไว้ = ไม่คำนวณอัตโนมัติ (กรอกเวลาเดินทางเอง) */
  window.GIGFLOW_GOOGLE_MAPS_API_KEY = "";

  /* เก็บ event ติดตั้งแอป (Chrome/Android/คอมพิวเตอร์) ไว้ใช้กับปุ่ม "ติดตั้งแอป" ในเมนู */
  window.addEventListener('beforeinstallprompt', function (e) {
    e.preventDefault();
    window.__gigflowInstallPrompt = e;
    window.dispatchEvent(new Event('gigflow-installable'));
  });
  window.addEventListener('appinstalled', function () {
    window.__gigflowInstallPrompt = null;
    window.dispatchEvent(new Event('gigflow-installable'));
  });
  if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
    window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () {}); });
  }
</script>

<script>
  /* ---------- App icon: white guitar pick on Midnight Indigo squircle + green "confirmed" dot ---------- */
  (function () {
    function iconSvg(squircle) {
      var bg = squircle
        ? '<path d="M256 0C56 0 0 56 0 256s56 256 256 256 256-56 256-256S456 0 256 0Z" fill="url(#g)"/>'
        : '<rect width="512" height="512" fill="url(#g)"/>';
      return '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">' +
        '<defs>' +
        '<linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#312E81"/><stop offset="1" stop-color="#1E1B4B"/></linearGradient>' +
        '<linearGradient id="p" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#E0E7FF"/></linearGradient>' +
        '</defs>' + bg +
        '<path d="M256 128c80 0 128 27 128 75 0 72-80 154-128 185-48-31-128-113-128-185 0-48 48-75 128-75Z" fill="url(#p)"/>' +
        '<circle cx="398" cy="114" r="44" fill="#34C759" stroke="#26235E" stroke-width="12"/>' +
        '</svg>';
    }
    window.GIGFLOW_ICON_SVG = iconSvg(true);
    var fav = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(iconSvg(true));
    var full = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(iconSvg(false));
    document.getElementById('favicon').href = fav;
    // iOS ignores SVG apple-touch-icons. On a web server the static icons/apple-touch-icon.png is used;
    // when opened as a local file, rasterise a full-bleed 180x180 PNG at runtime instead.
    if (location.protocol === 'file:') {
      document.getElementById('apple-icon').href = full;
      var img = new Image();
      img.onload = function () {
        try {
          var c = document.createElement('canvas'); c.width = 180; c.height = 180;
          c.getContext('2d').drawImage(img, 0, 0, 180, 180);
          document.getElementById('apple-icon').href = c.toDataURL('image/png');
        } catch (e) {}
      };
      img.src = full;
    }

    // Apply theme before first paint (no flash)
    try {
      var m = localStorage.getItem('gigflow.theme') || 'auto';
      var dark = m === 'dark' || (m === 'auto' && window.matchMedia('(prefers-color-scheme: dark)').matches);
      if (dark) document.documentElement.classList.add('dark');
    } catch (e) {}
  })();
</script>

<script type="text/babel" data-presets="react">
const { useState, useEffect, useMemo, useRef, useCallback } = React;

/* =====================================================================
   CONSTANTS
   ===================================================================== */
const KEY_GIGS = 'gigflow.gigs.v1';
const KEY_VENUES = 'gigflow.venues.v1';
const KEY_THEME = 'gigflow.theme';
const KEY_SETTINGS = 'gigflow.settings.v1';
const APP_VERSION = window.GIGFLOW_VERSION || '0.0.0';
const APP_BUILD_DATE = window.GIGFLOW_BUILD_DATE || '';
const MAPS_KEY = (window.GIGFLOW_GOOGLE_MAPS_API_KEY || '').trim();
const ISSUE_ALERT_DAYS = 2;                         // เตือนงานติดปัญหาเมื่อเหลือ ≤ 2 วัน
const DEFAULT_SETTINGS = { bands: [], homeMapsUrl: '', packMinutes: 15, feePresets: [], bandMembers: {} };
const MAX_FEE_PRESETS = 4;
/** ประเภทงาน */
const GIG_TYPES = {
  regular: { label: 'งานประจำ', short: 'ประจำ', icon: 'event_repeat', color: '#007AFF' },
  sub:     { label: 'งานแทน', short: 'แทน', icon: 'swap_horiz', color: '#AF52DE' },
  event:   { label: 'งานจ้างรายครั้ง/อีเว้นท์', short: 'อีเว้นท์', icon: 'celebration', color: '#FF2D55' },
};
const GIG_TYPE_ORDER = ['regular', 'sub', 'event'];

const STATUS = {
  confirmed: { label: 'คอนเฟิร์ม',   color: '#34C759', emoji: '✅', icon: 'check_circle' },
  pending:   { label: 'รอคอนเฟิร์ม', color: '#FFCC00', emoji: '⏳', icon: 'hourglass_top' },
  issue:     { label: 'ติดปัญหา',    color: '#FF9500', emoji: '⚠️', icon: 'error' },
  cancelled: { label: 'แคนเซิล',     color: '#FF3B30', emoji: '❌', icon: 'cancel' },
};
const STATUS_ORDER = ['confirmed', 'pending', 'issue', 'cancelled'];
const ACTIVE = new Set(['confirmed', 'pending', 'issue']);   // ใช้เช็กคิวชน
const INCOME = new Set(['confirmed', 'issue']);              // นับเป็นรายได้ (pending = คาดการณ์, cancelled = ไม่นับ)
const SERIES_FIELDS = ['startTime', 'endTime', 'venueName', 'bandName', 'members', 'gigType', 'status', 'issueNote', 'baseFee', 'mapsUrl', 'travelMinutes', 'notes'];

const TH_DAYS = ['อาทิตย์', 'จันทร์', 'อังคาร', 'พุธ', 'พฤหัสบดี', 'ศุกร์', 'เสาร์'];
const TH_DAYS_SHORT = ['อา.', 'จ.', 'อ.', 'พ.', 'พฤ.', 'ศ.', 'ส.'];
const TH_DAYS_MINI = ['อา', 'จ', 'อ', 'พ', 'พฤ', 'ศ', 'ส'];
const TH_MONTHS = ['มกราคม', 'กุมภาพันธ์', 'มีนาคม', 'เมษายน', 'พฤษภาคม', 'มิถุนายน', 'กรกฎาคม', 'สิงหาคม', 'กันยายน', 'ตุลาคม', 'พฤศจิกายน', 'ธันวาคม'];
const TH_MONTHS_SHORT = ['ม.ค.', 'ก.พ.', 'มี.ค.', 'เม.ย.', 'พ.ค.', 'มิ.ย.', 'ก.ค.', 'ส.ค.', 'ก.ย.', 'ต.ค.', 'พ.ย.', 'ธ.ค.'];

/* =====================================================================
   DATE / TIME HELPERS  (ทุกอย่างคิดเป็น "วันที่ท้องถิ่น" แบบ YYYY-MM-DD → ไม่มีปัญหา timezone/DST)
   ===================================================================== */
const pad = (n) => String(n).padStart(2, '0');
const toDateStr = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const todayStr = () => toDateStr(new Date());
const isValidDate = (s) => typeof s === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(s) && !isNaN(Date.UTC(...s.split('-').map(Number)));
const isValidTime = (s) => typeof s === 'string' && /^([01]\d|2[0-3]):[0-5]\d$/.test(s);
const dayNum = (s) => { const [y, m, d] = s.split('-').map(Number); return Math.round(Date.UTC(y, m - 1, d) / 864e5); };
const fromDayNum = (n) => { const d = new Date(n * 864e5); return `${d.getUTCFullYear()}-${pad(d.getUTCMonth() + 1)}-${pad(d.getUTCDate())}`; };
const addDays = (s, n) => fromDayNum(dayNum(s) + n);
const weekdayOf = (s) => new Date(dayNum(s) * 864e5).getUTCDay();
const toMin = (t) => { const [h, m] = t.split(':').map(Number); return h * 60 + m; };
const isOvernight = (g) => toMin(g.endTime) <= toMin(g.startTime);
/** ช่วงเวลาแบบ "นาทีสัมบูรณ์" — งานข้ามเที่ยงคืนจะนับเวลาเลิกเป็นวันถัดไป แต่ยังเป็นงานของคืนวันที่เริ่มเล่น */
const gigRange = (g) => {
  const base = dayNum(g.date) * 1440;
  const s = base + toMin(g.startTime);
  let e = base + toMin(g.endTime);
  if (e <= s) e += 1440;
  return [s, e];
};
const nowAbs = () => { const d = new Date(); return dayNum(toDateStr(d)) * 1440 + d.getHours() * 60 + d.getMinutes(); };
const absToParts = (abs) => { const day = Math.floor(abs / 1440); const m = abs - day * 1440; return { date: fromDayNum(day), h: Math.floor(m / 60), m: m % 60 }; };
const absToTime = (abs) => { const p = absToParts(abs); return `${pad(p.h)}:${pad(p.m)}`; };
const cmpGig = (a, b) => gigRange(a)[0] - gigRange(b)[0];
const fmtDur = (min) => { min = Math.max(0, Math.round(min)); const h = Math.floor(min / 60), m = min % 60; if (!h) return `${m} นาที`; return m ? `${h} ชม. ${m} นาที` : `${h} ชม.`; };
const fmtDateShort = (s) => { const [, m, d] = s.split('-').map(Number); return `${TH_DAYS_SHORT[weekdayOf(s)]} ${d} ${TH_MONTHS_SHORT[m - 1]}`; };
const fmtDateLong = (s) => { const [y, m, d] = s.split('-').map(Number); return `วัน${TH_DAYS[weekdayOf(s)]}ที่ ${d} ${TH_MONTHS[m - 1]} ${y + 543}`; };
const relDay = (s) => { const diff = dayNum(s) - dayNum(todayStr()); if (diff === 0) return 'วันนี้'; if (diff === 1) return 'พรุ่งนี้'; if (diff === -1) return 'เมื่อวาน'; return fmtDateShort(s); };
const monthLabel = (y, m) => `${TH_MONTHS[m - 1]} ${y + 543}`;
const daysInMonth = (y, m) => new Date(Date.UTC(y, m, 0)).getUTCDate();

/* =====================================================================
   MONEY HELPERS  (รวมเงินด้วยหน่วยสตางค์ที่เป็นจำนวนเต็ม → ไม่มี floating-point error)
   ===================================================================== */
const toSatang = (v) => Math.round((Number(v) || 0) * 100);
const sumMoney = (arr, f) => arr.reduce((acc, x) => acc + toSatang(f(x)), 0) / 100;
const addMoney = (...vals) => vals.reduce((a, v) => a + toSatang(v), 0) / 100;
const subMoney = (a, b) => (toSatang(a) - toSatang(b)) / 100;
const nf = new Intl.NumberFormat('th-TH', { minimumFractionDigits: 0, maximumFractionDigits: 2 });
const fmtMoney = (v) => `฿${nf.format(Number(v) || 0)}`;
const parseMoney = (s) => { const n = parseFloat(String(s ?? '').replace(/[,฿\s]/g, '')); return isFinite(n) && n > 0 ? Math.round(n * 100) / 100 : 0; };
/** ทิปรายคน = ทิปรวม ÷ จำนวนสมาชิก ปัดลงเป็นบาท (คนเดียว = ทิปรวมทั้งหมด) */
const tipShare = (g) => { const m = Math.max(1, parseInt(g.members, 10) || 1); const s = toSatang(g.tips); return m === 1 ? s / 100 : Math.floor(s / (m * 100)); };
/** เศษที่หารไม่ลงตัว */
const tipRemainder = (g) => { const m = Math.max(1, parseInt(g.members, 10) || 1); return m === 1 ? 0 : (toSatang(g.tips) - Math.round(tipShare(g) * 100) * m) / 100; };
/** รายได้ของฉันจากงานนี้ = ค่าตัวของฉัน + ทิปรายคน */
const myIncome = (g) => addMoney(g.baseFee, tipShare(g));
const parseIntSafe = (s, def = 0) => { const n = parseInt(String(s ?? '').replace(/[^\d]/g, ''), 10); return isFinite(n) ? Math.max(0, n) : def; };

/* =====================================================================
   GENERAL HELPERS
   ===================================================================== */
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 9);
/** งานที่กรอกย้อนหลัง (วันที่ก่อนวันนี้) → ปิดจ๊อบอัตโนมัติ: คอนเฟิร์ม + รับเงินแล้ว (ยกเว้นงานที่แคนเซิล) */
const isPastDate = (d) => isValidDate(d) && d < todayStr();
const closeRetro = (g) => (isPastDate(g.date) && g.status !== 'cancelled'
  ? { ...g, isPaid: true, status: g.status === 'pending' ? 'confirmed' : g.status }
  : g);
const isHttpUrl = (u) => /^https?:\/\//i.test((u || '').trim());

function normalizeGig(raw) {
  if (!raw || typeof raw !== 'object') return null;
  const g = {
    id: typeof raw.id === 'string' && raw.id ? raw.id : uid(),
    date: String(raw.date || ''),
    startTime: String(raw.startTime || ''),
    endTime: String(raw.endTime || ''),
    venueName: String(raw.venueName || '').trim(),
    status: STATUS[raw.status] ? raw.status : 'pending',
    issueNote: raw.status === 'issue' ? String(raw.issueNote || '').trim() : '',
    bandName: String(raw.bandName || '').trim(),
    recurringGroupId: raw.recurringGroupId ? String(raw.recurringGroupId) : null,
    // งานเก่าที่ยังไม่มีประเภท: อยู่ในชุดร้านประจำ = งานประจำ, นอกนั้น = งานจ้างรายครั้ง
    gigType: GIG_TYPES[raw.gigType] ? raw.gigType : (raw.recurringGroupId ? 'regular' : 'event'),
    members: Math.min(Math.max(parseInt(raw.members, 10) || 1, 1), 99),
    baseFee: parseMoney(raw.baseFee),
    mapsUrl: isHttpUrl(raw.mapsUrl) ? String(raw.mapsUrl).trim() : '',
    travelMinutes: raw.travelMinutes === undefined || raw.travelMinutes === null || raw.travelMinutes === '' ? 30 : parseIntSafe(raw.travelMinutes, 30),
    notes: String(raw.notes || ''),
    tips: parseMoney(raw.tips),
    isPaid: !!raw.isPaid,
    createdAt: Number(raw.createdAt) || Date.now(),
    updatedAt: Number(raw.updatedAt) || Date.now(),
  };
  if (!isValidDate(g.date) || !isValidTime(g.startTime) || !isValidTime(g.endTime) || !g.venueName) return null;
  return g;
}

function loadJSON(key, fallback) {
  try { const v = JSON.parse(localStorage.getItem(key)); return v ?? fallback; } catch (e) { return fallback; }
}
const loadGigs = () => { const arr = loadJSON(KEY_GIGS, []); return Array.isArray(arr) ? arr.map(normalizeGig).filter(Boolean) : []; };
const loadVenues = () => { const v = loadJSON(KEY_VENUES, {}); return v && typeof v === 'object' && !Array.isArray(v) ? v : {}; };
function normalizeSettings(raw) {
  const r = raw && typeof raw === 'object' ? raw : {};
  const bands = Array.isArray(r.bands) ? [...new Set(r.bands.map((b) => String(b || '').trim()).filter(Boolean))].slice(0, 20) : [];
  const pack = parseInt(r.packMinutes, 10);
  const feePresets = (Array.isArray(r.feePresets) ? r.feePresets : []).map(parseMoney).filter((v) => v > 0).slice(0, MAX_FEE_PRESETS);
  const bandMembers = {};
  if (r.bandMembers && typeof r.bandMembers === 'object' && !Array.isArray(r.bandMembers)) {
    Object.entries(r.bandMembers).forEach(([k, v]) => { const n = parseInt(v, 10); if (k.trim() && n >= 1 && n <= 99) bandMembers[k.trim()] = n; });
  }
  return { bands, homeMapsUrl: String(r.homeMapsUrl || '').trim(), packMinutes: isFinite(pack) ? Math.min(Math.max(pack, 0), 180) : DEFAULT_SETTINGS.packMinutes, feePresets, bandMembers };
}
const loadSettings = () => normalizeSettings(loadJSON(KEY_SETTINGS, DEFAULT_SETTINGS));

/* ---------- ตำแหน่งจากลิงก์ Google Maps / พิกัด ---------- */
const isShortMapsLink = (s) => /(^|\/\/)(maps\.app\.goo\.gl|goo\.gl\/maps|g\.co\/kgs)/i.test((s || '').trim());
/** อ่านพิกัดจากลิงก์ Google Maps แบบเต็ม หรือข้อความพิกัด "13.7563, 100.5018" */
function parseLatLng(s) {
  const t = (s || '').trim();
  if (!t) return null;
  const ok = (a, b) => { const lat = parseFloat(a), lng = parseFloat(b); return isFinite(lat) && isFinite(lng) && Math.abs(lat) <= 90 && Math.abs(lng) <= 180 ? { lat, lng } : null; };
  let m = t.match(/^\s*(-?\d{1,2}(?:\.\d+)?)\s*,\s*(-?\d{1,3}(?:\.\d+)?)\s*$/);
  if (m) return ok(m[1], m[2]);
  m = t.match(/!3d(-?\d+\.\d+)!4d(-?\d+\.\d+)/);                       // พิกัดของหมุดสถานที่ (แม่นที่สุด)
  if (m) return ok(m[1], m[2]);
  m = t.match(/[?&](?:q|query|ll|destination|center|daddr)=(-?\d+\.\d+)(?:,|%2C)\s*(-?\d+\.\d+)/i);
  if (m) return ok(m[1], m[2]);
  m = t.match(/@(-?\d+\.\d+),(-?\d+\.\d+)/);                            // จุดกึ่งกลางแผนที่
  if (m) return ok(m[1], m[2]);
  return null;
}
/** ปลายทางสำหรับ Routes API จากลิงก์ร้าน: พิกัด หรือชื่อสถานที่ในลิงก์เต็ม — ลิงก์สั้น/ไม่มีลิงก์ = null (กรอกเอง) */
function routeTargetFromUrl(url) {
  const u = (url || '').trim();
  if (!isHttpUrl(u) || isShortMapsLink(u)) return null;
  const ll = parseLatLng(u);
  if (ll) return { location: { latLng: { latitude: ll.lat, longitude: ll.lng } } };
  try {
    const p = new URL(u);
    const q = p.searchParams.get('query') || p.searchParams.get('q') || p.searchParams.get('destination');
    if (q && q.trim()) return { address: q.trim() };
    const m = p.pathname.match(/\/place\/([^/]+)/);
    if (m) return { address: decodeURIComponent(m[1].replace(/\+/g, ' ')) };
  } catch (e) {}
  return null;
}
const homeTarget = (settings) => { const ll = parseLatLng(settings.homeMapsUrl); return ll ? { location: { latLng: { latitude: ll.lat, longitude: ll.lng } } } : null; };

async function copyText(text) {
  try {
    if (navigator.clipboard && window.isSecureContext) { await navigator.clipboard.writeText(text); return true; }
  } catch (e) {}
  try {
    const ta = document.createElement('textarea');
    ta.value = text; ta.setAttribute('readonly', '');
    ta.style.position = 'fixed'; ta.style.top = '0'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select(); ta.setSelectionRange(0, text.length);
    const ok = document.execCommand('copy');
    document.body.removeChild(ta);
    return ok;
  } catch (e) { return false; }
}

/* =====================================================================
   CONFLICT & TRAVEL BUFFER DETECTOR
   ===================================================================== */
/** needAfter: { [gigId]: นาที } — เวลาเดินทางจริงจากงานนี้ไปงานถัดไป (คำนวณร้าน→ร้านแล้ว) ใช้แทน travelMinutes เดิมของงานนั้น */
function findIssues(cand, gigs, excludeIds = new Set(), needAfter = {}) {
  const res = { conflicts: [], tight: [] };
  if (!cand || cand.status === 'cancelled') return res;
  if (!isValidDate(cand.date) || !isValidTime(cand.startTime) || !isValidTime(cand.endTime)) return res;
  const [s, e] = gigRange(cand);
  for (const g of gigs) {
    if (excludeIds.has(g.id) || !ACTIVE.has(g.status)) continue;
    const [gs, ge] = gigRange(g);
    if (s < ge && gs < e) {
      res.conflicts.push({ gig: g, date: cand.date });
    } else if (ge <= s) {
      const gap = s - ge, need = Number(cand.travelMinutes) || 0;      // งานอื่นจบก่อน → ต้องเดินทางมางานนี้
      if (gap < need) res.tight.push({ gig: g, gap, need, dir: 'before', date: cand.date });
    } else if (e <= gs) {
      const gap = gs - e, need = needAfter[g.id] ?? (Number(g.travelMinutes) || 0);   // งานนี้จบก่อน → ต้องเดินทางไปงานอื่น
      if (gap < need) res.tight.push({ gig: g, gap, need, dir: 'after', date: cand.date });
    }
  }
  return res;
}

function genRecurringDates(startDate, days, weeks) {
  const set = new Set(days);
  const out = [];
  for (let i = 0; i < weeks * 7; i++) {
    const d = addDays(startDate, i);
    if (set.has(weekdayOf(d))) out.push(d);
  }
  return out;
}

      if (q) return q;
      const m = u.pathname.match(/\/place\/([^/]+)/);
      if (m) return decodeURIComponent(m[1].replace(/\+/g, ' '));
      const c = url.match(/@(-?\d+\.\d+),(-?\d+\.\d+)/);
      if (c) return `${c[1]},${c[2]}`;
    } catch (e) {}
  }
  return g.venueName;
}

/* ---------- Google Routes API: เวลาขับรถ ---------- */
const routeCache = new Map();
/** คืนค่านาทีขับรถ (ปัดขึ้น) จาก origin → destination; departAbs = เวลาออกเดินทาง (นาทีสัมบูรณ์) ใช้คิดสภาพจราจรถ้าเป็นอนาคต */
async function fetchDriveMinutes(origin, destination, departAbs) {
  if (!MAPS_KEY) throw Object.assign(new Error('no-key'), { code: 'no-key' });
  const future = departAbs && departAbs > nowAbs() + 2;
  const key = stableStr({ origin, destination, t: future ? Math.round(departAbs / 30) : 0 });
  if (routeCache.has(key)) return routeCache.get(key);
  const body = { origin, destination, travelMode: 'DRIVE', languageCode: 'th', regionCode: 'TH', routingPreference: future ? 'TRAFFIC_AWARE' : 'TRAFFIC_UNAWARE' };
  if (future) { const p = absToParts(departAbs); const [y, m, d] = p.date.split('-').map(Number); body.departureTime = new Date(y, m - 1, d, p.h, p.m).toISOString(); }
  const res = await fetch('https://routes.googleapis.com/directions/v2:computeRoutes', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'X-Goog-Api-Key': MAPS_KEY, 'X-Goog-FieldMask': 'routes.duration,routes.distanceMeters' },
    body: JSON.stringify(body),
  });
  const json = await res.json().catch(() => ({}));
  if (!res.ok) throw Object.assign(new Error(json?.error?.message || `HTTP ${res.status}`), { code: json?.error?.status || res.status });
  const r = json.routes && json.routes[0];
  if (!r || !r.duration) throw Object.assign(new Error('ไม่พบเส้นทาง'), { code: 'no-route' });
  const out = { minutes: Math.ceil(parseInt(r.duration, 10) / 60), km: Math.round((r.distanceMeters || 0) / 100) / 10, traffic: !!future };
  routeCache.set(key, out);
  return out;
}
function routeErrorText(e) {
  if (e?.code === 'no-key') return 'ยังไม่ได้ใส่ Google Maps API key — กรอกเวลาเองได้';
  if (e?.code === 'no-route') return 'Google หาเส้นทางขับรถไม่เจอ — กรอกเวลาเอง';
  if (e?.code === 'PERMISSION_DENIED' || e?.code === 403) return 'API key ใช้กับ Routes API ไม่ได้ (ตรวจสอบว่าเปิด Routes API และอนุญาตโดเมนนี้)';
  if (e?.code === 'INVALID_ARGUMENT' || e?.code === 400) return `คำนวณไม่ได้: ${e.message}`;
  return 'คำนวณเวลาเดินทางไม่สำเร็จ (ออฟไลน์?) — กรอกเวลาเองได้';
}

   ===================================================================== */
function buildLineText(gigs, from, to, label) {
  const list = gigs.filter((g) => g.date >= from && g.date <= to).sort(cmpGig);
  const [fy, fm, fd] = from.split('-').map(Number);
  const [ty, tm, td] = to.split('-').map(Number);
  const range = fy === ty && fm === tm
    ? `${fd}–${td} ${TH_MONTHS_SHORT[tm - 1]} ${String(ty + 543).slice(2)}`
    : `${fd} ${TH_MONTHS_SHORT[fm - 1]} – ${td} ${TH_MONTHS_SHORT[tm - 1]} ${String(ty + 543).slice(2)}`;
  const L = [`🎸 คิวงาน${label}`, `🗓 ${range}`, '━━━━━━━━━━━━━━'];
  if (!list.length) L.push('', 'ยังไม่มีคิวงานในช่วงนี้ 🙏');
  let cur = null;
  for (const g of list) {
    if (g.date !== cur) { cur = g.date; L.push('', `📅 ${fmtDateShort(g.date)}`); }
    const st = STATUS[g.status];
    L.push(`${st.emoji} ${g.startTime}–${g.endTime}${isOvernight(g) ? ' (ข้ามคืน)' : ''} | ${GIG_TYPES[g.gigType] ? `[${GIG_TYPES[g.gigType].short}] ` : ''}${g.venueName}${g.bandName ? ` (${g.bandName})` : ''}${g.status === 'cancelled' ? ' — ยกเลิก' : g.status === 'pending' ? ' — รอคอนเฟิร์ม' : g.status === 'issue' ? ' — ติดปัญหา' : ''}`);
  }
  const c = (s) => list.filter((g) => g.status === s).length;
  L.push('', '━━━━━━━━━━━━━━');
  L.push(`✅ คอนเฟิร์ม ${c('confirmed')} · ⏳ รอ ${c('pending')} · ⚠️ ติดปัญหา ${c('issue')}${c('cancelled') ? ` · ❌ แคนเซิล ${c('cancelled')}` : ''}`);
  L.push(`รวม ${list.length - c('cancelled')} งาน 🎶`);
  return L.join('\n');
}

/* =====================================================================
   STATS
   ===================================================================== */
function computeStats(list) {
  const today = todayStr();
  const income = list.filter((g) => INCOME.has(g.status));
  const pending = list.filter((g) => g.status === 'pending');
  const fee = sumMoney(income, (g) => g.baseFee);
  const tips = sumMoney(income, tipShare);                       // ทิปส่วนของฉัน (ทิปรวม ÷ สมาชิก)
  const total = addMoney(fee, tips);
  const unpaidGigs = income.filter((g) => !g.isPaid && g.date <= today && (g.baseFee > 0 || tipShare(g) > 0));
  const outstanding = unpaidGigs.reduce((a, g) => a + toSatang(myIncome(g)), 0) / 100;
  const forecast = sumMoney(pending, (g) => g.baseFee);
  const minutes = income.reduce((a, g) => { const [s, e] = gigRange(g); return a + (e - s); }, 0);
  const avg = income.length ? Math.round(toSatang(total) / income.length) / 100 : 0;
  return { income, pending, fee, tips, total, unpaidGigs, outstanding, forecast, minutes, avg, cancelled: list.filter((g) => g.status === 'cancelled').length };
}
function breakdown(incomeGigs, keyFn) {
  const map = new Map();
  for (const g of incomeGigs) {
    const k = keyFn(g);
    const cur = map.get(k) || { name: k, count: 0, satang: 0 };
    cur.count += 1; cur.satang += toSatang(myIncome(g));
    map.set(k, cur);
  }
  const totalS = [...map.values()].reduce((a, x) => a + x.satang, 0);
  return [...map.values()].map((x) => ({ ...x, amount: x.satang / 100, pct: totalS ? (x.satang / totalS) * 100 : 0 })).sort((a, b) => b.satang - a.satang || b.count - a.count);
}

function useTheme() {
  const [mode, setMode] = useState(() => { try { return localStorage.getItem(KEY_THEME) || 'auto'; } catch (e) { return 'auto'; } });
  const [isDark, setIsDark] = useState(document.documentElement.classList.contains('dark'));
  useEffect(() => {
    const mq = window.matchMedia('(prefers-color-scheme: dark)');
    const apply = () => {
      const dark = mode === 'dark' || (mode === 'auto' && mq.matches);
      document.documentElement.classList.toggle('dark', dark);
      document.getElementById('meta-theme')?.setAttribute('content', dark ? '#000000' : '#F2F2F7');
      setIsDark(dark);
    };
    apply();
    try { localStorage.setItem(KEY_THEME, mode); } catch (e) {}
    mq.addEventListener ? mq.addEventListener('change', apply) : mq.addListener(apply);
    return () => { mq.removeEventListener ? mq.removeEventListener('change', apply) : mq.removeListener(apply); };
  }, [mode]);
  return [mode, setMode, isDark];
}
function useNow() {
  const [n, setN] = useState(nowAbs());
  useEffect(() => { const id = setInterval(() => setN(nowAbs()), 30000); return () => clearInterval(id); }, []);
  return n;
}

/* =====================================================================
   FIREBASE: GOOGLE LOGIN + PER-USER CLOUD STORAGE
   ข้อมูลของแต่ละคนอยู่ที่ users/{uid}/gigs/{gigId} และ users/{uid}/meta/venues
   Firestore Security Rules (firestore.rules) อนุญาตให้อ่าน/เขียนได้เฉพาะเจ้าของ uid เท่านั้น
   ===================================================================== */
const FB_CFG = window.GIGFLOW_FIREBASE_CONFIG || {};
const CLOUD_CONFIGURED = !!(FB_CFG.apiKey && FB_CFG.projectId);
let fbAuth = null, fbDb = null;
if (CLOUD_CONFIGURED && window.firebase) {
  try {
    firebase.initializeApp(FB_CFG);
    fbDb = firebase.firestore();
    fbDb.settings({ ignoreUndefinedProperties: true, merge: true });
    fbDb.enablePersistence({ synchronizeTabs: true }).catch(() => {}); // แคชออฟไลน์ (แยกตามผู้ใช้โดย SDK)
    fbAuth = firebase.auth();
  } catch (e) { console.error('Firebase init failed', e); fbAuth = null; fbDb = null; }
}

const isStandalone = () => window.navigator.standalone === true || window.matchMedia('(display-mode: standalone)').matches;
function authErrorText(e) {
  const map = {
    'auth/popup-closed-by-user': null,
    'auth/cancelled-popup-request': null,
    'auth/unauthorized-domain': 'โดเมนนี้ยังไม่ได้รับอนุญาต — เพิ่มใน Firebase Console › Authentication › Settings › Authorized domains',
    'auth/operation-not-allowed': 'ยังไม่ได้เปิดใช้ Google sign-in ใน Firebase Console › Authentication › Sign-in method',
    'auth/network-request-failed': 'เชื่อมต่ออินเทอร์เน็ตไม่ได้ ลองใหม่อีกครั้ง',
    'auth/too-many-requests': 'ลองบ่อยเกินไป กรุณารอสักครู่',
    'auth/user-disabled': 'บัญชีนี้ถูกระงับการใช้งาน',
  };
  if (e && e.code in map) return map[e.code];
  return `เข้าสู่ระบบไม่สำเร็จ (${e?.code || e?.message || 'unknown'})`;
}
async function signInWithGoogle() {
  const provider = new firebase.auth.GoogleAuthProvider();
  provider.setCustomParameters({ prompt: 'select_account' });
  // แอปที่ "เพิ่มลงหน้าจอโฮม" บน iPhone เปิดป๊อปอัปไม่ได้ → ใช้ redirect แทน
  if (isStandalone()) return fbAuth.signInWithRedirect(provider);
  try {
    await fbAuth.signInWithPopup(provider);
  } catch (e) {
    if (e.code === 'auth/popup-blocked' || e.code === 'auth/operation-not-supported-in-this-environment') return fbAuth.signInWithRedirect(provider);
    throw e;
  }
}
function useAuthState() {
  const [st, setSt] = useState({ status: 'loading', user: null, error: null });
  useEffect(() => {
    if (!fbAuth) return;
    fbAuth.getRedirectResult().catch((e) => setSt((s) => ({ ...s, error: authErrorText(e) })));
    return fbAuth.onAuthStateChanged((u) => setSt((s) => ({ status: u ? 'in' : 'out', user: u, error: u ? null : s.error })));
  }, []);
  return [st, setSt];
}

/** stringify แบบเรียง key เสมอ — ใช้เทียบว่าข้อมูลในเครื่องต่างจากบนคลาวด์หรือไม่ */
function stableStr(v) {
  if (Array.isArray(v)) return '[' + v.map(stableStr).join(',') + ']';
  if (v && typeof v === 'object') return '{' + Object.keys(v).sort().filter((k) => v[k] !== undefined).map((k) => JSON.stringify(k) + ':' + stableStr(v[k])).join(',') + '}';
  return JSON.stringify(v ?? null);
}
async function commitOps(ops) {
  // Firestore batch รับได้สูงสุด 500 operations → แบ่งเป็นชุดละ 450
  const jobs = [];
  for (let i = 0; i < ops.length; i += 450) {
    const b = fbDb.batch();
    ops.slice(i, i + 450).forEach((o) => (o.type === 'set' ? b.set(o.ref, o.data) : b.delete(o.ref)));
    jobs.push(b.commit());
  }
  return Promise.all(jobs);
}

/**
 * ซิงก์ state ของแอป (gigs, venues) กับ Firestore ของผู้ใช้คนนั้นแบบสองทาง:
 *  - รับ: onSnapshot → แทนที่ state ด้วยข้อมูลบนคลาวด์ (รวมการแก้ไขที่ยังรอส่ง)
 *  - ส่ง: ทุกครั้งที่ state เปลี่ยน → diff กับสำเนาล่าสุดบนคลาวด์ แล้วเขียนเฉพาะรายการที่เปลี่ยน/ลบ
 */
function useCloudSync(user, gigs, setGigs, venues, setVenues, settings, setSettings, toast) {
  const [ready, setReady] = useState(!user);
  const [state, setState] = useState(user ? 'loading' : 'local');
  const remoteGigs = useRef(new Map());
  const remoteVenues = useRef(null);
  const remoteSettings = useRef(null);
  const got = useRef({ gigs: false, venues: false, settings: false });
  const errShown = useRef(false);
  const base = user ? fbDb.collection('users').doc(user.uid) : null;

  const reportError = useCallback((e) => {
    console.error('Firestore sync error', e);
    setState('error');
    if (!errShown.current) {
      errShown.current = true;
      toast(e?.code === 'permission-denied' ? 'ไม่มีสิทธิ์เข้าถึงข้อมูล — ตรวจสอบ Firestore Rules' : 'ซิงก์ข้อมูลไม่สำเร็จ', 'error');
      setTimeout(() => { errShown.current = false; }, 10000);
    }
  }, [toast]);

  useEffect(() => {
    if (!user) return;
    const markReady = () => { if (got.current.gigs && got.current.venues && got.current.settings) setReady(true); };
    const onListenErr = (e) => { reportError(e); got.current = { gigs: true, venues: true, settings: true }; setReady(true); };
    const u3 = base.collection('meta').doc('settings').onSnapshot((d) => {
      const s = normalizeSettings(d.exists ? d.data() : DEFAULT_SETTINGS);
      remoteSettings.current = stableStr(s);
      setSettings(s);
      got.current.settings = true; markReady();
    }, onListenErr);
    const u1 = base.collection('gigs').onSnapshot({ includeMetadataChanges: true }, (snap) => {
      const map = new Map(), list = [];
      snap.forEach((d) => { const g = normalizeGig({ ...d.data(), id: d.id }); if (g) { map.set(g.id, stableStr(g)); list.push(g); } });
      remoteGigs.current = map;
      setGigs(list);
      got.current.gigs = true; markReady();
      setState(snap.metadata.hasPendingWrites ? 'saving' : snap.metadata.fromCache ? 'offline' : 'synced');
    }, onListenErr);
    const u2 = base.collection('meta').doc('venues').onSnapshot((d) => {
      const obj = {};
      (d.exists ? d.data().list || [] : []).forEach((v) => { if (v && v.name) { const { name, ...rest } = v; obj[name] = rest; } });
      remoteVenues.current = stableStr(obj);
      setVenues(obj);
      got.current.venues = true; markReady();
    }, onListenErr);
    return () => { u1(); u2(); u3(); };
  }, [user && user.uid]);

  useEffect(() => {
    if (!user || !ready) return;
    const n = normalizeSettings(settings);
    const s = stableStr(n);
    if (s === remoteSettings.current) return;
    remoteSettings.current = s;
    base.collection('meta').doc('settings').set({ ...n, updatedAt: Date.now() }).catch(reportError);
  }, [settings, ready]);

  useEffect(() => {
    if (!user || !ready) return;
    const col = base.collection('gigs');
    const ops = [], ids = new Set();
    gigs.forEach((g) => {
      const n = normalizeGig(g);
      if (!n) return;
      ids.add(n.id);
      const s = stableStr(n);
      if (remoteGigs.current.get(n.id) !== s) { ops.push({ type: 'set', ref: col.doc(n.id), data: n }); remoteGigs.current.set(n.id, s); }
    });
    [...remoteGigs.current.keys()].forEach((id) => { if (!ids.has(id)) { ops.push({ type: 'del', ref: col.doc(id) }); remoteGigs.current.delete(id); } });
    if (!ops.length) return;
    setState('saving');
    commitOps(ops).then(() => setState((s) => (s === 'saving' ? 'synced' : s))).catch(reportError);
  }, [gigs, ready]);

  useEffect(() => {
    if (!user || !ready) return;
    const s = stableStr(venues);
    if (s === remoteVenues.current) return;
    remoteVenues.current = s;
    base.collection('meta').doc('venues')
      .set({ list: Object.entries(venues).map(([name, v]) => ({ name, ...v })), updatedAt: Date.now() })
      .catch(reportError);
  }, [venues, ready]);

  return { ready, state };
}

    { i: 'devices', c: '#34C759', t: 'ซิงก์ทุกเครื่อง', d: 'เปิดบน iPhone, iPad หรือคอมพิวเตอร์ ข้อมูลตรงกันอัตโนมัติ' },
    { i: 'cloud_off', c: '#FF9500', t: 'ใช้ได้แม้ไม่มีเน็ต', d: 'บันทึกในเครื่องก่อน แล้วซิงก์ให้เมื่อกลับมาออนไลน์' },

        <div className="mt-9 w-full space-y-4 text-left">

      </div>
    </div>
  );
}

/* ---------- Gig row (shared) ---------- */
function GigRow({ gig, onClick, now, showDate = true }) {
  const st = STATUS[gig.status];
  const cancelled = gig.status === 'cancelled';
  const [s, e] = gigRange(gig);
  const live = !cancelled && now >= s && now < e;
  const [, m, d] = gig.date.split('-').map(Number);
  return (
    <button onClick={onClick} className="w-full flex items-center gap-3 px-4 py-3 text-left active:bg-black/[0.04] dark:active:bg-white/[0.06] transition-colors">
      {showDate ? (
        <div className="w-12 shrink-0 text-center rounded-[12px] py-1.5 bg-[#F2F2F7] dark:bg-[#2C2C2E] relative">
          <div className={`text-[11px] font-semibold ${weekdayOf(gig.date) === 0 ? 'text-[#FF3B30]' : 'text-[#8E8E93]'}`}>{TH_DAYS_SHORT[weekdayOf(gig.date)]}</div>
          <div className="text-[20px] font-bold leading-none tnum my-[1px]">{d}</div>
          <div className="text-[10px] text-[#8E8E93]">{TH_MONTHS_SHORT[m - 1]}</div>
          <span className="absolute -top-0.5 -right-0.5 w-3 h-3 rounded-full border-2 border-white dark:border-[#1C1C1E]" style={{ background: st.color }} />
        </div>
      ) : (
        <div className="w-1 self-stretch rounded-full" style={{ background: st.color }} />
      )}
      <div className="flex-1 min-w-0">
        <div className={`flex items-center gap-1.5 text-[16px] font-semibold ${cancelled ? 'line-through decoration-[#FF3B30]/70 text-[#8E8E93]' : ''}`}>
          <span className="truncate">{gig.venueName}</span>
          {gig.recurringGroupId && <Icon name="repeat" size={15} className="text-[#8E8E93] shrink-0" />}
        </div>
        <div className={`text-[13px] text-[#8E8E93] flex items-center gap-1 tnum mt-0.5 ${cancelled ? 'line-through' : ''}`}>
          <span>{gig.startTime}–{gig.endTime}</span>
          {isOvernight(gig) && <span className="inline-flex items-center text-[10px] font-bold px-1 rounded bg-[#5856D6]/15 text-[#5856D6] dark:text-[#A5A3FF]"><Icon name="bedtime" size={11} />+1</span>}
          {GIG_TYPES[gig.gigType] && <span className="text-[10px] font-bold px-1 rounded shrink-0" style={{ color: GIG_TYPES[gig.gigType].color, background: GIG_TYPES[gig.gigType].color + '1F' }}>{GIG_TYPES[gig.gigType].short}</span>}
          {gig.bandName && <span className="truncate">· {gig.bandName}</span>}
        </div>
      </div>
      <div className="text-right shrink-0 flex flex-col items-end gap-1">
        {live ? (
          <span className="text-[11px] font-bold text-white bg-[#FF3B30] rounded-full px-2 py-[2px] flex items-center gap-1"><span className="w-1.5 h-1.5 rounded-full bg-white animate-pulse" />LIVE</span>
        ) : <StatusBadge status={gig.status} small />}
        {(gig.baseFee > 0 || tipShare(gig) > 0) && (
          <div className={`text-[13px] font-semibold tnum flex items-center gap-1 ${cancelled ? 'text-[#8E8E93] line-through' : ''}`}>
            {!cancelled && INCOME.has(gig.status) && gig.date <= todayStr() && <Icon name={gig.isPaid ? 'check_circle' : 'schedule'} size={14} fill className={gig.isPaid ? 'text-[#34C759]' : 'text-[#FF9500]'} />}
            {fmtMoney(myIncome(gig))}
          </div>
        )}
      </div>
    </button>
  );
}

function EmptyState({ icon, title, text, children }) {
  return (
    <div className="text-center px-8 py-10">
      <div className="mx-auto w-16 h-16 rounded-[20px] bg-[#5856D6]/10 flex items-center justify-center mb-3"><Icon name={icon} size={32} className="text-[#5856D6] dark:text-[#A5A3FF]" /></div>
      <div className="text-[17px] font-semibold">{title}</div>
      {text && <div className="text-[14px] text-[#8E8E93] mt-1">{text}</div>}
      {children && <div className="mt-4 flex flex-col gap-2 items-center">{children}</div>}
    </div>
  );
}

/* =====================================================================
   HOME
   ===================================================================== */
function TodayWidget({ gigs, now, onEdit, onAdd, onDemo }) {
  const today = todayStr();
  const yest = addDays(today, -1);
  const active = gigs.filter((g) => g.status !== 'cancelled');
  let day = null;
  if (active.some((g) => g.date === yest && gigRange(g)[1] > now)) day = yest;      // งานกะดึกเมื่อคืนยังเล่นอยู่
  else if (active.some((g) => g.date === today)) day = today;
  else day = active.filter((g) => g.date > today).sort(cmpGig)[0]?.date || null;

  if (!day) {
    return (
      <Card className="mx-4 overflow-hidden">
        <EmptyState icon="music_note" title="ยังไม่มีคิวงานที่จะถึง" text="เพิ่มคิวแรกของคุณ หรือโหลดข้อมูลตัวอย่างเพื่อทดลองใช้">
          <button onClick={() => onAdd()} className="h-11 px-6 rounded-full bg-[#5856D6] text-white font-semibold active:opacity-80">+ เพิ่มคิวงาน</button>
          <button onClick={onDemo} className="h-9 px-4 text-[#5856D6] dark:text-[#A5A3FF] font-semibold text-[15px]">โหลดข้อมูลตัวอย่าง</button>
        </EmptyState>
      </Card>
    );
  }

  const dayGigs = active.filter((g) => g.date === day).sort(cmpGig);
  const isNowDay = day === today || day === yest;
  let focusIdx = 0;
  if (isNowDay) { const i = dayGigs.findIndex((g) => gigRange(g)[1] > now); focusIdx = i === -1 ? dayGigs.length - 1 : i; }
  const focus = dayGigs[focusIdx];
  const [fs, fe] = gigRange(focus);
  const multi = dayGigs.length > 1;

  // Smart routing: วิ่งรอก → นำทางจากร้านก่อนหน้าไปร้านถัดไป
  let legTo = 0;
  if (multi) {
    if (isNowDay) { const nextStart = dayGigs.findIndex((g) => gigRange(g)[0] > now); legTo = nextStart === -1 ? dayGigs.length - 1 : nextStart; }
    legTo = Math.min(Math.max(legTo, 1), dayGigs.length - 1);
  }
  const navUrl = multi ? mapsDirUrl(dayGigs[legTo - 1], dayGigs[legTo]) : mapsPlaceUrl(focus);
  const navLabel = multi ? `${dayGigs[legTo - 1].venueName} → ${dayGigs[legTo].venueName}` : focus.venueName;

  let countdown;
  if (now >= fe) countdown = 'เล่นจบแล้ว';
  else if (now >= fs) countdown = `กำลังเล่น · เหลืออีก ${fmtDur(fe - now)}`;
  else if (fs - now < 24 * 60) countdown = `เริ่มในอีก ${fmtDur(fs - now)}`;
  else countdown = `อีก ${dayNum(day) - dayNum(today)} วัน`;
  const leaveAt = absToTime(fs - (focus.travelMinutes || 0));
  const header = day === today ? 'งานคืนนี้' : day === yest ? 'งานกะดึก (เมื่อคืน)' : `งานถัดไป · ${relDay(day)}`;

  return (
    <div className="mx-4 rounded-[22px] overflow-hidden text-white shadow-[0_10px_30px_-10px_rgba(49,46,129,0.6)]" style={{ background: 'linear-gradient(145deg,#312E81 0%,#1E1B4B 100%)' }}>
      <div className="p-5 pb-4 relative">
        <div className="absolute -right-10 -top-10 w-40 h-40 rounded-full bg-white/[0.06]" />
        <div className="absolute right-6 top-14 w-24 h-24 rounded-full bg-[#34C759]/[0.08]" />
        <div className="flex items-center justify-between relative">
          <div className="flex items-center gap-1.5 text-[13px] font-semibold text-white/70 uppercase tracking-wide">
            <Icon name="graphic_eq" size={18} />{header}
          </div>
          {multi && <span className="text-[11px] font-bold px-2 py-[3px] rounded-full bg-[#FF9500] text-white flex items-center gap-1"><Icon name="directions_run" size={13} />วิ่งรอก {dayGigs.length} งาน</span>}
        </div>
        <button onClick={() => onEdit(focus)} className="block text-left mt-2 relative w-full">
          <div className="text-[26px] font-bold leading-tight tracking-tight truncate">{focus.venueName}</div>
          <div className="flex items-center gap-2 mt-1 text-[15px] text-white/85 tnum flex-wrap">
            <span className="font-semibold">{focus.startTime} – {focus.endTime}</span>
            {isOvernight(focus) && <span className="text-[11px] font-bold px-1.5 py-[1px] rounded bg-white/15 flex items-center gap-0.5"><Icon name="bedtime" size={12} />ข้ามคืน</span>}
            {focus.bandName && <span className="text-white/70">· {focus.bandName}</span>}
          </div>
          <div className="flex items-center gap-2 mt-3 flex-wrap">
            <span className="text-[12px] font-semibold px-2.5 py-[3px] rounded-full flex items-center gap-1" style={{ background: STATUS[focus.status].color + '33', color: focus.status === 'pending' ? '#FFE066' : '#fff' }}>
              <span className="w-1.5 h-1.5 rounded-full" style={{ background: STATUS[focus.status].color }} />{STATUS[focus.status].label}
            </span>
            <span className="text-[12px] text-white/75 flex items-center gap-1"><Icon name="timer" size={14} />{countdown}</span>
            {now < fs && focus.travelMinutes > 0 && <span className="text-[12px] text-white/75 flex items-center gap-1"><Icon name="directions_car" size={14} />ออกก่อน {leaveAt}</span>}
          </div>
        </button>

        {multi && (
          <div className="mt-4 rounded-[14px] bg-white/[0.08] divide-y divide-white/10 relative">
            {dayGigs.map((g, i) => {
              const [gs, ge] = gigRange(g);
              const done = isNowDay && now >= ge;
              return (
                <div key={g.id} className={`flex items-center gap-2.5 px-3 py-2 ${done ? 'opacity-50' : ''}`}>
                  <span className="w-5 h-5 rounded-full text-[11px] font-bold flex items-center justify-center" style={{ background: STATUS[g.status].color, color: g.status === 'pending' ? '#000' : '#fff' }}>{i + 1}</span>
                  <button onClick={() => onEdit(g)} className="flex-1 min-w-0 text-left">
                    <div className="text-[14px] font-semibold truncate">{g.venueName}</div>
                    <div className="text-[12px] text-white/65 tnum">{g.startTime}–{g.endTime}{i > 0 && ` · ห่างจากงานก่อน ${fmtDur(gs - gigRange(dayGigs[i - 1])[1])}`}</div>
                  </button>
                  <button aria-label="นำทางช่วงนี้" onClick={() => openUrl(i === 0 ? mapsPlaceUrl(g) : mapsDirUrl(dayGigs[i - 1], g))} className="w-8 h-8 rounded-full bg-white/10 flex items-center justify-center active:bg-white/20"><Icon name={i === 0 ? 'location_on' : 'alt_route'} size={18} /></button>
                  <button aria-label="ลงปฏิทิน" onClick={() => openUrl(calendarUrl(g))} className="w-8 h-8 rounded-full bg-white/10 flex items-center justify-center active:bg-white/20"><Icon name="calendar_add_on" size={18} /></button>
                </div>
              );
            })}
          </div>
        )}
      </div>
      <div className="grid grid-cols-2 gap-2.5 px-5 pb-5">
        <button onClick={() => openUrl(navUrl)} className="h-[54px] rounded-[16px] bg-white text-[#1E1B4B] font-semibold flex flex-col items-center justify-center leading-tight active:scale-[0.98] transition-transform px-2">
          <span className="flex items-center gap-1.5 text-[15px]"><Icon name={multi ? 'alt_route' : 'near_me'} fill size={20} />{multi ? 'นำทางวิ่งรอก' : 'นำทาง'}</span>
          <span className="text-[11px] font-medium text-[#1E1B4B]/60 truncate max-w-full">{navLabel}</span>
        </button>
        <button onClick={() => openUrl(calendarUrl(focus))} className="h-[54px] rounded-[16px] bg-white/15 text-white font-semibold flex flex-col items-center justify-center leading-tight active:scale-[0.98] transition-transform backdrop-blur">
          <span className="flex items-center gap-1.5 text-[15px]"><Icon name="event" size={20} />ลงปฏิทิน</span>
          <span className="text-[11px] font-medium text-white/60">Google Calendar</span>
        </button>
      </div>
    </div>
  );
}

function MonthlySummary({ gigs, onOpen }) {
  const t = todayStr();
  const ym = t.slice(0, 7);
  const [y, m] = ym.split('-').map(Number);
  const st = computeStats(gigs.filter((g) => g.date.startsWith(ym)));
  return (
    <Card className="mx-4 p-5">
      <button onClick={onOpen} className="w-full text-left">
        <div className="flex items-center justify-between">
          <div className="text-[13px] font-semibold text-[#8E8E93] flex items-center gap-1"><Icon name="account_balance_wallet" size={17} />รายได้สุทธิ · {monthLabel(y, m)}</div>
          <Icon name="chevron_right" className="text-[#C7C7CC]" />
        </div>
        <div className="text-[40px] font-bold tracking-tight tnum leading-tight mt-1">{fmtMoney(st.total)}</div>
        <div className="text-[13px] text-[#8E8E93]">{st.income.length} งาน · {fmtDur(st.minutes)} บนเวที</div>
      </button>
      <div className="grid grid-cols-3 gap-2 mt-4">
        {[
          { l: 'ค่าตัว', v: st.fee, c: 'text-[#5856D6] dark:text-[#A5A3FF]', i: 'payments' },
          { l: 'ทิป', v: st.tips, c: 'st-confirmed', i: 'volunteer_activism' },
          { l: 'ค้างจ่าย', v: st.outstanding, c: 'st-issue', i: 'pending_actions' },
        ].map((x) => (
          <div key={x.l} className="rounded-[14px] bg-[#F2F2F7] dark:bg-[#2C2C2E] px-3 py-2.5">
            <div className={`text-[12px] font-semibold flex items-center gap-1 ${x.c}`}><Icon name={x.i} size={14} />{x.l}</div>
            <div className="text-[16px] font-bold tnum mt-0.5 truncate">{fmtMoney(x.v)}</div>
          </div>
        ))}
      </div>
      <div className="mt-3 flex items-center gap-1.5 text-[13px] text-[#8E8E93]">
        <span className="w-2 h-2 rounded-full bg-[#FFCC00]" />
        ยอดคาดการณ์ <span className="font-semibold text-black dark:text-white tnum">+{fmtMoney(st.forecast)}</span> จาก {st.pending.length} งานรอคอนเฟิร์ม
      </div>
    </Card>
  );
}

function IssueAlerts({ gigs, now, onResolve, onEdit }) {
  const list = gigs.filter((g) => needsIssueCheck(g, now)).sort(cmpGig);
  if (!list.length) return null;
  const when = (g) => { const d = daysUntil(g); return d <= 0 ? 'วันนี้' : d === 1 ? 'พรุ่งนี้' : `อีก ${d} วัน`; };
  return (
    <div id="issue-alerts" className="mx-4 mb-4 rounded-[20px] overflow-hidden bg-white dark:bg-[#1C1C1E] border-2 border-[#FF9500] shadow-[0_8px_24px_-12px_rgba(255,149,0,0.6)] anim-pop">
      <div className="px-4 pt-3.5 pb-2 flex items-center gap-2.5">
        <span className="w-9 h-9 rounded-[10px] bg-[#FF9500] text-white flex items-center justify-center shrink-0"><Icon name="notification_important" fill size={22} /></span>
        <div className="min-w-0">
          <div className="text-[16px] font-bold">ต้องเช็คปัญหา {list.length} งาน</div>
          <div className="text-[12.5px] text-[#8E8E93]">ใกล้ถึงวันงานแล้ว — เช็คอีกครั้งว่าปัญหาจบหรือยัง</div>
        </div>
      </div>
      {list.map((g) => (
        <div key={g.id} className="px-4 py-3 border-t border-black/[0.08] dark:border-white/[0.1]">
          <button onClick={() => onEdit(g)} className="w-full text-left">
            <div className="flex items-center gap-2">
              <span className="text-[11px] font-bold px-1.5 py-[2px] rounded bg-[#FF9500] text-white shrink-0">{when(g)}</span>
              <span className="text-[15px] font-semibold truncate">{g.venueName}</span>
            </div>
            <div className="text-[12.5px] text-[#8E8E93] tnum mt-0.5">{fmtDateShort(g.date)} · {g.startTime}–{g.endTime}{g.bandName ? ` · ${g.bandName}` : ''}</div>
            <div className="mt-2 rounded-[10px] px-3 py-2 text-[14px] st-issue flex gap-1.5" style={{ background: 'rgba(255,149,0,0.12)' }}>
              <Icon name="error" size={17} fill className="shrink-0 mt-[1px]" /><span className="text-black dark:text-white">{g.issueNote || 'ยังไม่ได้ระบุปัญหา — แตะเพื่อกรอก'}</span>
            </div>
          </button>
          <div className="flex gap-2 mt-2.5">
            <button onClick={() => onResolve(g)} className="flex-1 h-10 rounded-[12px] bg-[#34C759] text-white text-[14px] font-semibold flex items-center justify-center gap-1 active:opacity-85"><Icon name="check_circle" size={18} fill />ปัญหาเคลียร์แล้ว</button>
            <button onClick={() => openUrl(issueCalendarUrl(g))} aria-label="เพิ่มนัดเช็คปัญหาลง Google Calendar" className="w-10 h-10 rounded-[12px] bg-[#007AFF]/10 text-[#007AFF] dark:text-[#0A84FF] flex items-center justify-center"><Icon name="notification_add" size={20} /></button>
            <button onClick={() => onEdit(g)} aria-label="แก้ไขงาน" className="w-10 h-10 rounded-[12px] bg-[#767680]/[0.12] flex items-center justify-center"><Icon name="edit" size={19} /></button>
          </div>
        </div>
      ))}
    </div>
  );
}

function HomeView({ gigs, now, theme, setTheme, onAdd, onEdit, onDemo, goTab, user, sync, onAccount, onResolveIssue }) {
  const today = todayStr();
  const upcoming = gigs.filter((g) => g.status !== 'cancelled' && gigRange(g)[1] > now && g.date !== today).sort(cmpGig).slice(0, 6);
  const hour = new Date().getHours();
  const greet = hour < 5 ? 'ดึกแล้ว พักผ่อนบ้างนะ 🌙' : hour < 12 ? 'สวัสดีตอนเช้า ☀️' : hour < 17 ? 'สวัสดีตอนบ่าย 🎵' : 'คืนนี้ร็อกให้สุด 🎸';
  return (
    <div className="page-pad">
      <PageHeader title="GigFlow" subtitle={`${fmtDateLong(today)}`} logo={<AppLogo size={36} />} right={<>
        <ThemeToggle mode={theme} setMode={setTheme} />
        {user && <button onClick={onAccount} aria-label="บัญชีผู้ใช้" className="active:opacity-70"><Avatar user={user} size={32} /></button>}
      </>} />
      <div className="px-5 pb-3 flex items-center justify-between gap-2">
        <span className="text-[15px] text-[#8E8E93] truncate">{user?.displayName ? `${greet.replace(/ [^ ]+$/, '')} คุณ${user.displayName.split(' ')[0]} ${greet.split(' ').pop()}` : greet}</span>
        {user && <SyncBadge state={sync.state} />}
      </div>
      <IssueAlerts gigs={gigs} now={now} onResolve={onResolveIssue} onEdit={onEdit} />
      <TodayWidget gigs={gigs} now={now} onEdit={onEdit} onAdd={onAdd} onDemo={onDemo} />
      <SectionTitle>สรุปเดือนนี้</SectionTitle>
      <MonthlySummary gigs={gigs} onOpen={() => goTab('finance')} />
      <SectionTitle right={<button onClick={() => goTab('schedule')} className="text-[15px] text-[#5856D6] dark:text-[#A5A3FF] font-medium">ดูทั้งหมด</button>}>คิวงานถัดไป</SectionTitle>

function ScheduleView({ gigs, now, theme, setTheme, onEdit, onAdd, onLineShare }) {
  const t = todayStr();
  const [view, setView] = useState('list');
  const [filter, setFilter] = useState('all');
  const [cursor, setCursor] = useState(() => ({ y: +t.slice(0, 4), m: +t.slice(5, 7) }));
  const [selected, setSelected] = useState(t);
  const ym = `${cursor.y}-${pad(cursor.m)}`;
  const monthGigs = gigs.filter((g) => g.date.startsWith(ym)).sort(cmpGig);
  const filtered = filter === 'all' ? monthGigs : monthGigs.filter((g) => g.status === filter);
  const moveMonth = (d) => setCursor((c) => { let m = c.m + d, y = c.y; if (m < 1) { m = 12; y--; } if (m > 12) { m = 1; y++; } return { y, m }; });
  const goToday = () => { setCursor({ y: +t.slice(0, 4), m: +t.slice(5, 7) }); setSelected(t); };

  const groups = [];
  filtered.forEach((g) => { const last = groups[groups.length - 1]; if (last && last.date === g.date) last.items.push(g); else groups.push({ date: g.date, items: [g] }); });

  const first = `${ym}-01`;
  const lead = weekdayOf(first);
  const dim = daysInMonth(cursor.y, cursor.m);
  const cells = [...Array(lead).fill(null), ...Array.from({ length: dim }, (_, i) => `${ym}-${pad(i + 1)}`)];
  while (cells.length % 7) cells.push(null);
  const byDate = {};
  filtered.forEach((g) => { (byDate[g.date] = byDate[g.date] || []).push(g); });
  const selGigs = (byDate[selected] || []);

  return (
    <div className="page-pad">
      <PageHeader title="ตารางงาน" subtitle={`${monthGigs.filter((g) => g.status !== 'cancelled').length} งานในเดือนนี้`} right={<ThemeToggle mode={theme} setMode={setTheme} />} />
      <div className="px-4 space-y-3">
        <Segmented value={view} onChange={setView} options={[{ value: 'list', label: 'รายการ', icon: 'view_agenda' }, { value: 'calendar', label: 'ปฏิทิน', icon: 'calendar_month' }]} />
        <button onClick={() => onLineShare(cursor)} className="w-full h-12 rounded-[14px] bg-[#06C755] text-white font-semibold flex items-center justify-center gap-2 active:opacity-85 shadow-[0_6px_16px_-8px_rgba(6,199,85,0.8)]">
          <Icon name="content_copy" size={20} />ก๊อปปี้คิวงานส่ง LINE
        </button>
        <div className="flex items-center justify-between">
          <button onClick={() => moveMonth(-1)} aria-label="เดือนก่อน" className="w-9 h-9 rounded-full flex items-center justify-center text-[#5856D6] dark:text-[#A5A3FF] active:bg-black/5"><Icon name="chevron_left" size={26} /></button>
          <button onClick={goToday} className="text-[17px] font-semibold">{monthLabel(cursor.y, cursor.m)}{ym !== t.slice(0, 7) && <span className="ml-2 text-[13px] text-[#5856D6] dark:text-[#A5A3FF]">กลับวันนี้</span>}</button>
          <button onClick={() => moveMonth(1)} aria-label="เดือนถัดไป" className="w-9 h-9 rounded-full flex items-center justify-center text-[#5856D6] dark:text-[#A5A3FF] active:bg-black/5"><Icon name="chevron_right" size={26} /></button>
        </div>
        <div className="flex gap-2 overflow-x-auto no-scrollbar -mx-4 px-4">
          {[{ k: 'all', l: 'ทั้งหมด', c: null }, ...STATUS_ORDER.map((k) => ({ k, l: STATUS[k].label, c: STATUS[k].color }))].map((f) => {
            const n = f.k === 'all' ? monthGigs.length : monthGigs.filter((g) => g.status === f.k).length;
            const on = filter === f.k;
            return (
              <button key={f.k} onClick={() => setFilter(f.k)} className={`h-8 px-3 rounded-full text-[13px] font-semibold whitespace-nowrap flex items-center gap-1.5 transition-colors ${on ? 'bg-black text-white dark:bg-white dark:text-black' : 'bg-white dark:bg-[#1C1C1E] text-black/80 dark:text-white/80'}`}>
                {f.c && <span className="w-2 h-2 rounded-full" style={{ background: f.c }} />}{f.l}<span className={`tnum ${on ? 'opacity-70' : 'text-[#8E8E93]'}`}>{n}</span>
              </button>
            );
          })}
        </div>
      </div>

      {view === 'list' ? (
        <div className="mt-3">
          {groups.length ? groups.map((gr) => (
            <div key={gr.date} className="mb-4">
              <div className="px-5 pb-1.5 flex items-center gap-2 text-[13px] font-semibold text-[#8E8E93]">
                {fmtDateShort(gr.date)}
                {gr.date === t && <span className="text-[11px] font-bold px-1.5 py-[1px] rounded bg-[#5856D6] text-white">วันนี้</span>}
                {gr.items.filter((g) => g.status !== 'cancelled').length > 1 && <span className="text-[11px] font-bold px-1.5 py-[1px] rounded bg-[#FF9500]/15 st-issue">วิ่งรอก</span>}
              </div>
              <Card className="mx-4 overflow-hidden">
                {gr.items.map((g, i) => <React.Fragment key={g.id}>{i > 0 && <Sep />}<GigRow gig={g} now={now} showDate={false} onClick={() => onEdit(g)} /></React.Fragment>)}
              </Card>
            </div>
          )) : (
            <Card className="mx-4"><EmptyState icon="event_busy" title="ไม่มีคิวงาน" text={filter === 'all' ? 'เดือนนี้ยังว่างอยู่' : `ไม่มีงานสถานะ “${STATUS[filter].label}”`}><button onClick={() => onAdd()} className="h-10 px-5 rounded-full bg-[#5856D6] text-white font-semibold">+ เพิ่มคิวงาน</button></EmptyState></Card>
          )}
        </div>
      ) : (
        <div className="mt-3">
          <Card className="mx-4 p-3">
            <div className="grid grid-cols-7 mb-1">
              {TH_DAYS_MINI.map((d, i) => <div key={d} className={`text-center text-[12px] font-semibold py-1 ${i === 0 ? 'text-[#FF3B30]/80' : 'text-[#8E8E93]'}`}>{d}</div>)}
            </div>
            <div className="grid grid-cols-7 gap-y-1">
              {cells.map((d, i) => {
                if (!d) return <div key={'e' + i} />;
                const list = byDate[d] || [];
                const isSel = d === selected, isToday = d === t;
                return (
                  <button key={d} onClick={() => setSelected(d)} className="flex flex-col items-center py-1 rounded-[12px] active:bg-black/5">
                    <span className={`w-9 h-9 rounded-full flex items-center justify-center text-[16px] tnum transition-colors ${isSel ? (isToday ? 'bg-[#FF3B30] text-white font-bold' : 'bg-black text-white dark:bg-white dark:text-black font-bold') : isToday ? 'text-[#FF3B30] font-bold' : ''}`}>{+d.slice(8)}</span>
                    <span className="flex gap-[3px] h-[6px] mt-0.5">
                      {list.slice(0, 3).map((g) => <span key={g.id} className="w-[6px] h-[6px] rounded-full" style={{ background: STATUS[g.status].color }} />)}
                    </span>
                  </button>
                );
              })}
            </div>
          </Card>
          <div className="px-5 pt-4 pb-1.5 flex items-center justify-between">
            <div className="text-[15px] font-semibold">{fmtDateLong(selected)}</div>
            <button onClick={() => onAdd(selected)} className="text-[15px] font-semibold text-[#5856D6] dark:text-[#A5A3FF] flex items-center gap-0.5"><Icon name="add" size={20} />เพิ่ม</button>
          </div>
          <Card className="mx-4 overflow-hidden">
            {selGigs.length ? selGigs.map((g, i) => <React.Fragment key={g.id}>{i > 0 && <Sep />}<GigRow gig={g} now={now} showDate={false} onClick={() => onEdit(g)} /></React.Fragment>)
              : <div className="py-7 text-center text-[#8E8E93] text-[15px]">ว่าง — ไม่มีคิวงานวันนี้</div>}
          </Card>
        </div>
      )}
    </div>
  );
}

function FinanceView({ gigs, now, theme, setTheme, onEdit, onMarkPaid, onBatch, onExport, onImport, onDemo, onClear, user, sync, onSignOut, venueCount, onVenues, openPastCount, onClosePast }) {

  const byBand = breakdown(st.income, (g) => g.bandName || 'ไม่ระบุวง');

  const move = (d) => setCur((c) => {

    let m = c.m + d, y = c.y; if (m < 1) { m = 12; y--; } if (m > 12) { m = 1; y++; } return { y, m };

          <button onClick={() => move(1)} aria-label="ถัดไป" className="w-9 h-9 rounded-full flex items-center justify-center text-[#5856D6] dark:text-[#A5A3FF]"><Icon name="chevron_right" size={26} /></button>

      <Card className="mx-4 mt-2 p-5">

            { l: 'ยอดทิป (ส่วนของฉัน)', v: fmtMoney(st.tips), i: 'volunteer_activism', c: '#34C759' },
            { l: 'ค้างจ่าย', v: fmtMoney(st.outstanding), i: 'pending_actions', c: '#FF9500' },
            { l: 'คาดการณ์ (รอคอนเฟิร์ม)', v: '+' + fmtMoney(st.forecast), i: 'trending_up', c: '#FFCC00' },

        <Sep />

      <input ref={fileRef} type="file" accept="application/json,.json" className="hidden" onChange={(e) => { const f = e.target.files?.[0]; if (f) onImport(f); e.target.value = ''; }} />
      <div className="text-center text-[12px] text-[#8E8E93] mt-5 px-8 leading-relaxed flex flex-col items-center gap-2">
        <AppLogo size={28} />
        {user
          ? <>ข้อมูลถูกบันทึกในบัญชีของคุณบน Cloud Firestore อัตโนมัติ<br />เฉพาะเจ้าของบัญชีเท่านั้นที่อ่าน/แก้ไขได้ · ใช้งานออฟไลน์ได้</>
          : <>ข้อมูลทั้งหมดถูกบันทึกในเครื่องนี้ (localStorage) อัตโนมัติ<br />ไม่มีการส่งข้อมูลขึ้นเซิร์ฟเวอร์ · ควร Export สำรองไว้เป็นระยะ</>}
      </div>
    </div>
  );
}

function initForm(g) {
  return {
    date: g.date, startTime: g.startTime, endTime: g.endTime, venueName: g.venueName || '', status: g.status || 'pending',
    bandName: g.bandName || '', baseFee: g.baseFee ? String(g.baseFee) : '', mapsUrl: g.mapsUrl || '',
    travelMinutes: String(g.travelMinutes ?? 30), notes: g.notes || '', tips: g.tips ? String(g.tips) : '', isPaid: !!g.isPaid,
    issueNote: g.issueNote || '',
    gigType: g.gigType || '', members: String(g.members || 1),
  };
}
function formToData(f) {
  return {
    date: f.date, startTime: f.startTime, endTime: f.endTime, venueName: f.venueName.trim(), status: f.status,
    bandName: f.bandName.trim(), baseFee: parseMoney(f.baseFee), mapsUrl: isHttpUrl(f.mapsUrl) ? f.mapsUrl.trim() : '',
    travelMinutes: parseIntSafe(f.travelMinutes, 30), notes: f.notes, tips: parseMoney(f.tips), isPaid: !!f.isPaid,
    issueNote: f.status === 'issue' ? f.issueNote.trim() : '',
    gigType: f.gigType, members: Math.min(Math.max(parseInt(f.members, 10) || 1, 1), 99),
  };
}

/* ---------- ทางลัดค่าตัว: สูงสุด 4 ราคา กรอก/แก้เองได้ (จำไว้ในตั้งค่าบัญชี) ---------- */
function FeePresets({ presets, value, onPick, onChange }) {

  const [draft, setDraft] = useState([]);
  const [focusIdx, setFocusIdx] = useState(0);
  const start = (i) => { setDraft(Array.from({ length: MAX_FEE_PRESETS }, (_, k) => (presets[k] ? String(presets[k]) : ''))); setFocusIdx(i); setEditing(true); };
  const done = () => { onChange(draft.map(parseMoney).filter((v) => v > 0)); setEditing(false); };
  if (editing) {
    return (
      <div className="px-4 pt-2 anim-fade">
        <div className="flex gap-2">
          {draft.map((d, i) => (
            <div key={i} className="flex-1 min-w-0 relative">
              <input autoFocus={i === focusIdx} inputMode="decimal" value={d} placeholder="฿"
                onChange={(e) => { const v = e.target.value.replace(/[^\d.,]/g, ''); setDraft((x) => x.map((y, k) => (k === i ? v : y))); }}
                onKeyDown={(e) => { if (e.key === 'Enter') done(); }}
                aria-label={`ทางลัดค่าตัวช่องที่ ${i + 1}`}
                className="w-full h-9 rounded-full text-center text-[13px] font-semibold tnum bg-white dark:bg-[#2C2C2E] outline-none ring-2 ring-[#5856D6]/40 focus:ring-[#5856D6] placeholder:text-[#C7C7CC]" />
              {d && <button onClick={() => setDraft((x) => x.map((y, k) => (k === i ? '' : y)))} aria-label="ล้างช่องนี้" className="absolute -top-1.5 -right-1 w-5 h-5 rounded-full bg-[#8E8E93] text-white flex items-center justify-center"><Icon name="close" size={13} /></button>}
            </div>
          ))}
        </div>
        <div className="flex justify-end gap-2 mt-2">
          <button onClick={() => setEditing(false)} className="h-8 px-3 rounded-full text-[13px] font-semibold text-[#8E8E93]">ยกเลิก</button>
          <button onClick={done} className="h-8 px-4 rounded-full bg-[#5856D6] text-white text-[13px] font-semibold">บันทึกทางลัด</button>
        </div>
      </div>
    );
  }
  return (
    <div className="flex gap-2 px-4 pt-2 items-center">
      {Array.from({ length: MAX_FEE_PRESETS }, (_, i) => presets[i]).map((v, i) => v ? (
        <button key={i} onClick={() => onPick(v)} className={`flex-1 min-w-0 h-8 rounded-full text-[13px] font-semibold tnum whitespace-nowrap ${parseMoney(value) === v ? 'bg-[#5856D6] text-white' : 'bg-white dark:bg-[#2C2C2E]'}`}>{fmtMoney(v)}</button>
      ) : (
        <button key={i} onClick={() => start(i)} aria-label={`เพิ่มทางลัดค่าตัวช่องที่ ${i + 1}`} className="flex-1 min-w-0 h-8 rounded-full border-2 border-dashed border-[#C7C7CC] dark:border-[#48484A] text-[#8E8E93] text-[12px] font-semibold flex items-center justify-center gap-0.5"><Icon name="add" size={15} />ราคา</button>
      ))}
      <button onClick={() => start(0)} aria-label="แก้ไขทางลัดค่าตัว" className="w-8 h-8 shrink-0 rounded-full bg-[#767680]/[0.12] text-[#5856D6] dark:text-[#A5A3FF] flex items-center justify-center"><Icon name="edit" size={16} /></button>
    </div>
  );
}

function IssueBanners({ issues, multiDates }) {
  if (!issues.conflicts.length && !issues.tight.length) return null;
  const fmtG = (x) => `${x.gig.venueName} (${x.gig.startTime}–${x.gig.endTime}${multiDates ? `, ${fmtDateShort(x.date)}` : ''})`;
  return (
    <div className="px-4 pt-3 space-y-2">
      {issues.conflicts.length > 0 && (
        <div className="rounded-[14px] bg-[#FF3B30] text-white px-3.5 py-3 flex gap-2.5 anim-pop">
          <Icon name="event_busy" fill size={22} />
          <div className="text-[13.5px] leading-snug">
            <div className="font-bold">คิวชน! ทับซ้อนกับงานอื่น {issues.conflicts.length} รายการ</div>
            {issues.conflicts.slice(0, 3).map((x, i) => <div key={i} className="opacity-90">• {fmtG(x)}</div>)}
            {issues.conflicts.length > 3 && <div className="opacity-80">และอีก {issues.conflicts.length - 3} รายการ</div>}
          </div>
        </div>
      )}
      {issues.tight.length > 0 && (
        <div className="rounded-[14px] bg-[#FF9500] text-white px-3.5 py-3 flex gap-2.5 anim-pop">
          <Icon name="directions_car" fill size={22} />
          <div className="text-[13.5px] leading-snug">
            <div className="font-bold">เวลาเก็บของ & เดินทางอาจไม่ทัน</div>
            {issues.tight.slice(0, 3).map((x, i) => (
              <div key={i} className="opacity-95">• {x.dir === 'before' ? 'หลังจบ' : 'ก่อนไป'} {fmtG(x)} เหลือเวลา {fmtDur(x.gap)} (ต้องใช้ {fmtDur(x.need)})</div>
            ))}
          </div>
        </div>
      )}
    </div>
  );
}

function GigSheet({ mode, initial, gigs, presets, bands, settings = DEFAULT_SETTINGS, onUpdateSettings = () => {}, onClose, onSave, onDelete, onDeleteVenue, toast }) {
  const [tab, setTab] = useState(0);
  const [f, setF] = useState(() => initForm(initial));
  const [rec, setRec] = useState({ enabled: false, days: [weekdayOf(initial.date)], weeks: 12 });
  const [focusVenue, setFocusVenue] = useState(false);
  const [applied, setApplied] = useState(null);
  const set = (k, v) => setF((p) => ({ ...p, [k]: v }));
  const isEdit = mode === 'edit';
  const isRetro = !isEdit && isPastDate(f.date);
  // ฟอร์มสะท้อนการปิดจ๊อบอัตโนมัติ; ถ้าผู้ใช้เปลี่ยนเป็นวันอนาคต/เปิดร้านประจำ ให้คืนค่าที่ระบบตั้งให้ (ถ้าผู้ใช้ยังไม่ได้เลือกสถานะเอง)
  const autoClosed = useRef(false);
  useEffect(() => {
    if (isRetro && !rec.enabled) {
      setF((p) => {
        if (p.status === 'pending' || autoClosed.current) { autoClosed.current = true; return { ...p, isPaid: true, status: p.status === 'pending' ? 'confirmed' : p.status }; }
        return { ...p, isPaid: p.status === 'cancelled' ? p.isPaid : true };
      });
    } else if (autoClosed.current) {
      autoClosed.current = false;
      setF((p) => ({ ...p, isPaid: false, status: p.status === 'confirmed' ? 'pending' : p.status }));
    }
  }, [isRetro, rec.enabled]);
  const groupSize = initial.recurringGroupId ? gigs.filter((g) => g.recurringGroupId === initial.recurringGroupId).length : 0;

  const baseValid = isValidDate(f.date) && isValidTime(f.startTime) && isValidTime(f.endTime) && f.venueName.trim().length > 0;
  const issueMissing = f.status === 'issue' && !f.issueNote.trim();      // งานติดปัญหา ต้องระบุว่าติดปัญหาอะไร
  const typeMissing = !GIG_TYPES[f.gigType];                              // ต้องเลือกประเภทงาน
  const valid = baseValid && !issueMissing && !typeMissing;
  const chooseType = (t) => {
    set('gigType', t);
    if (!isEdit) setRec((r) => ({ ...r, enabled: t === 'regular', days: r.days.length ? r.days : (isValidDate(f.date) ? [weekdayOf(f.date)] : r.days) }));
  };
  /* ---------- จำนวนสมาชิก: เติมตามวงที่เคยบันทึกไว้ (จนกว่าผู้ใช้จะแก้เอง) ---------- */
  const membersManual = useRef(isEdit);
  const lastBand = useRef(f.bandName);
  useEffect(() => {
    if (lastBand.current === f.bandName && isEdit) return;
    const changed = lastBand.current !== f.bandName;
    lastBand.current = f.bandName;
    if (changed) membersManual.current = false;
    if (membersManual.current) return;
    const n = settings.bandMembers[f.bandName.trim()];
    if (n) setF((p) => ({ ...p, members: String(n) }));
  }, [f.bandName]);
  const membersN = Math.min(Math.max(parseInt(f.members, 10) || 1, 1), 99);
  const setMembers = (n) => { membersManual.current = true; set('members', String(Math.min(Math.max(n, 1), 99))); };
  const recDates = useMemo(() => (!isEdit && rec.enabled && isValidDate(f.date) ? genRecurringDates(f.date, rec.days, rec.weeks) : []), [isEdit, rec, f.date]);

  /* ---------- งานก่อน/หลังในคืนเดียวกัน (สำหรับคำนวณเวลาเดินทาง ร้าน → ร้าน) ---------- */
  const neighbors = useMemo(() => {
    if (!baseValid || (!isEdit && rec.enabled)) return { prev: null, next: null };
    const [s, e] = gigRange(f);
    let prev = null, next = null;
    gigs.forEach((g) => {
      if (g.id === initial.id || !ACTIVE.has(g.status)) return;
      const [gs, ge] = gigRange(g);
      if (ge <= s && s - ge < 6 * 60 && (!prev || ge > gigRange(prev)[1])) prev = g;
      if (gs >= e && gs - e < 6 * 60 && (!next || gs < gigRange(next)[0])) next = g;
    });
    return { prev, next };
  }, [baseValid, f.date, f.startTime, f.endTime, gigs, isEdit, rec.enabled, initial.id]);

  /* ---------- เวลาเดินทางอัตโนมัติ (Google Routes API): บ้าน/ร้านก่อนหน้า → ร้านนี้ ---------- */
  const [travelInfo, setTravelInfo] = useState(null);     // { state: 'loading'|'ok'|'manual'|'error', text }
  const [nextLeg, setNextLeg] = useState(null);           // { gigId, need, text }
  const manualTravel = useRef(false);
  const runId = useRef(0);
  const travelKey = `${f.venueName.trim()}|${f.mapsUrl.trim()}|${f.date}|${neighbors.prev?.id || 'home'}|${settings.homeMapsUrl}|${settings.packMinutes}`;
  const initialTravelKey = useRef(isEdit ? travelKey : null);
  const calcTravel = useCallback((force) => {
    const id = ++runId.current;
    const venue = f.venueName.trim();
    if (!venue) { setTravelInfo(null); setNextLeg(null); return; }
    const dest = routeTargetFromUrl(f.mapsUrl);
    // เวลาไปร้านถัดไปในคืนเดียวกัน (ร้านนี้ → ร้านถัดไป) ใช้กับแถบเตือนสีส้ม
    const nx = neighbors.next;
    const nxDest = nx ? routeTargetFromUrl(nx.mapsUrl) : null;
    if (dest && nxDest && MAPS_KEY) {
      fetchDriveMinutes(dest, nxDest, gigRange(nx)[0] - 60)
        .then((r) => { if (id === runId.current) setNextLeg({ gigId: nx.id, need: r.minutes + settings.packMinutes, text: `ไป ${nx.venueName} ขับรถ ${r.minutes} นาที + เผื่อเก็บของ ${settings.packMinutes} นาที` }); })
        .catch(() => { if (id === runId.current) setNextLeg(null); });
    } else setNextLeg(null);

    if (!dest) {
      setTravelInfo({ state: 'manual', text: !f.mapsUrl.trim() ? 'ร้านนี้ยังไม่มีลิงก์ Google Maps — กรอกเวลาเดินทางเอง' : isShortMapsLink(f.mapsUrl) ? 'ลิงก์ร้านเป็นลิงก์สั้น (maps.app.goo.gl) คำนวณอัตโนมัติไม่ได้ — กรอกเวลาเอง' : 'ลิงก์ร้านไม่มีพิกัดหรือชื่อสถานที่ — กรอกเวลาเอง' });
      return;
    }
    let origin, from;
    if (neighbors.prev) {
      origin = routeTargetFromUrl(neighbors.prev.mapsUrl); from = neighbors.prev.venueName;
      if (!origin) { setTravelInfo({ state: 'manual', text: `ร้านก่อนหน้า (${from}) ไม่มีพิกัดในลิงก์ — กรอกเวลาเอง` }); return; }
    } else {
      origin = homeTarget(settings); from = 'บ้าน';
      if (!origin) { setTravelInfo({ state: 'manual', text: 'ยังไม่ได้ตั้งตำแหน่งบ้าน — ตั้งได้ที่เมนู ☰ › ตั้งค่าบัญชี' }); return; }
    }
    if (!MAPS_KEY) { setTravelInfo({ state: 'manual', text: routeErrorText({ code: 'no-key' }) }); return; }
    if (!force && manualTravel.current) return;
    setTravelInfo({ state: 'loading', text: `กำลังคำนวณเวลาเดินทางจาก${from}…` });
    const startAbs = baseValid ? gigRange(f)[0] : 0;
    fetchDriveMinutes(origin, dest, startAbs ? startAbs - 60 : 0)
      .then((r) => {
        if (id !== runId.current) return;
        manualTravel.current = false;
        setF((p) => ({ ...p, travelMinutes: String(r.minutes + settings.packMinutes) }));
        setTravelInfo({ state: 'ok', text: `ขับรถจาก${from} ${r.minutes} นาที (${r.km} กม.${r.traffic ? ' · คิดสภาพจราจร' : ''}) + เผื่อเก็บของ ${settings.packMinutes} นาที`, from });
      })
      .catch((e) => { if (id === runId.current) setTravelInfo({ state: 'error', text: routeErrorText(e) }); });
  }, [f.venueName, f.mapsUrl, f.date, f.startTime, f.endTime, neighbors, settings, baseValid]);
  useEffect(() => {
    if (initialTravelKey.current === travelKey) return;          // เปิดแก้ไขงานเดิม: ไม่ทับค่าที่บันทึกไว้ จนกว่าจะเปลี่ยนร้าน/วัน
    initialTravelKey.current = null;
    manualTravel.current = false;
    const t = setTimeout(() => calcTravel(false), 700);
    return () => clearTimeout(t);
  }, [travelKey]);

  const issues = useMemo(() => {
    const data = formToData(f);
    const exclude = new Set(isEdit ? [initial.id] : []);
    const dates = !isEdit && rec.enabled ? recDates : [f.date];
    const needAfter = nextLeg ? { [nextLeg.gigId]: nextLeg.need } : {};
    const res = { conflicts: [], tight: [] };
    dates.forEach((d) => { const r = findIssues({ ...data, date: d }, gigs, exclude, needAfter); res.conflicts.push(...r.conflicts); res.tight.push(...r.tight); });
    return res;
  }, [f, rec, recDates, gigs, isEdit, initial.id, nextLeg]);

  const findPreset = (name) => {
    const n = name.trim().toLowerCase();
    if (!n) return null;
    const k = Object.keys(presets).find((x) => x.toLowerCase() === n);
    return k ? { name: k, ...presets[k] } : null;
  };
  const applyPreset = (p) => {
    setF((prev) => ({
      ...prev, venueName: p.name,
      startTime: isValidTime(p.startTime) ? p.startTime : prev.startTime,
      endTime: isValidTime(p.endTime) ? p.endTime : prev.endTime,
      baseFee: p.baseFee ? String(p.baseFee) : prev.baseFee,
      mapsUrl: p.mapsUrl || prev.mapsUrl,
      travelMinutes: p.travelMinutes !== undefined ? String(p.travelMinutes) : prev.travelMinutes,
      bandName: prev.bandName || p.bandName || '',
    }));
    setApplied(p.name);
    toast(`ดึงค่าจากโปรไฟล์ “${p.name}” แล้ว`, 'auto_awesome');
  };
  const suggestions = useMemo(() => {
    const q = f.venueName.trim().toLowerCase();
    return Object.entries(presets)
      .filter(([k]) => !q || (k.toLowerCase().includes(q) && k.toLowerCase() !== q))
      .sort((a, b) => (b[1].count || 0) - (a[1].count || 0))
      .slice(0, 6).map(([name, v]) => ({ name, ...v }));
  }, [f.venueName, presets]);

  const durationMin = isValidTime(f.startTime) && isValidTime(f.endTime) ? (() => { const [s, e] = gigRange({ date: '2000-01-01', startTime: f.startTime, endTime: f.endTime }); return e - s; })() : 0;
  const overnight = isValidTime(f.startTime) && isValidTime(f.endTime) && toMin(f.endTime) <= toMin(f.startTime);

  const submit = (overrides = {}) => {
    const data = { ...formToData(f), ...overrides };
    if (data.status !== 'issue') data.issueNote = '';
    if (!baseValid) { setTab(0); toast('กรุณากรอกวันที่ เวลา และชื่อร้านให้ครบ', 'error'); return; }
    if (!GIG_TYPES[data.gigType]) { setTab(0); toast('กรุณาเลือกประเภทงาน', 'error'); return; }
    if (data.status === 'issue' && !data.issueNote) { setTab(0); toast('กรุณาระบุว่าติดปัญหาอะไร', 'error'); return; }
    if (!isEdit && rec.enabled && !rec.days.length) { setTab(0); toast('เลือกวันประจำอย่างน้อย 1 วัน', 'error'); return; }
    onSave({ mode, original: initial, data, rec: !isEdit && rec.enabled ? { ...rec, dates: recDates } : null });
  };
  const allBands = [...settings.bands, ...bands.filter((b) => !settings.bands.includes(b))];

  const tabs = [
    { l: 'ลงคิวด่วน', i: 'bolt', done: valid, warn: issueMissing },
    { l: 'ค่าตัว & เดินทาง', i: 'payments', done: parseMoney(f.baseFee) > 0 || !!f.mapsUrl },
    { l: 'ปิดจ๊อบ & ทิป', i: 'task_alt', done: f.isPaid || parseMoney(f.tips) > 0 },
  ];
  const tipPreview = { tips: parseMoney(f.tips), members: membersN };
  const myTip = tipShare(tipPreview), tipRest = tipRemainder(tipPreview);
  const total = addMoney(parseMoney(f.baseFee), myTip);

  return (
    <Sheet onClose={onClose} full>
      {/* nav bar */}
      <div className="pt-4 px-2 flex items-center justify-between shrink-0">
        <button onClick={onClose} className="h-10 px-3 text-[17px] text-[#5856D6] dark:text-[#A5A3FF]">ยกเลิก</button>
        <div className="text-[17px] font-semibold">{isEdit ? 'แก้ไขงาน' : 'เพิ่มคิวงาน'}</div>
        <button onClick={() => submit()} disabled={!valid} className={`h-10 px-3 text-[17px] font-semibold ${valid ? 'text-[#5856D6] dark:text-[#A5A3FF]' : 'text-[#C7C7CC] dark:text-[#48484A]'}`}>บันทึก</button>
      </div>
      {/* stage tabs */}
      <div className="px-4 pt-2 pb-1 shrink-0">
        <div className="flex p-[2px] rounded-[10px] bg-[#767680]/[0.12] dark:bg-[#767680]/[0.24]">
          {tabs.map((t, i) => (
            <button key={i} onClick={() => setTab(i)} className={`flex-1 h-[38px] rounded-[8px] text-[12.5px] font-semibold flex items-center justify-center gap-1 transition-all ${tab === i ? 'bg-white dark:bg-[#636366] shadow-[0_3px_8px_rgba(0,0,0,0.12)]' : 'text-black/60 dark:text-white/60'}`}>
              <span className={`w-[18px] h-[18px] rounded-full text-[10px] font-bold flex items-center justify-center ${t.warn ? 'bg-[#FF3B30] text-white' : t.done ? 'bg-[#34C759] text-white' : 'bg-black/10 dark:bg-white/15'}`}>{t.warn ? '!' : t.done ? <Icon name="check" size={13} /> : i + 1}</span>
              <span className="truncate">{t.l}</span>
            </button>
          ))}
        </div>
      </div>
      <IssueBanners issues={issues} multiDates={!isEdit && rec.enabled} />

      <div className="flex-1 overflow-y-auto no-scrollbar sheet-pad">
        {tab === 0 && (
          <div className="anim-fade">
            <GroupLabel>ประเภทงาน *</GroupLabel>
            <div className="mx-4 grid grid-cols-3 gap-2">
              {GIG_TYPE_ORDER.map((k) => {
                const t = GIG_TYPES[k], on = f.gigType === k;
                return (
                  <button key={k} onClick={() => chooseType(k)} aria-pressed={on}
                    className={`min-h-[64px] rounded-[12px] px-2 py-2 flex flex-col items-center justify-center gap-1 text-[13px] font-semibold leading-tight text-center border-2 transition-all ${on ? 'bg-white dark:bg-[#2C2C2E]' : 'bg-white/60 dark:bg-[#2C2C2E]/50 border-transparent text-black/60 dark:text-white/60'}`}
                    style={on ? { borderColor: t.color } : {}}>
                    <Icon name={t.icon} fill={on} size={22} style={{ color: t.color }} />{t.label}
                  </button>
                );
              })}
            </div>
            {typeMissing && <div className="px-5 pt-1.5 text-[12px] st-issue">เลือกประเภทงานก่อนบันทึก</div>}

            <GroupLabel>วันเวลา *</GroupLabel>
            <div className="mx-4 rounded-[12px] bg-white dark:bg-[#2C2C2E] overflow-hidden">
              <Row label="วันที่เล่น" icon="calendar_today" iconBg="#FF3B30"><input type="date" value={f.date} onChange={(e) => set('date', e.target.value)} className={inputCls} /></Row>
              <Sep />
              <Row label="เวลาเริ่ม" icon="play_arrow" iconBg="#34C759"><input type="time" value={f.startTime} onChange={(e) => set('startTime', e.target.value)} className={inputCls} /></Row>
              <Sep />
              <Row label="เวลาเลิก" icon="stop" iconBg="#FF9500"><input type="time" value={f.endTime} onChange={(e) => set('endTime', e.target.value)} className={inputCls} /></Row>
              {durationMin > 0 && (
                <div className="px-4 pb-2.5 pt-0.5 text-[12.5px] text-[#8E8E93] flex items-center gap-1 justify-end">
                  {overnight && <span className="font-semibold text-[#5856D6] dark:text-[#A5A3FF] flex items-center gap-0.5"><Icon name="bedtime" size={14} />ข้ามเที่ยงคืน → จบ {isValidDate(f.date) ? fmtDateShort(addDays(f.date, 1)) : 'วันถัดไป'} ·</span>}
                  เล่น {fmtDur(durationMin)}
                </div>
              )}
            </div>
            {isRetro && (
              <div className="mx-4 mt-2 rounded-[12px] bg-[#34C759]/12 px-3.5 py-2.5 text-[13px] st-confirmed flex items-start gap-2 anim-fade" style={{ background: 'rgba(52,199,89,0.12)' }}>
                <Icon name="task_alt" size={18} fill />
                <span>งานย้อนหลัง — จะบันทึกเป็น <b>ปิดจ๊อบเรียบร้อย</b> (คอนเฟิร์ม + รับเงินแล้ว) อัตโนมัติ{rec.enabled ? ' เฉพาะวันที่ผ่านมาแล้วในชุดนี้' : ''}</span>
              </div>

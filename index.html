                <Sep />
                <DrawerRow icon="logout" color="#8E8E93" label="ออกจากระบบ" onClick={onSignOut} right={null} />
                <Sep />
                <DrawerRow icon="delete_forever" color="#FF3B30" label="ลบบัญชีและข้อมูลถาวร" sub="ลบข้อมูลใน Drive + ยกเลิกสิทธิ์ของแอป" destructive onClick={onDeleteAccount} right={null} />
              </>
            ) : (
              <div className="px-4 py-3 text-[13px] text-[#8E8E93] leading-snug">ยังไม่ได้ใส่ Google Client ID จึงยังไม่มีระบบล็อกอิน — ดูวิธีตั้งค่าใน SETUP-GOOGLE.md</div>
            )}
          </div>

          <div className="mt-6 px-5 text-center">
            <div className="text-[13px] font-semibold">GigFlow v{APP_VERSION}</div>
            <div className="text-[12px] text-[#8E8E93]">อัปเดตล่าสุด {fmtBuildDate(APP_BUILD_DATE)}</div>
            <button onClick={checkNow} disabled={update.checking} className="mt-2 h-8 px-3.5 rounded-full bg-[#767680]/[0.12] text-[13px] font-semibold text-[#5856D6] dark:text-[#A5A3FF] inline-flex items-center gap-1 disabled:opacity-60">
              <Icon name={update.checking ? 'progress_activity' : 'refresh'} size={16} className={update.checking ? 'animate-spin' : ''} />{update.checking ? 'กำลังตรวจสอบ…' : 'ตรวจสอบอัปเดต'}
            </button>
          </div>
        </div>
      </aside>
    </div>
  );
}

/* =====================================================================
   APP
   ===================================================================== */
function applyScope(gigs, original, updated, scope) {
  const gid = original.recurringGroupId;
  if (scope === 'this' || !gid) return gigs.map((g) => (g.id === original.id ? updated : g));
  const patch = {};
  SERIES_FIELDS.forEach((k) => { if (updated[k] !== original[k]) patch[k] = updated[k]; });
  const ts = Date.now();
  if (scope === 'following') {
    // แยกชุดใหม่ตั้งแต่วันนี้ไป — งานที่ผ่านมาแล้ว (ก่อนวันนี้) ไม่ถูกแตะเลย ประวัติ/ยอดเงินคงเดิม
    const newGid = uid();
    return gigs.map((g) => {
      if (g.id === original.id) return { ...updated, recurringGroupId: newGid };
      if (g.recurringGroupId === gid && g.date >= original.date) return { ...g, ...patch, recurringGroupId: newGid, updatedAt: ts };
      return g;
    });
  }
  return gigs.map((g) => (g.id === original.id ? updated : g.recurringGroupId === gid ? { ...g, ...patch, updatedAt: ts } : g));
}

function App({ user = null, onSignedOut = () => {} }) {
  const cloud = !!user;
  // โหมดล็อกอิน: เปิดจากแคชในเครื่องของบัญชีนี้ทันที แล้วซิงก์กับ Google Drive
  const [acct] = useState(() => (cloud ? loadAccount(user.uid) : null));
  const [gigs, setGigs] = useState(() => (cloud ? acct.gigs : loadGigs()));
  const [venues, setVenues] = useState(() => (cloud ? acct.venues : loadVenues()));
  const [settings, setSettings] = useState(() => (cloud ? acct.settings : loadSettings()));
  const [tab, setTab] = useState('home');
  const [theme, setTheme] = useTheme();
  const [sheet, setSheet] = useState(null);
  const [batchOpen, setBatchOpen] = useState(false);
  const [action, setAction] = useState(null);
  const [toastState, setToastState] = useState(null);
  const [drawerOpen, setDrawerOpen] = useState(false);
  const [settingsOpen, setSettingsOpen] = useState(false);
  const [installOpen, setInstallOpen] = useState(false);
  const now = useNow();
  const toastTimer = useRef(null);
  const update = useUpdateCheck();
  const install = useInstall();

  // โหมดเครื่องเดียวเก็บลง localStorage — โหมดล็อกอินเก็บแคชแยกตามบัญชี (useDriveSync) แล้วซิงก์ขึ้น Google Drive
  useEffect(() => { if (!cloud) try { localStorage.setItem(KEY_GIGS, JSON.stringify(gigs)); } catch (e) {} }, [gigs]);
  useEffect(() => { if (!cloud) try { localStorage.setItem(KEY_VENUES, JSON.stringify(venues)); } catch (e) {} }, [venues]);
  useEffect(() => { if (!cloud) try { localStorage.setItem(KEY_SETTINGS, JSON.stringify(settings)); } catch (e) {} }, [settings]);
  useEffect(() => { window.scrollTo(0, 0); }, [tab]);

  const toast = useCallback((msg, icon) => {
    clearTimeout(toastTimer.current);
    setToastState({ msg, icon, id: uid() });
    toastTimer.current = setTimeout(() => setToastState(null), 2400);
  }, []);

  const sync = useDriveSync(user, acct && acct.meta, gigs, setGigs, venues, setVenues, settings, setSettings, toast);
  const syncTap = () => sync.syncNow(true);
  const issueCount = gigs.filter((g) => needsIssueCheck(g, now)).length;

  // ย้ายข้อมูลเก่าจากโหมดเครื่องเดียว (ก่อนมีระบบล็อกอิน) ขึ้นบัญชี — ถามครั้งเดียวต่อบัญชี
  useEffect(() => {
    if (!cloud || !sync.ready) return;
    const flag = `gigflow.migrated.${user.uid}`;
    try { if (localStorage.getItem(flag)) return; } catch (e) { return; }
    const legacy = loadGigs();
    if (!legacy.length) return;
    const legacyVenues = loadVenues();
    const done = () => { try { localStorage.setItem(flag, '1'); } catch (e) {} };
    const clearLegacy = () => { try { localStorage.removeItem(KEY_GIGS); localStorage.removeItem(KEY_VENUES); } catch (e) {} };
    setAction({
      title: `พบข้อมูลเดิมในเครื่องนี้ ${legacy.length} งาน`,
      message: `ข้อมูลนี้บันทึกไว้ก่อนมีระบบล็อกอิน ต้องการย้ายขึ้นบัญชี ${user.email || ''} หรือไม่?`,
      actions: [
        { label: 'ย้ายขึ้นบัญชีนี้', bold: true, onClick: () => {
          setGigs((p) => { const m = new Map(p.map((g) => [g.id, g])); legacy.forEach((g) => { if (!m.has(g.id)) m.set(g.id, g); }); return [...m.values()]; });
          setVenues((v) => ({ ...legacyVenues, ...v }));
          clearLegacy(); done();
          toast(`ย้าย ${legacy.length} งานขึ้นบัญชีแล้ว`, 'cloud_upload');
        } },
        { label: 'ลบข้อมูลในเครื่องทิ้ง', destructive: true, onClick: () => { clearLegacy(); done(); } },
      ],
      onCancel: done,
    });
  }, [sync.ready]);

  /** ออกจากระบบ: ล้างข้อมูลของบัญชีนี้ออกจากเครื่อง (ข้อมูลยังอยู่ใน Google Drive) */
  const signOutNow = () => { clearAccountCache(user.uid); clearToken(); onSignedOut(); };
  const askSignOut = () => {
    const pending = sync.dirty;
    setAction({
      title: user?.email,
      message: pending
        ? 'มีการแก้ไขที่ยังไม่ได้ซิงก์ขึ้น Google Drive — ถ้าออกจากระบบตอนนี้ การแก้ไขนั้นจะหายไป'
        : 'ข้อมูลเก็บอยู่ใน Google Drive ของคุณ ล็อกอินใหม่เมื่อไหร่ก็กลับมาเหมือนเดิม (ข้อมูลที่แคชไว้ในเครื่องนี้จะถูกล้าง)',
      actions: pending
        ? [
          { label: 'ซิงก์แล้วออกจากระบบ', bold: true, onClick: async () => { await sync.syncNow(true); if (!sync.meta.current.dirty) signOutNow(); else toast('ซิงก์ไม่สำเร็จ — ยังไม่ได้ออกจากระบบ', 'error'); } },
          { label: 'ออกโดยไม่ซิงก์', destructive: true, onClick: signOutNow },
        ]
        : [{ label: 'ออกจากระบบ', destructive: true, onClick: signOutNow }],
    });
  };

  const presets = useMemo(() => {
    const p = {};
    [...gigs].sort((a, b) => (a.updatedAt - b.updatedAt) || cmpGig(a, b)).forEach((g) => {
      p[g.venueName] = { startTime: g.startTime, endTime: g.endTime, baseFee: g.baseFee, mapsUrl: g.mapsUrl, travelMinutes: g.travelMinutes, bandName: g.bandName, count: (p[g.venueName]?.count || 0) + 1 };
    });
    Object.entries(venues).forEach(([k, v]) => {
      if (v && v.deleted) { delete p[k]; return; }   // ร้านที่ผู้ใช้ลบออกจากรายการ (คิวงานเดิมยังอยู่ครบ)
      p[k] = { ...(p[k] || {}), ...v, count: p[k]?.count || 0 };
    });
    return p;
  }, [gigs, venues]);
  const [venueSheetOpen, setVenueSheetOpen] = useState(false);
  const askDeleteVenue = (name) => setAction({
    title: `ลบ “${name}” ออกจากร้านที่บันทึกไว้?`,
    message: 'ร้านนี้จะไม่ขึ้นในรายการแนะนำและจะไม่เติมค่าตัว/เวลา/แผนที่ให้อัตโนมัติอีก คิวงานเดิมของร้านนี้ไม่ถูกลบ (ถ้าบันทึกงานที่ร้านนี้อีกครั้ง ร้านจะกลับมาในรายการเอง)',
    actions: [{ label: 'ลบร้านนี้', destructive: true, onClick: () => {
      setVenues((v) => ({ ...v, [name]: { deleted: true, deletedAt: Date.now() } }));
      toast(`ลบ “${name}” ออกจากรายการแล้ว`, 'delete');
    } }],
  });
  const bands = useMemo(() => {
    const c = {};
    gigs.forEach((g) => { if (g.bandName) c[g.bandName] = (c[g.bandName] || 0) + 1; });
    return Object.keys(c).sort((a, b) => c[b] - c[a]);
  }, [gigs]);

  const profiles = useMemo(() => Object.fromEntries(Object.keys(presets).map((n) => [n, venueProfile(venues, gigs, n)])), [presets, venues, gigs]);
  const [detailId, setDetailId] = useState(null);
  const [closeJobId, setCloseJobId] = useState(null);
  const [venueEdit, setVenueEdit] = useState(null);
  const [renewInfo, setRenewInfo] = useState(null);

  /** จำจำนวนสมาชิกตามวง */
  const rememberBandMembers = (list) => {
    const upd = {};
    list.forEach((g) => { const b = (g.bandName || '').trim(); const n = parseInt(g.members, 10); if (b && n >= 1) upd[b] = n; });
    if (!Object.keys(upd).length) return;
    setSettings((st) => (Object.entries(upd).every(([b, n]) => st.bandMembers[b] === n) ? st : { ...st, bandMembers: { ...st.bandMembers, ...upd } }));
  };
  /** จำร้าน: ค่าเริ่มต้นแต่ละประเภท = ครั้งแรกที่กรอก (ไม่ทับ), โลเคชั่น/โน้ตร้านใช้ร่วมกัน */
  const rememberVenue = (d, venueNote) => {
    if (!d.venueName) return;
    const prof = profiles[d.venueName];
    setVenues((v) => {
      const cur = v[d.venueName] && !v[d.venueName].deleted ? v[d.venueName] : {};
      const defaults = { ...(cur.defaults || {}) };
      if (d.gigType && !defaults[d.gigType] && !(prof && prof.byType[d.gigType])) {
        defaults[d.gigType] = { startTime: d.startTime, duration: durBetween(d.startTime, d.endTime), baseFee: d.baseFee, bandName: d.bandName, members: d.members };
      }
      return { ...v, [d.venueName]: { ...cur, mapsUrl: cur.mapsUrl || (prof && prof.mapsUrl) || d.mapsUrl || '', note: venueNote !== undefined ? venueNote : (cur.note || (prof && prof.note) || ''), defaults, updatedAt: Date.now() } };
    });
  };

  const openCreate = (date) => setSheet({ mode: 'create', key: uid(), gig: { date: isValidDate(date) ? date : todayStr(), startTime: '21:00', endTime: endTimeFrom('21:00', DEFAULT_DURATION), venueName: '', status: '', bandName: settings.bands[0] || '', members: settings.bandMembers[settings.bands[0]] || 1, gigType: '', issueNote: '', baseFee: 0, mapsUrl: '', travelMinutes: 30, notes: '', tips: 0, isPaid: false, recurringGroupId: null } });
  const openEdit = (g) => setSheet({ mode: 'edit', key: g.id, gig: g });
  const openDetail = (g) => setDetailId(g.id);
  const openCopy = (g) => setSheet({ mode: 'copy', key: uid(), gig: { ...g, id: undefined, date: '', tips: 0, isPaid: false, jobClosed: false, recurringGroupId: null, status: g.status === 'cancelled' ? (g.preCancelStatus || 'confirmed') : g.status } });

  const askScope = (original, kind, onPick) => {
    const gid = original.recurringGroupId;
    const group = gigs.filter((g) => g.recurringGroupId === gid);
    const following = group.filter((g) => g.date >= original.date).length;
    const past = group.length - following;
    const destructive = kind !== 'edit';
    setAction({
      title: kind === 'cancel' ? 'แคนเซิลงานร้านประจำ' : kind === 'delete' ? 'ลบงานร้านประจำ' : 'แก้ไขงานร้านประจำ',
      message: `“${original.venueName}” อยู่ในชุดร้านประจำ ${group.length} งาน ต้องการให้มีผลกับงานใด?${past ? ` (มีงานที่ผ่านมาแล้ว ${past} งาน)` : ''}`,
      actions: [
        { label: 'เฉพาะวันนี้วันเดียว', destructive, onClick: () => onPick('this') },
        { label: `ตั้งแต่วันนี้เป็นต้นไป (${following} งาน)`, destructive, onClick: () => onPick('following') },
        { label: `ทั้งหมดทุกสัปดาห์ (${group.length} งาน)`, destructive, onClick: () => onPick('all') },
      ],
    });
  };

  /* ---------- บันทึกตั้งค่า + แมพของร้าน (อัปเดตงานที่ยังไม่ถึง และคำนวณเวลาเดินทางใหม่) ---------- */
  const recalcTravel = async (allGigs, ids, st) => {
    if (!MAPS_KEY || !ids.length) return { done: 0, failed: 0, skipped: ids.length };
    const ref = homeLatLng(st);
    const byId = new Map(allGigs.map((g) => [g.id, g]));
    const upd = {};
    let failed = 0;
    for (const id of ids.slice(0, 60)) {
      const g = byId.get(id);
      const dest = routeTargetFromUrl(g.mapsUrl, ref);
      const prev = findPrevGig(g, allGigs);
      const origin = prev ? routeTargetFromUrl(prev.mapsUrl, ref) : homeTarget(st);
      if (!dest || !origin) { failed++; continue; }
      try { const r = await fetchDriveMinutes(origin, dest, gigRange(g)[0] - 60); upd[id] = r.minutes + st.packMinutes; }
      catch (e) { failed++; }
    }
    if (Object.keys(upd).length) {
      const ts = Date.now();
      setGigs((p) => p.map((g) => (upd[g.id] !== undefined ? { ...g, travelMinutes: upd[g.id], updatedAt: ts } : g)));
    }
    return { done: Object.keys(upd).length, failed, skipped: Math.max(0, ids.length - 60) };
  };
  const saveSettings = (newSettings) => { setSettings(newSettings); setSettingsOpen(false); toast('บันทึกการตั้งค่าแล้ว'); };

  /* ---------- แก้ค่าเริ่มต้นของร้าน: ทั้งหมด / เฉพาะวันที่ / ตั้งแต่วันที่ ---------- */
  const applyVenueDefaults = (x) => {
    const run = async () => {
      const ts = Date.now();
      setVenues((v) => {
        const cur = v[x.name] && !v[x.name].deleted ? v[x.name] : {};
        const next = { ...cur, note: x.note, updatedAt: ts };
        if (x.scope !== 'date') {
          if (x.mapChanged) next.mapsUrl = x.mapsUrl;
          if (x.typeChanged) next.defaults = { ...(cur.defaults || {}), [x.type]: { ...x.vals } };
        }
        return { ...v, [x.name]: next };
      });
      const ids = new Set(x.affected.map((g) => g.id));
      const next = gigs.map((g) => {
        if (!ids.has(g.id)) return g;
        let u = { ...g, updatedAt: ts };
        if (x.mapChanged) u.mapsUrl = x.mapsUrl;
        if (x.typeChanged && g.gigType === x.type) {
          u = { ...u, startTime: x.vals.startTime, endTime: endTimeFrom(x.vals.startTime, x.vals.duration), bandName: x.vals.bandName || '', members: x.vals.members || 1 };
          if (isPaidWork(g)) u.baseFee = parseMoney(x.vals.baseFee);
        }
        return u;
      });
      setGigs(next);
      setVenueEdit(null);
      const future = next.filter((g) => ids.has(g.id) && ACTIVE.has(g.status) && gigRange(g)[1] > nowAbs()).map((g) => g.id);
      if ((x.mapChanged || x.typeChanged) && future.length && MAPS_KEY) {
        toast(`บันทึกแล้ว · กำลังคำนวณเวลาเดินทาง ${future.length} งาน…`, 'progress_activity');
        const r = await recalcTravel(next, future, settings);
        toast(`อัปเดต ${ids.size} งาน · คำนวณเวลาเดินทางใหม่ ${r.done} งาน${r.failed ? ` (ไม่สำเร็จ ${r.failed})` : ''}`, r.failed ? 'error' : 'check_circle');
      } else toast(`บันทึกค่าของ “${x.name}” แล้ว${ids.size ? ` · อัปเดต ${ids.size} งาน` : ''}`);
    };
    if (x.past > 0) setAction({ title: `เปลี่ยนงานที่ผ่านมาแล้ว ${x.past} งาน?`, message: `“${x.name}” — รวมทั้งหมด ${x.affected.length} งาน ยอดเงินย้อนหลังของงานเหล่านั้นจะเปลี่ยนตาม`, actions: [{ label: `ยืนยันเปลี่ยน ${x.affected.length} งาน`, destructive: true, onClick: run }] });
    else run();
  };

  /* ---------- งานประจำรายเดือน: ตัดคิวเดิมที่เกินเดือนนี้ (ครั้งเดียว) + ถามต่อสัญญาทุกสิ้นเดือน ---------- */
  const promptedRef = useRef(false);
  const dayKey = todayStr();
  useEffect(() => {
    if (!sync.ready || promptedRef.current || action) return;
    const t = todayStr(), end = monthEndOf(t);
    if (!settings.trimmedRegular) {
      const extra = gigs.filter((g) => g.gigType === 'regular' && g.recurringGroupId && g.date > end);
      if (!extra.length) { setSettings((st) => ({ ...st, trimmedRegular: true })); return; }
      promptedRef.current = true;
      const done = () => { setSettings((st) => ({ ...st, trimmedRegular: true })); promptedRef.current = false; };
      setAction({
        title: `ตัดคิวงานประจำที่ลงไว้เกินเดือนนี้ ${extra.length} งาน?`,
        message: 'ตอนนี้งานประจำลงคิวทีละเดือน แล้วแอปจะถามต่อสัญญาทุกสิ้นเดือน — คิวหลังสิ้นเดือนนี้จะถูกลบ (กู้คืนไม่ได้)',
        actions: [{ label: `ลบ ${extra.length} งาน`, destructive: true, onClick: () => { const ids = new Set(extra.map((g) => g.id)); setGigs((p) => p.filter((g) => !ids.has(g.id))); toast(`ตัดคิวงานประจำ ${extra.length} งานแล้ว`, 'delete'); done(); } }],
        onCancel: done,
      });
      return;
    }
    const target = t === end ? shiftYM(t.slice(0, 7), 1) : t.slice(0, 7);
    if (settings.renewAskedFor === target) return;
    const source = shiftYM(target, -1);
    const has = new Set(gigs.filter((g) => g.gigType === 'regular' && g.date.startsWith(target)).map((g) => g.venueName));
    const byVenue = {};
    gigs.filter((g) => g.gigType === 'regular' && g.status !== 'cancelled' && g.date.startsWith(source) && !has.has(g.venueName)).sort(cmpGig).forEach((g) => {
      const c = byVenue[g.venueName] || (byVenue[g.venueName] = { venueName: g.venueName, template: g, days: [] });
      c.template = g;
      if (!c.days.includes(weekdayOf(g.date))) c.days.push(weekdayOf(g.date));
    });
    const candidates = Object.values(byVenue);
    if (!candidates.length) return;
    promptedRef.current = true;
    setRenewInfo({ target, candidates });
  }, [sync.ready, settings.trimmedRegular, settings.renewAskedFor, dayKey, action]);
  const confirmRenew = (target, chosen) => {
    const first = `${target}-01`, t = todayStr(), start = first < t ? t : first, ts = Date.now();
    const created = [];
    let skipped = 0;
    chosen.forEach((c) => {
      const gid = c.template.recurringGroupId || uid();
      genMonthDates(start, c.days).forEach((d) => {
        const g = { ...c.template, id: uid(), date: d, status: 'confirmed', issueNote: '', preCancelStatus: '', notes: '', tips: 0, isPaid: false, jobClosed: false, recurringGroupId: gid, createdAt: ts, updatedAt: ts };
        if (findIssues(g, [...gigs, ...created]).conflicts.length) { skipped++; return; }
        created.push(g);
      });
    });
    setGigs((p) => [...p, ...created]);
    setSettings((st) => ({ ...st, renewAskedFor: target }));
    setRenewInfo(null); promptedRef.current = false;
    toast(`ลงคิว${ymLabel(target)} ${created.length} งาน${skipped ? ` · ข้ามวันที่ชน ${skipped} วัน` : ''}`, 'event_repeat');
  };
  const skipRenew = () => { setSettings((st) => ({ ...st, renewAskedFor: renewInfo.target })); setRenewInfo(null); promptedRef.current = false; };

  /* ---------- แคนเซิล / กู้คืน / ปิดจ๊อบ (จากหน้ารายละเอียดงาน) ---------- */
  const cancelGig = (g) => {
    const doIt = (scope) => {
      setGigs((p) => applyScope(p, g, { ...g, status: 'cancelled', preCancelStatus: g.status, updatedAt: Date.now() }, scope));
      toast('แคนเซิลงานแล้ว — กู้คืนได้จากหน้ารายละเอียด', 'event_busy');
    };
    const group = g.recurringGroupId ? gigs.filter((x) => x.recurringGroupId === g.recurringGroupId).length : 0;
    if (group > 1) askScope(g, 'cancel', doIt);
    else setAction({ title: 'แคนเซิลงานนี้?', message: `${g.venueName} · ${fmtDateShort(g.date)} — งานจะแสดงแบบขีดฆ่าและไม่นับรายได้ (กู้คืนได้)`, actions: [{ label: 'แคนเซิลงาน', destructive: true, onClick: () => doIt('this') }] });
  };
  const restoreGig = (g) => {
    setGigs((p) => p.map((x) => (x.id === g.id ? { ...x, status: x.preCancelStatus || 'confirmed', preCancelStatus: '', updatedAt: Date.now() } : x)));
    toast('กู้คืนงานแล้ว', 'restore');
  };
  const saveCloseJob = (g, tips, paid) => {
    setGigs((p) => p.map((x) => (x.id === g.id ? { ...x, tips, isPaid: paid, jobClosed: true, updatedAt: Date.now() } : x)));
    setCloseJobId(null);
    toast(`ปิดจ๊อบแล้ว · ได้รับคนละ ${fmtMoney(myIncome({ ...g, tips }))}${paid ? '' : ' (ยังไม่ได้รับค่าตัว)'}`, 'task_alt');
  };

  /** หลังบันทึกงานติดปัญหา: เสนอเพิ่มนัด "เช็คปัญหา" ลง Google Calendar (12:00 น. ของ 2 วันก่อนงาน) */
  const offerIssueCalendar = (g) => {
    if (!FOLLOWUP_DAYS[g.status] || g.date < todayStr()) return;
    const r = issueReminderAbs(g);
    setAction({
      title: g.status === 'pending' ? 'เพิ่มนัดตามคอนเฟิร์มลง Google Calendar?' : 'เพิ่มนัดเช็คปัญหาลง Google Calendar?',
      message: `${g.status === 'pending' ? 'งานรอคอนเฟิร์ม' : `“${g.issueNote}”`} — ให้ปฏิทินเตือน ${fmtDateShort(absToParts(r).date)} ${absToTime(r)} น. เพื่อเช็คอีกครั้งก่อนงาน${g.venueName ? ` ที่ ${g.venueName}` : ''} (${fmtDateShort(g.date)})`,
      actions: [{ label: 'เพิ่มลง Google Calendar', bold: true, onClick: () => openUrl(issueCalendarUrl(g)) }],
    });
  };
  /** ปัญหาเคลียร์แล้ว → เปลี่ยนเป็นคอนเฟิร์ม และลบข้อความปัญหาทิ้ง (เฉพาะงานนั้น) */
  const resolveIssue = (g) => {
    setGigs((p) => p.map((x) => (x.id === g.id ? { ...x, status: 'confirmed', issueNote: '', updatedAt: Date.now() } : x)));
    toast(`${g.venueName}: ${g.status === 'pending' ? 'คอนเฟิร์มแล้ว' : 'ปัญหาเคลียร์แล้ว → คอนเฟิร์ม'}`, 'check_circle');
  };

  const handleSave = ({ mode, original, data, venueNote, dates, skipped = [] }) => {
    const ts = Date.now();
    if (mode === 'create') {
      const gid = data.gigType === 'regular' ? uid() : null;              // งานประจำ = ชุดเดียวกัน (ใช้ต่อสัญญารายเดือน + แก้ 3 ระดับ)
      const created = dates.map((d) => closeRetro({ ...data, id: uid(), date: d, recurringGroupId: gid, tips: 0, isPaid: false, jobClosed: false, createdAt: ts, updatedAt: ts }));
      const retro = created.filter((g) => isPastDate(g.date) && g.status !== 'cancelled').length;
      setGigs((p) => [...p, ...created]);
      rememberVenue(data, venueNote);
      rememberBandMembers([data]);
      setSheet(null);
      toast((created.length > 1 ? `เพิ่มงานประจำ ${created.length} งานแล้ว` : 'เพิ่มคิวงานแล้ว') + (skipped.length ? ` · ข้ามวันที่ชน ${skipped.length} วัน` : '') + (retro ? ` · ปิดจ๊อบย้อนหลัง ${retro} งาน` : ''));
      if (created.length === 1) offerIssueCalendar(created[0]);
      return;
    }
    const updated = { ...original, ...data, updatedAt: ts };
    const groupSize = original.recurringGroupId ? gigs.filter((g) => g.recurringGroupId === original.recurringGroupId).length : 0;
    const seriesChanged = SERIES_FIELDS.some((k) => updated[k] !== original[k]);
    const commit = (scope) => {
      setGigs((p) => applyScope(p, original, updated, scope));
      rememberVenue(updated, venueNote);
      rememberBandMembers([updated]);
      setSheet(null);
      toast(updated.status === 'cancelled' && original.status !== 'cancelled' ? 'แคนเซิลงานแล้ว' : 'บันทึกการแก้ไขแล้ว');
      if (original.status !== updated.status || original.issueNote !== updated.issueNote || original.date !== updated.date) offerIssueCalendar(updated);
    };
    if (groupSize > 1 && seriesChanged) {
      askScope(original, updated.status === 'cancelled' && original.status !== 'cancelled' ? 'cancel' : 'edit', commit);
    } else commit('this');
  };

  const handleDelete = (original) => {
    const gid = original.recurringGroupId;
    const groupSize = gid ? gigs.filter((g) => g.recurringGroupId === gid).length : 0;
    const doDelete = (scope) => {
      setGigs((p) => p.filter((g) => {
        if (g.id === original.id) return false;
        if (!gid || g.recurringGroupId !== gid) return true;
        if (scope === 'all') return false;
        if (scope === 'following') return g.date < original.date;
        return true;
      }));
      setSheet(null);
      setDetailId(null);
      toast('ลบงานแล้ว', 'delete');
    };
    if (groupSize > 1) askScope(original, 'delete', doDelete);
    else setAction({ title: 'ลบงานนี้?', message: `${original.venueName} · ${fmtDateShort(original.date)} — ลบแล้วกู้คืนไม่ได้`, actions: [{ label: 'ลบงาน', destructive: true, onClick: () => doDelete('this') }] });
  };

  const handleLineShare = (cursor) => {
    const t = todayStr();
    const mon = addDays(t, -((weekdayOf(t) + 6) % 7));
    const cy = cursor.y, cm = cursor.m;
    const mFrom = `${cy}-${pad(cm)}-01`, mTo = `${cy}-${pad(cm)}-${pad(daysInMonth(cy, cm))}`;
    const doCopy = async (from, to, label) => {
      const ok = await copyText(buildLineText(gigs, from, to, label));
      toast(ok ? 'คัดลอกแล้ว — วางใน LINE ได้เลย' : 'คัดลอกไม่สำเร็จ', ok ? 'content_paste' : 'error');
    };
    setAction({
      title: 'ก๊อปปี้คิวงานส่ง LINE',
      message: 'เลือกช่วงเวลาที่ต้องการ ข้อความจะถูกคัดลอกลงคลิปบอร์ดทันที',
      actions: [
        { label: 'สัปดาห์นี้', bold: true, onClick: () => doCopy(mon, addDays(mon, 6), 'สัปดาห์นี้') },
        { label: 'สัปดาห์หน้า', onClick: () => doCopy(addDays(mon, 7), addDays(mon, 13), 'สัปดาห์หน้า') },
        { label: `เดือน${monthLabel(cy, cm)}`, onClick: () => doCopy(mFrom, mTo, `เดือน${TH_MONTHS[cm - 1]}`) },
      ],
    });
  };

  const handleBatchSave = (rows) => {
    const ts = Date.now();
    const created = rows.map((r) => {
      const name = r.venueName.trim();
      const k = Object.keys(presets).find((x) => x.toLowerCase() === name.toLowerCase());
      const p = k ? presets[k] : null;
      return normalizeGig({
        id: uid(), date: r.date, startTime: r.startTime, endTime: r.endTime, venueName: k || name, bandName: r.bandName,
        status: 'confirmed', gigType: r.gigType, members: r.members, baseFee: r.baseFee, tips: r.tips, isPaid: false, mapsUrl: p?.mapsUrl || '', travelMinutes: p?.travelMinutes ?? 30,
        notes: '', recurringGroupId: null, createdAt: ts, updatedAt: ts,
      });
    }).filter(Boolean).map(closeRetro);
    setGigs((p) => [...p, ...created]);
    created.forEach((g) => { if (!presets[g.venueName]) rememberVenue(g); });
    rememberBandMembers(created);
    setBatchOpen(false);
    toast(`บันทึกย้อนหลัง ${created.length} งานแล้ว`);
  };

  const handleExport = () => {
    const payload = { app: 'GigFlow', version: 2, appVersion: APP_VERSION, exportedAt: new Date().toISOString(), gigs, venues, settings };
    const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = `gigflow-backup-${todayStr()}.json`;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1500);
    toast('ส่งออกไฟล์สำรองแล้ว', 'download');
  };

  const handleImport = (file) => {
    const reader = new FileReader();
    reader.onload = () => {
      let data;
      try { data = JSON.parse(reader.result); } catch (e) { toast('ไฟล์ไม่ใช่ JSON ที่ถูกต้อง', 'error'); return; }
      const rawGigs = Array.isArray(data) ? data : data?.gigs;
      if (!Array.isArray(rawGigs)) { toast('ไม่พบข้อมูลงานในไฟล์', 'error'); return; }
      const incoming = rawGigs.map(normalizeGig).filter(Boolean);
      const inVenues = data && typeof data.venues === 'object' && !Array.isArray(data.venues) ? data.venues : {};
      const skipped = rawGigs.length - incoming.length;
      setAction({
        title: `พบ ${incoming.length} งานในไฟล์${skipped ? ` (ข้าม ${skipped} รายการที่ไม่ถูกต้อง)` : ''}`,
        message: 'ต้องการนำเข้าแบบใด?',
        actions: [
          { label: 'รวมกับข้อมูลเดิม', bold: true, onClick: () => {
            setGigs((p) => { const m = new Map(p.map((g) => [g.id, g])); incoming.forEach((g) => m.set(g.id, g)); return [...m.values()]; });
            setVenues((v) => ({ ...v, ...inVenues }));
            toast(`นำเข้า ${incoming.length} งานแล้ว`, 'upload');
          } },
          { label: 'แทนที่ข้อมูลทั้งหมด', destructive: true, onClick: () => { setGigs(incoming); setVenues(inVenues); if (data && data.settings) setSettings(normalizeSettings(data.settings)); toast('กู้คืนข้อมูลแล้ว', 'upload'); } },
        ],
      });
    };
    reader.onerror = () => toast('อ่านไฟล์ไม่สำเร็จ', 'error');
    reader.readAsText(file);
  };

  const loadDemo = () => {
    const go = () => { const d = makeDemo(); setGigs(d.gigs); setVenues(d.venues); setSettings((st) => ({ ...st, bandMembers: { ...d.bandMembers, ...st.bandMembers } })); setTab('home'); toast(`โหลดข้อมูลตัวอย่าง ${d.gigs.length} งานแล้ว`, 'science'); };
    if (!gigs.length) return go();
    setAction({ title: 'โหลดข้อมูลตัวอย่าง', message: 'ข้อมูลปัจจุบันทั้งหมดจะถูกแทนที่ (แนะนำให้ Export สำรองก่อน)', actions: [{ label: 'แทนที่ด้วยข้อมูลตัวอย่าง', destructive: true, onClick: go }] });
  };
  const clearAll = () => setAction({ title: 'ล้างข้อมูลทั้งหมด?', message: `งาน ${gigs.length} รายการและโปรไฟล์ร้านทั้งหมดจะถูกลบถาวร${cloud ? ' (รวมถึงในบัญชีบนคลาวด์ทุกเครื่อง)' : ''}`, actions: [{ label: 'ล้างข้อมูลทั้งหมด', destructive: true, onClick: () => { setGigs([]); setVenues({}); toast('ล้างข้อมูลแล้ว', 'delete'); } }] });
  // งานก่อนวันนี้ที่ยังไม่ปิดจ๊อบ (ยังไม่รับเงิน หรือยังรอคอนเฟิร์ม) — ไม่รวมงานที่แคนเซิล
  const isOpenPast = (g) => isPastDate(g.date) && g.status !== 'cancelled' && (!g.isPaid || g.status === 'pending');
  const openPast = gigs.filter(isOpenPast);
  const askClosePast = () => {
    if (!openPast.length) { toast('งานที่ผ่านมาปิดจ๊อบครบแล้ว', 'task_alt'); return; }
    const pend = openPast.filter((g) => g.status === 'pending').length;
    const money = openPast.filter((g) => !g.isPaid).reduce((a, g) => a + toSatang(myIncome(g)), 0) / 100;
    setAction({
      title: `ปิดจ๊อบงานที่ผ่านมา ${openPast.length} งาน?`,
      message: `ทุกงานก่อนวันนี้จะถูกตั้งเป็น “รับเงินแล้ว” (ยอดค้างจ่ายรวม ${fmtMoney(money)})${pend ? ` และงานรอคอนเฟิร์ม ${pend} งานจะเปลี่ยนเป็นคอนเฟิร์ม` : ''} · ไม่แตะงานที่แคนเซิลและงานตั้งแต่วันนี้เป็นต้นไป`,
      actions: [{ label: `ปิดจ๊อบ ${openPast.length} งาน`, bold: true, onClick: () => {
        const ts = Date.now();
        setGigs((p) => p.map((g) => (isOpenPast(g) ? { ...closeRetro(g), updatedAt: ts } : g)));
        toast(`ปิดจ๊อบ ${openPast.length} งานแล้ว`, 'task_alt');
      } }],
    });
  };
  const markPaid = (g) => { setGigs((p) => p.map((x) => (x.id === g.id ? { ...x, isPaid: true, updatedAt: Date.now() } : x))); toast(`รับเงิน ${fmtMoney(myIncome(g))} แล้ว`, 'paid'); };

  /* ---------- ลบบัญชีและข้อมูลถาวร (ยืนยัน 2 ชั้น) ---------- */
  /** ลบข้อมูลทั้งหมดของแอปใน Google Drive + ยกเลิกสิทธิ์ที่ให้ GigFlow (บัญชี Google ไม่ถูกลบ) */
  const doDeleteAccount = async () => {
    const ensure = tokenValid() ? Promise.resolve() : requestGoogleToken({ prompt: '', hint: user.email });   // เรียกทันทีตอนแตะ
    sync.meta.current.disabled = true;           // กันไม่ให้ซิงก์สร้างไฟล์ขึ้นมาใหม่ระหว่างลบ
    try {
      await ensure;
      toast('กำลังลบข้อมูล…', 'progress_activity');
      const files = await Drive.list();
      for (const f of files) await Drive.remove(f.id);
      const tok = gAuth.token;
      try { google.accounts.oauth2.revoke(tok, () => {}); } catch (e) {}
      clearAccountCache(user.uid); clearToken(); onSignedOut();
    } catch (e) {
      sync.meta.current.disabled = false;
      console.error(e);
      toast(e && e.code === 'popup_closed' ? 'ยกเลิก — ไม่มีข้อมูลถูกลบ' : e && e.code === 'offline' ? 'ออฟไลน์อยู่ — เชื่อมต่ออินเทอร์เน็ตแล้วลองใหม่' : 'ลบข้อมูลไม่สำเร็จ กรุณาลองใหม่', 'error');
    }
  };
  const askDeleteAccount = () => setAction({
    title: 'ลบบัญชีและข้อมูลถาวร?',
    message: `ข้อมูล GigFlow ทั้งหมดของ ${user?.email || 'บัญชีนี้'} — คิวงาน ${gigs.length} รายการ ร้านที่บันทึกไว้ และการตั้งค่า — จะถูกลบจาก Google Drive และทุกเครื่อง พร้อมยกเลิกสิทธิ์ที่ให้แอป แล้วออกจากระบบ (บัญชี Google ของคุณไม่ถูกลบ)`,
    actions: [{ label: 'ดำเนินการต่อ…', destructive: true, onClick: () => setAction({
      title: 'ยืนยันครั้งสุดท้าย: ลบถาวร กู้คืนไม่ได้',
      message: 'แนะนำให้ Export สำรองข้อมูลเก็บไว้ก่อน (อาจมีหน้าต่าง Google ให้ยืนยันบัญชีอีกครั้ง)',
      actions: [
        { label: 'Export สำรองข้อมูลก่อน', bold: true, onClick: handleExport },
        { label: 'ลบบัญชีและข้อมูลถาวร', destructive: true, onClick: doDeleteAccount },
      ],
    }) }],
  });

  if (!sync.ready) return <Splash text="กำลังโหลดข้อมูลของคุณ…" />;
  const detailGig = detailId ? gigs.find((g) => g.id === detailId) : null;
  const closeJobGig = closeJobId ? gigs.find((g) => g.id === closeJobId) : null;

  const closeDrawerThen = (fn) => () => { setDrawerOpen(false); fn(); };
  return (
    <MenuCtx.Provider value={{ open: () => setDrawerOpen(true), badge: issueCount, update: update.available }}>
    <div className="min-h-screen">
      <main className="max-w-md mx-auto min-h-screen relative">
        {update.available && (
          <button onClick={applyUpdate} className="sticky top-0 z-30 w-full text-white text-[13px] font-semibold flex items-center justify-center gap-1.5 py-2 bg-[#007AFF]" style={{ paddingTop: 'calc(env(safe-area-inset-top) + 8px)' }}>
            <Icon name="system_update" size={17} />มีอัปเดตใหม่ v{update.latest} — แตะเพื่อโหลด
          </button>
        )}
        {tab === 'home' && <HomeView gigs={gigs} now={now} theme={theme} setTheme={setTheme} onAdd={openCreate} onEdit={openDetail} onDemo={loadDemo} goTab={setTab} user={user} sync={sync} onAccount={() => setDrawerOpen(true)} onResolveIssue={resolveIssue} />}
        {tab === 'schedule' && <ScheduleView gigs={gigs} now={now} theme={theme} setTheme={setTheme} onAdd={openCreate} onEdit={openDetail} onLineShare={handleLineShare} />}
        {tab === 'finance' && <FinanceView gigs={gigs} now={now} theme={theme} setTheme={setTheme} onEdit={openDetail} onMarkPaid={markPaid} onBatch={() => setBatchOpen(true)} onExport={handleExport} onImport={handleImport} onDemo={loadDemo} onClear={clearAll} user={user} openPastCount={openPast.length} onClosePast={askClosePast} />}
      </main>
      <TabBar tab={tab} setTab={setTab} onAdd={() => openCreate()} />
      {drawerOpen && (
        <Drawer onClose={() => setDrawerOpen(false)} user={user} sync={sync} issueCount={issueCount} venueCount={Object.keys(presets).length} settings={settings} install={install} update={update} toast={toast}
          onSettings={closeDrawerThen(() => setSettingsOpen(true))}
          onVenues={closeDrawerThen(() => setVenueSheetOpen(true))}
          onInstall={closeDrawerThen(() => setInstallOpen(true))}
          onIssues={closeDrawerThen(() => { setTab('home'); setTimeout(() => document.getElementById('issue-alerts')?.scrollIntoView({ behavior: 'smooth', block: 'center' }), 80); })}
          onSignOut={closeDrawerThen(askSignOut)}
          onDeleteAccount={closeDrawerThen(askDeleteAccount)} />
      )}
      {settingsOpen && <SettingsSheet settings={settings} presets={presets} profiles={profiles} onEditVenue={setVenueEdit} onClose={() => setSettingsOpen(false)} onSave={saveSettings} />}
      {installOpen && <InstallSheet install={install} onClose={() => setInstallOpen(false)} />}
      {detailGig && <GigDetail gig={detailGig} profile={profiles[detailGig.venueName]} now={now} onClose={() => setDetailId(null)} onEdit={() => openEdit(detailGig)} onCopy={() => openCopy(detailGig)} onCloseJob={(g) => setCloseJobId(g.id)} onCancel={cancelGig} onRestore={restoreGig} onResolve={resolveIssue} />}
      {sheet && <GigForm key={sheet.key} mode={sheet.mode} initial={sheet.gig} gigs={gigs} profiles={profiles} bands={bands} settings={settings} onUpdateSettings={(patch) => setSettings((st) => normalizeSettings({ ...st, ...patch }))} onClose={() => setSheet(null)} onSave={handleSave} onDelete={handleDelete} toast={toast} />}
      {closeJobGig && <CloseJobSheet gig={closeJobGig} onClose={() => setCloseJobId(null)} onSave={saveCloseJob} />}
      {venueEdit && profiles[venueEdit] && <VenueDefaultsSheet profile={profiles[venueEdit]} gigs={gigs} settings={settings} onClose={() => setVenueEdit(null)} onApply={applyVenueDefaults} />}
      {renewInfo && <RenewSheet target={renewInfo.target} candidates={renewInfo.candidates} onConfirm={confirmRenew} onSkip={skipRenew} />}
      {venueSheetOpen && <VenueSheet presets={presets} onClose={() => setVenueSheetOpen(false)} onDelete={askDeleteVenue} />}
      {batchOpen && <BatchSheet gigs={gigs} presets={presets} bands={bands} mainBands={settings.bands} bandMembers={settings.bandMembers} onClose={() => setBatchOpen(false)} onSave={handleBatchSave} />}
      <ActionSheet config={action} onClose={() => setAction(null)} />
      <Toast toast={toastState} />
    </div>
    </MenuCtx.Provider>
  );
}

// expose pure logic for self-tests in the console: window.GigFlowLogic
window.GigFlowLogic = { findPlusCode, olcDecode, olcEncodePairs, olcRecoverNearest, resolveMapRef, mapRefStatus, isMapRef, mergeSyncData, gigRange, findIssues, genRecurringDates, applyScope, computeStats, calendarUrl, mapsDirUrl, buildLineText, makeDemo, sumMoney, parseMoney, parseLatLng, routeTargetFromUrl, issueCalendarUrl, issueReminderAbs, needsIssueCheck, normalizeGig, cmpVer };

/* =====================================================================
   ROOT: ถ้าใส่ Google Client ID แล้ว → ต้องล็อกอินด้วย Google ก่อนใช้งาน (ข้อมูลแยกตามบัญชี เก็บใน Drive ของแต่ละคน)
   ===================================================================== */
function AuthGate() {
  const [account, setAccount] = useState(loadSession);
  const [error, setError] = useState(null);
  if (!account) return <LoginScreen error={error} setError={setError} onSignedIn={(a) => { saveSession(a); setAccount(a); }} />;
  return <App key={account.uid} user={account} onSignedOut={() => { saveSession(null); setAccount(null); }} />;
}
function Root() {
  return CLOUD_CONFIGURED ? <AuthGate /> : <App />;
}

ReactDOM.createRoot(document.getElementById('root')).render(<Root />);
</script>
</body>
</html>

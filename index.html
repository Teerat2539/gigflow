<script>
  /* ===================== เวอร์ชันแอป =====================
     เปลี่ยนเลขนี้ทุกครั้งที่ deploy เวอร์ชันใหม่ — แอปที่เปิดค้างไว้จะเห็นแถบ "มีอัปเดตใหม่" */
  window.GIGFLOW_VERSION = '1.8.0';
  window.GIGFLOW_BUILD_DATE = '2026-11-23';

  /* ===================== Google Maps (Routes API) =====================
     ใช้คำนวณเวลาเดินทาง บ้าน → ร้าน และ ร้าน → ร้าน อัตโนมัติ (ดูวิธีสร้าง key ใน SETUP-GOOGLE.md ข้อ 6)
     เว้นว่างไว้ = ไม่คำนวณอัตโนมัติ (กรอกเวลาเดินทางเอง) */
  window.GIGFLOW_GOOGLE_MAPS_API_KEY = "";

  /* เก็บ event ติดตั้งแอป (Chrome/Android/คอมพิวเตอร์) ไว้ใช้กับปุ่ม "ติดตั้งแอป" ในเมนู */
  window.addEventListener('beforeinstallprompt', function (e) {
    e.preventDefault();
    window.__gigflowInstallPrompt = e;
    window.dispatchEvent(new Event('gigflow-installable'));
  });
  window.addEventListener('appinstalled', function () {
    window.__gigflowInstallPrompt = null;
    window.dispatchEvent(new Event('gigflow-installable'));
  });
  if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
    window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () {}); });
  }
</script>

<script>
  /* ---------- App icon: white guitar pick on Midnight Indigo squircle + green "confirmed" dot ---------- */
  (function () {
    function iconSvg(squircle) {
      var bg = squircle
        ? '<path d="M256 0C56 0 0 56 0 256s56 256 256 256 256-56 256-256S456 0 256 0Z" fill="url(#g)"/>'
        : '<rect width="512" height="512" fill="url(#g)"/>';
      return '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">' +
        '<defs>' +
        '<linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#312E81"/><stop offset="1" stop-color="#1E1B4B"/></linearGradient>' +
        '<linearGradient id="p" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#E0E7FF"/></linearGradient>' +
        '</defs>' + bg +
        '<path d="M256 128c80 0 128 27 128 75 0 72-80 154-128 185-48-31-128-113-128-185 0-48 48-75 128-75Z" fill="url(#p)"/>' +
        '<circle cx="398" cy="114" r="44" fill="#34C759" stroke="#26235E" stroke-width="12"/>' +
        '</svg>';
    }
    window.GIGFLOW_ICON_SVG = iconSvg(true);
    var fav = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(iconSvg(true));
    var full = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(iconSvg(false));
    document.getElementById('favicon').href = fav;
    // iOS ignores SVG apple-touch-icons. On a web server the static icons/apple-touch-icon.png is used;
    // when opened as a local file, rasterise a full-bleed 180x180 PNG at runtime instead.
    if (location.protocol === 'file:') {
      document.getElementById('apple-icon').href = full;
      var img = new Image();
      img.onload = function () {
        try {
          var c = document.createElement('canvas'); c.width = 180; c.height = 180;
          c.getContext('2d').drawImage(img, 0, 0, 180, 180);
          document.getElementById('apple-icon').href = c.toDataURL('image/png');
        } catch (e) {}
      };
      img.src = full;
    }

    // Apply theme before first paint (no flash)
    try {
      var m = localStorage.getItem('gigflow.theme') || 'auto';
      var dark = m === 'dark' || (m === 'auto' && window.matchMedia('(prefers-color-scheme: dark)').matches);
      if (dark) document.documentElement.classList.add('dark');
    } catch (e) {}
  })();
</script>

<script type="text/babel" data-presets="react">
const { useState, useEffect, useMemo, useRef, useCallback } = React;

/* =====================================================================
   CONSTANTS
   ===================================================================== */
const KEY_GIGS = 'gigflow.gigs.v1';
const KEY_VENUES = 'gigflow.venues.v1';
const KEY_THEME = 'gigflow.theme';
const KEY_SETTINGS = 'gigflow.settings.v1';
const APP_VERSION = window.GIGFLOW_VERSION || '0.0.0';
const APP_BUILD_DATE = window.GIGFLOW_BUILD_DATE || '';
const MAPS_KEY = (window.GIGFLOW_GOOGLE_MAPS_API_KEY || '').trim();
const ISSUE_ALERT_DAYS = 2;                         // เตือนงานติดปัญหาเมื่อเหลือ ≤ 2 วัน
const DEFAULT_SETTINGS = { bands: [], homeMapsUrl: '', packMinutes: 15, feePresets: [], bandMembers: {}, renewAskedFor: '', trimmedRegular: false };
const MAX_FEE_PRESETS = 4;
/** ประเภทงาน */
const GIG_TYPES = {
  regular: { label: 'งานประจำ', short: 'ประจำ', icon: 'event_repeat', color: '#007AFF' },
  sub:     { label: 'งานแทน', short: 'แทน', icon: 'swap_horiz', color: '#AF52DE' },
  event:   { label: 'งานจ้างรายครั้ง/อีเว้นท์', short: 'อีเว้นท์', icon: 'celebration', color: '#FF2D55' },
  rehearsal: { label: 'ซ้อม', short: 'ซ้อม', icon: 'piano', color: '#30B0C7' },
};
const GIG_TYPE_ORDER = ['regular', 'sub', 'event', 'rehearsal'];
const NO_MONEY_TYPES = new Set(['rehearsal']);                // ซ้อม: ไม่มีค่าตัว/ทิป ไม่นับรายได้
const isPaidWork = (g) => !NO_MONEY_TYPES.has(g.gigType);
const DEFAULT_DURATION = 90;                                 // ระยะเวลาเล่นเริ่มต้น 1 ชม. 30 นาที
const FOLLOWUP_DAYS = { pending: 1, issue: 2 };              // เตือนตามงาน: รอคอนเฟิร์ม 1 วัน, ติดปัญหา 2 วันก่อนงาน
/** ความหมายของสถานะ (แสดงตอนเลือก) */
const STATUS_HELP = {
  confirmed: 'งานนี้ได้รับการยืนยันแล้ว รายละเอียดครบถ้วนแล้ว',
  pending: 'ดีลไว้แล้ว แต่รอเจ้าของงานคอนเฟิร์ม รายละเอียดอาจเปลี่ยนได้',
  issue: 'รับงานมาแล้ว แต่ตอนนี้ยังทำงานไม่ได้ — ต้องระบุว่าติดปัญหาอะไร',
};

const STATUS = {
  confirmed: { label: 'คอนเฟิร์ม',   color: '#34C759', emoji: '✅', icon: 'check_circle' },
  pending:   { label: 'รอคอนเฟิร์ม', color: '#FFCC00', emoji: '⏳', icon: 'hourglass_top' },
  issue:     { label: 'ติดปัญหา',    color: '#FF9500', emoji: '⚠️', icon: 'error' },
  cancelled: { label: 'แคนเซิล',     color: '#FF3B30', emoji: '❌', icon: 'cancel' },
};
const STATUS_ORDER = ['confirmed', 'pending', 'issue', 'cancelled'];
const ACTIVE = new Set(['confirmed', 'pending', 'issue']);   // ใช้เช็กคิวชน
const INCOME = new Set(['confirmed', 'issue']);              // นับเป็นรายได้ (pending = คาดการณ์, cancelled = ไม่นับ)
const SERIES_FIELDS = ['startTime', 'endTime', 'venueName', 'bandName', 'members', 'gigType', 'status', 'issueNote', 'baseFee', 'mapsUrl', 'travelMinutes', 'notes'];

const TH_DAYS = ['อาทิตย์', 'จันทร์', 'อังคาร', 'พุธ', 'พฤหัสบดี', 'ศุกร์', 'เสาร์'];
const TH_DAYS_SHORT = ['อา.', 'จ.', 'อ.', 'พ.', 'พฤ.', 'ศ.', 'ส.'];
const TH_DAYS_MINI = ['อา', 'จ', 'อ', 'พ', 'พฤ', 'ศ', 'ส'];
const TH_MONTHS = ['มกราคม', 'กุมภาพันธ์', 'มีนาคม', 'เมษายน', 'พฤษภาคม', 'มิถุนายน', 'กรกฎาคม', 'สิงหาคม', 'กันยายน', 'ตุลาคม', 'พฤศจิกายน', 'ธันวาคม'];
const TH_MONTHS_SHORT = ['ม.ค.', 'ก.พ.', 'มี.ค.', 'เม.ย.', 'พ.ค.', 'มิ.ย.', 'ก.ค.', 'ส.ค.', 'ก.ย.', 'ต.ค.', 'พ.ย.', 'ธ.ค.'];

/* =====================================================================
   DATE / TIME HELPERS  (ทุกอย่างคิดเป็น "วันที่ท้องถิ่น" แบบ YYYY-MM-DD → ไม่มีปัญหา timezone/DST)
   ===================================================================== */
const pad = (n) => String(n).padStart(2, '0');
const toDateStr = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const todayStr = () => toDateStr(new Date());
const isValidDate = (s) => typeof s === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(s) && !isNaN(Date.UTC(...s.split('-').map(Number)));
const isValidTime = (s) => typeof s === 'string' && /^([01]\d|2[0-3]):[0-5]\d$/.test(s);
const dayNum = (s) => { const [y, m, d] = s.split('-').map(Number); return Math.round(Date.UTC(y, m - 1, d) / 864e5); };
const fromDayNum = (n) => { const d = new Date(n * 864e5); return `${d.getUTCFullYear()}-${pad(d.getUTCMonth() + 1)}-${pad(d.getUTCDate())}`; };
const addDays = (s, n) => fromDayNum(dayNum(s) + n);
const weekdayOf = (s) => new Date(dayNum(s) * 864e5).getUTCDay();
const toMin = (t) => { const [h, m] = t.split(':').map(Number); return h * 60 + m; };
const isOvernight = (g) => toMin(g.endTime) <= toMin(g.startTime);
/** ช่วงเวลาแบบ "นาทีสัมบูรณ์" — งานข้ามเที่ยงคืนจะนับเวลาเลิกเป็นวันถัดไป แต่ยังเป็นงานของคืนวันที่เริ่มเล่น */
const gigRange = (g) => {
  const base = dayNum(g.date) * 1440;
  const s = base + toMin(g.startTime);
  let e = base + toMin(g.endTime);
  if (e <= s) e += 1440;
  return [s, e];
};
const nowAbs = () => { const d = new Date(); return dayNum(toDateStr(d)) * 1440 + d.getHours() * 60 + d.getMinutes(); };
const absToParts = (abs) => { const day = Math.floor(abs / 1440); const m = abs - day * 1440; return { date: fromDayNum(day), h: Math.floor(m / 60), m: m % 60 }; };
const absToTime = (abs) => { const p = absToParts(abs); return `${pad(p.h)}:${pad(p.m)}`; };
const cmpGig = (a, b) => gigRange(a)[0] - gigRange(b)[0];
const fmtDur = (min) => { min = Math.max(0, Math.round(min)); const h = Math.floor(min / 60), m = min % 60; if (!h) return `${m} นาที`; return m ? `${h} ชม. ${m} นาที` : `${h} ชม.`; };
const fmtDateShort = (s) => { const [, m, d] = s.split('-').map(Number); return `${TH_DAYS_SHORT[weekdayOf(s)]} ${d} ${TH_MONTHS_SHORT[m - 1]}`; };
const fmtDateLong = (s) => { const [y, m, d] = s.split('-').map(Number); return `วัน${TH_DAYS[weekdayOf(s)]}ที่ ${d} ${TH_MONTHS[m - 1]} ${y + 543}`; };
const relDay = (s) => { const diff = dayNum(s) - dayNum(todayStr()); if (diff === 0) return 'วันนี้'; if (diff === 1) return 'พรุ่งนี้'; if (diff === -1) return 'เมื่อวาน'; return fmtDateShort(s); };
const monthLabel = (y, m) => `${TH_MONTHS[m - 1]} ${y + 543}`;
const daysInMonth = (y, m) => new Date(Date.UTC(y, m, 0)).getUTCDate();

/* =====================================================================
   MONEY HELPERS  (รวมเงินด้วยหน่วยสตางค์ที่เป็นจำนวนเต็ม → ไม่มี floating-point error)
   ===================================================================== */
const toSatang = (v) => Math.round((Number(v) || 0) * 100);
const sumMoney = (arr, f) => arr.reduce((acc, x) => acc + toSatang(f(x)), 0) / 100;
const addMoney = (...vals) => vals.reduce((a, v) => a + toSatang(v), 0) / 100;
const subMoney = (a, b) => (toSatang(a) - toSatang(b)) / 100;
const nf = new Intl.NumberFormat('th-TH', { minimumFractionDigits: 0, maximumFractionDigits: 2 });
const fmtMoney = (v) => `฿${nf.format(Number(v) || 0)}`;
const parseMoney = (s) => { const n = parseFloat(String(s ?? '').replace(/[,฿\s]/g, '')); return isFinite(n) && n > 0 ? Math.round(n * 100) / 100 : 0; };
/** ทิปรายคน = ทิปรวม ÷ จำนวนสมาชิก ปัดลงเป็นบาท (คนเดียว = ทิปรวมทั้งหมด) */
const tipShare = (g) => { const m = Math.max(1, parseInt(g.members, 10) || 1); const s = toSatang(g.tips); return m === 1 ? s / 100 : Math.floor(s / (m * 100)); };
/** เศษที่หารไม่ลงตัว */
const tipRemainder = (g) => { const m = Math.max(1, parseInt(g.members, 10) || 1); return m === 1 ? 0 : (toSatang(g.tips) - Math.round(tipShare(g) * 100) * m) / 100; };
/** รายได้ของฉันจากงานนี้ = ค่าตัวของฉัน + ทิปรายคน */
const myIncome = (g) => addMoney(g.baseFee, tipShare(g));
const parseIntSafe = (s, def = 0) => { const n = parseInt(String(s ?? '').replace(/[^\d]/g, ''), 10); return isFinite(n) ? Math.max(0, n) : def; };

/* =====================================================================
   GENERAL HELPERS
   ===================================================================== */
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 9);
/** งานที่กรอกย้อนหลัง (วันที่ก่อนวันนี้) → ปิดจ๊อบอัตโนมัติ: คอนเฟิร์ม + รับเงินแล้ว (ยกเว้นงานที่แคนเซิล) */
const isPastDate = (d) => isValidDate(d) && d < todayStr();
const closeRetro = (g) => (isPastDate(g.date) && g.status !== 'cancelled'
  ? { ...g, isPaid: isPaidWork(g), jobClosed: true, status: g.status === 'pending' ? 'confirmed' : g.status }
  : g);
const isHttpUrl = (u) => /^https?:\/\//i.test((u || '').trim());

function normalizeGig(raw) {
  if (!raw || typeof raw !== 'object') return null;
  const g = {
    id: typeof raw.id === 'string' && raw.id ? raw.id : uid(),
    date: String(raw.date || ''),
    startTime: String(raw.startTime || ''),
    endTime: String(raw.endTime || ''),
    venueName: String(raw.venueName || '').trim(),
    status: STATUS[raw.status] ? raw.status : 'pending',
    issueNote: raw.status === 'issue' || (raw.status === 'cancelled' && raw.preCancelStatus === 'issue') ? String(raw.issueNote || '').trim() : '',
    bandName: String(raw.bandName || '').trim(),
    recurringGroupId: raw.recurringGroupId ? String(raw.recurringGroupId) : null,
    // งานเก่าที่ยังไม่มีประเภท: อยู่ในชุดร้านประจำ = งานประจำ, นอกนั้น = งานจ้างรายครั้ง
    gigType: GIG_TYPES[raw.gigType] ? raw.gigType : (raw.recurringGroupId ? 'regular' : 'event'),
    members: Math.min(Math.max(parseInt(raw.members, 10) || 1, 1), 99),
    baseFee: parseMoney(raw.baseFee),
    mapsUrl: isMapRef(raw.mapsUrl) ? String(raw.mapsUrl).trim() : '',
    travelMinutes: raw.travelMinutes === undefined || raw.travelMinutes === null || raw.travelMinutes === '' ? 30 : parseIntSafe(raw.travelMinutes, 30),
    notes: String(raw.notes || ''),
    tips: parseMoney(raw.tips),
    isPaid: !!raw.isPaid,
    jobClosed: !!raw.jobClosed,                                          // กดปิดจ๊อบแล้ว
    preCancelStatus: STATUS[raw.preCancelStatus] ? raw.preCancelStatus : '', // สถานะก่อนแคนเซิล (ใช้ตอนกู้คืน)
    createdAt: Number(raw.createdAt) || Date.now(),
    updatedAt: Number(raw.updatedAt) || Date.now(),
  };
  if (!isValidDate(g.date) || !isValidTime(g.startTime) || !isValidTime(g.endTime) || !g.venueName) return null;
  return g;
}

function loadJSON(key, fallback) {
  try { const v = JSON.parse(localStorage.getItem(key)); return v ?? fallback; } catch (e) { return fallback; }
}
const loadGigs = () => { const arr = loadJSON(KEY_GIGS, []); return Array.isArray(arr) ? arr.map(normalizeGig).filter(Boolean) : []; };

/* ---------- ตำแหน่งจากลิงก์ Google Maps / พิกัด / Plus Code ---------- */
const isShortMapsLink = (s) => /(^|\/\/)(maps\.app\.goo\.gl|goo\.gl\/maps|g\.co\/kgs)/i.test((s || '').trim());
/** อ่านพิกัดจากลิงก์ Google Maps แบบเต็ม หรือข้อความพิกัด "13.7563, 100.5018" */

/* ---------- Plus Code (Open Location Code) ---------- */
const OLC_ALPHA = '23456789CFGHJMPQRVWX';
const OLC_PAIR_RES = [20, 1, 0.05, 0.0025, 0.000125];
/** หา Plus Code ในข้อความ (รองรับแบบเต็ม "7P52PGXG+XG" และแบบสั้น "PG2C+3V Bangkok") */
function findPlusCode(text) {
  let t = (text || '').trim();
  try { t = decodeURIComponent(t); } catch (e) {}
  const m = t.toUpperCase().match(/(^|[^0-9A-Z])([23456789CFGHJMPQRVWX]{4,8})\+([23456789CFGHJMPQRVWX]{2,7})(?![0-9A-Z])/);
  if (!m || m[2].length % 2) return null;
  const code = `${m[2]}+${m[3]}`;
  const after = t.slice(t.toUpperCase().indexOf(code) + code.length).replace(/^[\s,]+/, '').trim();
  return { code, full: m[2].length === 8, locality: /^https?:/i.test(t) ? '' : after };
}
/** แปลง Plus Code แบบเต็ม → พิกัดกลางช่อง */
function olcDecode(code) {
  const c = code.replace('+', '').toUpperCase();
  let lat = 0, lng = 0, latRes = 0, lngRes = 0;
  for (let i = 0; i < Math.min(c.length, 10); i += 2) {
    const r = OLC_PAIR_RES[i / 2];
    lat += OLC_ALPHA.indexOf(c[i]) * r; lng += OLC_ALPHA.indexOf(c[i + 1]) * r;
    latRes = r; lngRes = r;
  }
  for (let i = 10; i < c.length; i++) {
    latRes /= 5; lngRes /= 4;
    const d = OLC_ALPHA.indexOf(c[i]);
    lat += Math.floor(d / 4) * latRes; lng += (d % 4) * lngRes;
  }
  return { lat: lat - 90 + latRes / 2, lng: lng - 180 + lngRes / 2, res: latRes };
}
/** เข้ารหัสพิกัดเป็น Plus Code (เฉพาะส่วนคู่ 10 ตัว — ใช้หาตัวนำหน้าของรหัสแบบสั้น) */
function olcEncodePairs(lat, lng) {
  let la = Math.min(Math.max(lat, -90), 89.9999999) + 90, ln = ((lng + 180) % 360 + 360) % 360;
  let out = '';
  OLC_PAIR_RES.forEach((r) => {
    const a = Math.floor(la / r + 1e-9), b = Math.floor(ln / r + 1e-9);
    out += OLC_ALPHA[Math.min(a, 19)] + OLC_ALPHA[Math.min(b, 19)];
    la -= a * r; ln -= b * r;
  });
  return out.slice(0, 8) + '+' + out.slice(8);
}
/** แปลง Plus Code แบบสั้น → พิกัด โดยใช้ตำแหน่งอ้างอิงใกล้ ๆ (เช่น บ้าน) */
function olcRecoverNearest(short, ref) {
  const padLen = 8 - short.indexOf('+');
  const resolution = Math.pow(20, 2 - padLen / 2);
  const half = resolution / 2;
  const prefix = olcEncodePairs(ref.lat, ref.lng).replace('+', '').slice(0, padLen);
  const area = olcDecode(prefix + short);
  let { lat, lng } = area;
  if (ref.lat + half < lat && lat - resolution >= -90) lat -= resolution;
  else if (ref.lat - half > lat && lat + resolution <= 90) lat += resolution;
  if (ref.lng + half < lng) lng -= resolution;
  else if (ref.lng - half > lng) lng += resolution;
  return { lat, lng };
}

/**
 * อ่านตำแหน่งจากข้อความแมพ (ลิงก์เต็ม / พิกัด / Plus Code)
 * ref = พิกัดอ้างอิง (บ้าน) ใช้ถอด Plus Code แบบสั้นที่ไม่มีชื่อเมือง

function resolveMapRef(text, ref) {
  const t = (text || '').trim();
  if (!t) return { kind: 'none' };

  const ll = parseLatLng(t);

    if (ref) { const d = olcRecoverNearest(pc.code, ref); return { lat: d.lat, lng: d.lng, kind: 'pluscode' }; }

/** ช่องแมพรับได้: ลิงก์ https, พิกัด, หรือ Plus Code */
const isMapRef = (s) => { const t = (s || '').trim(); return !!t && (isHttpUrl(t) || !!findPlusCode(t) || !!parseLatLng(t)); };

/* =====================================================================
   CONFLICT & TRAVEL BUFFER DETECTOR
   ===================================================================== */
/** needAfter: { [gigId]: นาที } — เวลาเดินทางจริงจากงานนี้ไปงานถัดไป (คำนวณร้าน→ร้านแล้ว) ใช้แทน travelMinutes เดิมของงานนั้น */
function findIssues(cand, gigs, excludeIds = new Set(), needAfter = {}) {
  const res = { conflicts: [], tight: [] };
  if (!cand || cand.status === 'cancelled') return res;
  if (!isValidDate(cand.date) || !isValidTime(cand.startTime) || !isValidTime(cand.endTime)) return res;
  const [s, e] = gigRange(cand);
  for (const g of gigs) {
    if (excludeIds.has(g.id) || !ACTIVE.has(g.status)) continue;
    const [gs, ge] = gigRange(g);
    if (s < ge && gs < e) {
      res.conflicts.push({ gig: g, date: cand.date });
    } else if (ge <= s) {
      const gap = s - ge, need = Number(cand.travelMinutes) || 0;      // งานอื่นจบก่อน → ต้องเดินทางมางานนี้
      if (gap < need) res.tight.push({ gig: g, gap, need, dir: 'before', date: cand.date });
    } else if (e <= gs) {
      const gap = gs - e, need = needAfter[g.id] ?? (Number(g.travelMinutes) || 0);   // งานนี้จบก่อน → ต้องเดินทางไปงานอื่น
      if (gap < need) res.tight.push({ gig: g, gap, need, dir: 'after', date: cand.date });
    }
  }
  return res;
}

/** งานก่อนหน้าในคืนเดียวกัน (จบก่อนงานนี้เริ่ม ไม่เกิน 6 ชม.) — ใช้เป็นจุดออกเดินทาง */
function findPrevGig(g, gigs) {
  const [s] = gigRange(g);
  let prev = null;
  gigs.forEach((x) => {
    if (x.id === g.id || !ACTIVE.has(x.status)) return;
    const [, xe] = gigRange(x);
    if (xe <= s && s - xe < 6 * 60 && (!prev || xe > gigRange(prev)[1])) prev = x;
  });
  return prev;
}

function genRecurringDates(startDate, days, weeks) {
  const set = new Set(days);
  const out = [];
  for (let i = 0; i < weeks * 7; i++) {
    const d = addDays(startDate, i);
    if (set.has(weekdayOf(d))) out.push(d);
  }
  return out;
}

/* ---------- ระยะเวลาเล่น / เวลาเลิก ---------- */
const durBetween = (start, end) => { if (!isValidTime(start) || !isValidTime(end)) return DEFAULT_DURATION; const s = toMin(start), e = toMin(end); return e > s ? e - s : e + 1440 - s; };

function genMonthDates(startDate, days) {

  const end = monthEndOf(startDate), out = [];
  for (let d = startDate; d <= end; d = addDays(d, 1)) if (days.includes(weekdayOf(d))) out.push(d);

/* ---------- ค่าเริ่มต้นของร้าน ----------
   โลเคชั่น + โน้ตร้าน: ใช้ร่วมกันทุกประเภทงาน
   เวลาเริ่ม/ระยะเวลา/ค่าตัว/วง/สมาชิก: แยกตามประเภทงาน = ค่าจากครั้งแรกที่กรอก (แก้ได้ในหน้าตั้งค่า) */
function venueProfile(venues, gigs, name) {
  const v = venues[name] && !venues[name].deleted ? venues[name] : {};
  const list = gigs.filter((g) => g.venueName === name).sort(cmpGig);
  const byType = {};
  GIG_TYPE_ORDER.forEach((t) => {
    if (v.defaults && v.defaults[t]) { byType[t] = v.defaults[t]; return; }
    const first = list.find((g) => g.gigType === t);
    if (first) byType[t] = { startTime: first.startTime, duration: durBetween(first.startTime, first.endTime), baseFee: first.baseFee, bandName: first.bandName, members: first.members };
  });

/* ---------- Google Routes API: เวลาขับรถ ---------- */
const routeCache = new Map();

  const body = { origin, destination, travelMode: 'DRIVE', languageCode: 'th', regionCode: 'TH', routingPreference: future ? 'TRAFFIC_AWARE' : 'TRAFFIC_UNAWARE' };
  if (future) { const p = absToParts(departAbs); const [y, m, d] = p.date.split('-').map(Number); body.departureTime = new Date(y, m - 1, d, p.h, p.m).toISOString(); }
  const res = await fetch('https://routes.googleapis.com/directions/v2:computeRoutes', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'X-Goog-Api-Key': MAPS_KEY, 'X-Goog-FieldMask': 'routes.duration,routes.distanceMeters' },
    body: JSON.stringify(body),
  });
  const json = await res.json().catch(() => ({}));
  if (!res.ok) throw Object.assign(new Error(json?.error?.message || `HTTP ${res.status}`), { code: json?.error?.status || res.status });
  const r = json.routes && json.routes[0];
  if (!r || !r.duration) throw Object.assign(new Error('ไม่พบเส้นทาง'), { code: 'no-route' });
  const out = { minutes: Math.ceil(parseInt(r.duration, 10) / 60), km: Math.round((r.distanceMeters || 0) / 100) / 10, traffic: !!future };
  routeCache.set(key, out);
  return out;
}
function routeErrorText(e) {
  if (e?.code === 'no-key') return 'ยังไม่ได้ใส่ Google Maps API key — กรอกเวลาเองได้';
  if (e?.code === 'no-route') return 'Google หาเส้นทางขับรถไม่เจอ — กรอกเวลาเอง';
  if (e?.code === 'PERMISSION_DENIED' || e?.code === 403) return 'API key ใช้กับ Routes API ไม่ได้ (ตรวจสอบว่าเปิด Routes API และอนุญาตโดเมนนี้)';
  if (e?.code === 'INVALID_ARGUMENT' || e?.code === 400) return `คำนวณไม่ได้: ${e.message}`;
  return 'คำนวณเวลาเดินทางไม่สำเร็จ (ออฟไลน์?) — กรอกเวลาเองได้';
}

/* =====================================================================
   LINE TEXT
   ===================================================================== */
function buildLineText(gigs, from, to, label) {
  const list = gigs.filter((g) => g.date >= from && g.date <= to).sort(cmpGig);
  const [fy, fm, fd] = from.split('-').map(Number);
  const [ty, tm, td] = to.split('-').map(Number);
  const range = fy === ty && fm === tm
    ? `${fd}–${td} ${TH_MONTHS_SHORT[tm - 1]} ${String(ty + 543).slice(2)}`
    : `${fd} ${TH_MONTHS_SHORT[fm - 1]} – ${td} ${TH_MONTHS_SHORT[tm - 1]} ${String(ty + 543).slice(2)}`;
  const L = [`🎸 คิวงาน${label}`, `🗓 ${range}`, '━━━━━━━━━━━━━━'];
  if (!list.length) L.push('', 'ยังไม่มีคิวงานในช่วงนี้ 🙏');
  let cur = null;
  for (const g of list) {
    if (g.date !== cur) { cur = g.date; L.push('', `📅 ${fmtDateShort(g.date)}`); }
    const st = STATUS[g.status];
    L.push(`${st.emoji} ${g.startTime}–${g.endTime}${isOvernight(g) ? ' (ข้ามคืน)' : ''} | ${GIG_TYPES[g.gigType] ? `[${GIG_TYPES[g.gigType].short}] ` : ''}${g.venueName}${g.bandName ? ` (${g.bandName})` : ''}${g.status === 'cancelled' ? ' — ยกเลิก' : g.status === 'pending' ? ' — รอคอนเฟิร์ม' : g.status === 'issue' ? ' — ติดปัญหา' : ''}`);
  }
  const c = (s) => list.filter((g) => g.status === s).length;
  L.push('', '━━━━━━━━━━━━━━');
  L.push(`✅ คอนเฟิร์ม ${c('confirmed')} · ⏳ รอ ${c('pending')} · ⚠️ ติดปัญหา ${c('issue')}${c('cancelled') ? ` · ❌ แคนเซิล ${c('cancelled')}` : ''}`);
  L.push(`รวม ${list.length - c('cancelled')} งาน 🎶`);
  return L.join('\n');
}

/* =====================================================================
   STATS
   ===================================================================== */
function computeStats(list) {
  const today = todayStr();
  const income = list.filter((g) => INCOME.has(g.status) && isPaidWork(g));
  const pending = list.filter((g) => g.status === 'pending' && isPaidWork(g));
  const fee = sumMoney(income, (g) => g.baseFee);
  const tips = sumMoney(income, tipShare);                       // ทิปส่วนของฉัน (ทิปรวม ÷ สมาชิก)
  const total = addMoney(fee, tips);
  const unpaidGigs = income.filter((g) => !g.isPaid && g.date <= today && (g.baseFee > 0 || tipShare(g) > 0));
  const outstanding = unpaidGigs.reduce((a, g) => a + toSatang(myIncome(g)), 0) / 100;
  const forecast = sumMoney(pending, (g) => g.baseFee);
  const minutes = income.reduce((a, g) => { const [s, e] = gigRange(g); return a + (e - s); }, 0);
  const avg = income.length ? Math.round(toSatang(total) / income.length) / 100 : 0;
  return { income, pending, fee, tips, total, unpaidGigs, outstanding, forecast, minutes, avg, cancelled: list.filter((g) => g.status === 'cancelled').length };
}
function breakdown(incomeGigs, keyFn) {
  const map = new Map();
  for (const g of incomeGigs) {
    const k = keyFn(g);
    const cur = map.get(k) || { name: k, count: 0, satang: 0 };
    cur.count += 1; cur.satang += toSatang(myIncome(g));
    map.set(k, cur);
  }
  const totalS = [...map.values()].reduce((a, x) => a + x.satang, 0);
  return [...map.values()].map((x) => ({ ...x, amount: x.satang / 100, pct: totalS ? (x.satang / totalS) * 100 : 0 })).sort((a, b) => b.satang - a.satang || b.count - a.count);
}

function useTheme() {

  const [isDark, setIsDark] = useState(document.documentElement.classList.contains('dark'));
  useEffect(() => {
    const mq = window.matchMedia('(prefers-color-scheme: dark)');
    const apply = () => {
      const dark = mode === 'dark' || (mode === 'auto' && mq.matches);
      document.documentElement.classList.toggle('dark', dark);
      document.getElementById('meta-theme')?.setAttribute('content', dark ? '#000000' : '#F2F2F7');
      setIsDark(dark);
    };
    apply();
    try { localStorage.setItem(KEY_THEME, mode); } catch (e) {}
    mq.addEventListener ? mq.addEventListener('change', apply) : mq.addListener(apply);
    return () => { mq.removeEventListener ? mq.removeEventListener('change', apply) : mq.removeListener(apply); };
  }, [mode]);
  return [mode, setMode, isDark];
}

   GOOGLE SIGN-IN + GOOGLE DRIVE SYNC (ไม่มีฐานข้อมูลกลาง)

   ===================================================================== */
const GOOGLE_CLIENT_ID = (window.GIGFLOW_GOOGLE_CLIENT_ID || '').trim();
const CLOUD_CONFIGURED = !!GOOGLE_CLIENT_ID;
const DRIVE_SCOPE = 'https://www.googleapis.com/auth/drive.appdata';
const AUTH_SCOPES = `openid email profile ${DRIVE_SCOPE}`;
const DATA_FILE = 'gigflow-data.json';
const KEY_SESSION = 'gigflow.session.v1';

const TOMBSTONE_DAYS = 120;

const isStandalone = () => window.navigator.standalone === true || window.matchMedia('(display-mode: standalone)').matches;

/** stringify แบบเรียง key เสมอ — ใช้เทียบข้อมูล */
function stableStr(v) {
  if (Array.isArray(v)) return '[' + v.map(stableStr).join(',') + ']';
  if (v && typeof v === 'object') return '{' + Object.keys(v).sort().filter((k) => v[k] !== undefined).map((k) => JSON.stringify(k) + ':' + stableStr(v[k])).join(',') + '}';
  return JSON.stringify(v ?? null);
}

/* ---------- access token (อายุ ~1 ชม. ไม่เก็บถาวร) ---------- */
const gAuth = { token: null, exp: 0, client: null };
try { const t = JSON.parse(sessionStorage.getItem('gigflow.tok')); if (t && t.e > Date.now()) { gAuth.token = t.t; gAuth.exp = t.e; } } catch (e) {}
const gisReady = () => !!(window.google && window.google.accounts && window.google.accounts.oauth2);
const tokenValid = () => !!gAuth.token && Date.now() < gAuth.exp;
function clearToken() { gAuth.token = null; gAuth.exp = 0; try { sessionStorage.removeItem('gigflow.tok'); } catch (e) {} }

/** ขอ access token จาก Google — ต้องเรียกตอนผู้ใช้แตะปุ่ม (Google เปิดหน้าต่างป๊อปอัป ถ้าเคยอนุญาตแล้วจะปิดเองทันที) */
function requestGoogleToken({ prompt = '', hint } = {}) {
  return new Promise((resolve, reject) => {
    if (!gisReady()) { reject({ code: 'gis-not-loaded' }); return; }
    if (!gAuth.client) gAuth.client = google.accounts.oauth2.initTokenClient({ client_id: GOOGLE_CLIENT_ID, scope: AUTH_SCOPES, callback: () => {} });
    gAuth.client.callback = (resp) => {
      if (resp.error) { reject({ code: resp.error, message: resp.error_description }); return; }
      if (!google.accounts.oauth2.hasGrantedAllScopes(resp, DRIVE_SCOPE)) { reject({ code: 'drive-scope-denied' }); return; }
      gAuth.token = resp.access_token;
      gAuth.exp = Date.now() + (Number(resp.expires_in || 3600) - 120) * 1000;
      try { sessionStorage.setItem('gigflow.tok', JSON.stringify({ t: gAuth.token, e: gAuth.exp })); } catch (e) {}
      resolve(gAuth.token);
    };
    gAuth.client.error_callback = (err) => reject({ code: (err && err.type) || 'popup_failed', message: err && err.message });
    gAuth.client.requestAccessToken(hint ? { prompt, hint } : { prompt });
  });
}
function authErrorText(e) {
  const map = {
    popup_closed: null,
    access_denied: 'ไม่ได้อนุญาตการเข้าถึง — ต้องอนุญาตเพื่อเก็บข้อมูลใน Google Drive ของคุณ',
    'drive-scope-denied': 'ต้องติ๊กอนุญาตให้ GigFlow เก็บข้อมูลของแอปใน Google Drive ด้วย (ช่องสิทธิ์ Drive ในหน้าขออนุญาต)',
    popup_failed_to_open: 'เบราว์เซอร์บล็อกหน้าต่างล็อกอิน — อนุญาตป๊อปอัปสำหรับเว็บนี้แล้วลองใหม่',
    'gis-not-loaded': 'โหลดระบบล็อกอินของ Google ไม่สำเร็จ — ตรวจสอบอินเทอร์เน็ตแล้วลองใหม่',

}

/* ---------- Google APIs ---------- */
async function gapi(url, opts = {}) {
  if (!tokenValid()) throw { code: 'no-token' };
  let res;
  try { res = await fetch(url, { ...opts, headers: { ...(opts.headers || {}), Authorization: `Bearer ${gAuth.token}` } }); }
  catch (e) { throw { code: 'offline' }; }
  if (res.status === 401) { clearToken(); throw { code: 'no-token' }; }
  if (!res.ok) { const j = await res.json().catch(() => ({})); throw { code: res.status, message: (j && j.error && j.error.message) || `HTTP ${res.status}` }; }
  return res;
}
async function fetchGoogleProfile() {
  const j = await (await gapi('https://www.googleapis.com/oauth2/v3/userinfo')).json();
  return { uid: String(j.sub), email: j.email || '', displayName: j.name || '', photoURL: j.picture || '' };
}
const Drive = {
  async list() {
    const q = encodeURIComponent(`name='${DATA_FILE}' and trashed=false`);
    const j = await (await gapi(`https://www.googleapis.com/drive/v3/files?spaces=appDataFolder&q=${q}&fields=files(id,modifiedTime)&orderBy=modifiedTime%20desc&pageSize=10`)).json();
    return j.files || [];
  },
  async read(id) { return (await gapi(`https://www.googleapis.com/drive/v3/files/${id}?alt=media`)).json(); },
  async create(data) {
    const b = 'gigflow-' + uid();
    const body = `--${b}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n${JSON.stringify({ name: DATA_FILE, parents: ['appDataFolder'], mimeType: 'application/json' })}\r\n--${b}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n${JSON.stringify(data)}\r\n--${b}--`;
    return (await gapi('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id', { method: 'POST', headers: { 'Content-Type': `multipart/related; boundary=${b}` }, body })).json();
  },
  async update(id, data) { await gapi(`https://www.googleapis.com/upload/drive/v3/files/${id}?uploadType=media`, { method: 'PATCH', headers: { 'Content-Type': 'application/json; charset=UTF-8' }, body: JSON.stringify(data) }); },
  async remove(id) { await gapi(`https://www.googleapis.com/drive/v3/files/${id}`, { method: 'DELETE' }); },
};

/* ---------- session (จำว่าใครล็อกอินอยู่บนเครื่องนี้) + แคชข้อมูลในเครื่องแยกตามบัญชี ---------- */
const loadSession = () => { const s = loadJSON(KEY_SESSION, null); return s && s.uid ? s : null; };
const saveSession = (u) => { try { if (u) localStorage.setItem(KEY_SESSION, JSON.stringify(u)); else localStorage.removeItem(KEY_SESSION); } catch (e) {} };
function loadAccount(id) {
  const a = loadJSON(acctKey(id), null) || {};
  return {
    gigs: (Array.isArray(a.gigs) ? a.gigs : []).map(normalizeGig).filter(Boolean),
    venues: a.venues && typeof a.venues === 'object' && !Array.isArray(a.venues) ? a.venues : {},
    settings: normalizeSettings(a.settings || DEFAULT_SETTINGS),
    meta: { deleted: a.deleted || {}, base: a.base || { venues: null, settings: null }, dirty: !!a.dirty, lastSyncAt: a.lastSyncAt || 0, fileId: a.fileId || null },
  };
}
const clearAccountCache = (id) => { try { localStorage.removeItem(acctKey(id)); localStorage.removeItem(`gigflow.migrated.${id}`); } catch (e) {} };

/** รวมข้อมูลในเครื่องกับบน Drive (pure function) */
function mergeSyncData(local, remote, base) {
  const cutoff = Date.now() - TOMBSTONE_DAYS * 864e5;
  const deleted = {};
  [(remote && remote.deleted) || {}, local.deleted || {}].forEach((d) => Object.entries(d).forEach(([id, ts]) => { if (ts > cutoff) deleted[id] = Math.max(deleted[id] || 0, ts); }));
  const L = new Map(local.gigs.map((g) => [g.id, g]));
  const R = new Map(((remote && remote.gigs) || []).map(normalizeGig).filter(Boolean).map((g) => [g.id, g]));
  const gigs = [];
  new Set([...L.keys(), ...R.keys()]).forEach((id) => {
    const l = L.get(id), r = R.get(id);
    const pick = !l ? r : !r ? l : ((l.updatedAt || 0) >= (r.updatedAt || 0) ? l : r);
    if (deleted[id] && deleted[id] >= (pick.updatedAt || 0)) return;   // ถูกลบหลังแก้ไขครั้งล่าสุด
    delete deleted[id];                                                // แก้ไขหลังจากถูกลบ → เก็บไว้
    gigs.push(pick);
  });
  const pickObj = (lv, rv, b, combine) => {
    const lc = stableStr(lv) !== b;
    const rc = rv !== undefined && stableStr(rv) !== b;
    if (lc && rc) return combine(lv, rv);
    return rc ? rv : lv;
  };
  // เครื่องนี้ยังไม่เคยซิงก์ (base ว่าง) และบน Drive มีข้อมูลอยู่แล้ว → ใช้ของบน Drive เป็นหลัก แล้วเติมของในเครื่องที่ยังไม่มี
  const firstSync = base.venues == null && base.settings == null && !!remote;
  let venues, settings;
  if (firstSync) {
    venues = { ...(local.venues || {}), ...(remote.venues || {}) };
    const ls = normalizeSettings(local.settings), rs = normalizeSettings(remote.settings);
    settings = normalizeSettings({ ...rs, bandMembers: { ...ls.bandMembers, ...rs.bandMembers } });
  } else {
    venues = pickObj(local.venues || {}, remote ? (remote.venues || {}) : undefined, base.venues, (l, r) => ({ ...r, ...l }));
    settings = normalizeSettings(pickObj(normalizeSettings(local.settings), remote ? normalizeSettings(remote.settings) : undefined, base.settings, (l) => l));
  }
  return { gigs, venues, settings, deleted };
}
const syncComparable = (d) => stableStr({
  gigs: ((d && d.gigs) || []).map(normalizeGig).filter(Boolean).sort((a, b) => (a.id < b.id ? -1 : 1)),
  venues: (d && d.venues) || {}, settings: normalizeSettings(d && d.settings), deleted: (d && d.deleted) || {},
});

/**
 * ซิงก์ข้อมูลของบัญชีกับ Google Drive
 * state: 'local' | 'needs-auth' (ต้องแตะเพื่อยืนยัน Google) | 'saving' | 'synced' | 'offline' | 'error'
 */
function useDriveSync(account, initialMeta, gigs, setGigs, venues, setVenues, settings, setSettings, toast) {
  const cloud = !!account;
  const meta = useRef(initialMeta);
  const [state, setState] = useState(cloud ? (tokenValid() ? 'saving' : 'needs-auth') : 'local');
  const [lastSyncAt, setLastSyncAt] = useState(initialMeta ? initialMeta.lastSyncAt : 0);
  const [dirty, setDirty] = useState(!!(initialMeta && initialMeta.dirty));
  const latest = useRef({ gigs, venues, settings });
  latest.current = { gigs, venues, settings };
  const prevIds = useRef(new Set(gigs.map((g) => g.id)));
  const mounted = useRef(false);
  const applyingRemote = useRef(false);
  const running = useRef(false);
  const again = useRef(false);

  const persist = () => {
    if (!cloud) return;
    const m = meta.current;
    try {
      localStorage.setItem(acctKey(account.uid), JSON.stringify({ ...latest.current, deleted: m.deleted, base: m.base, dirty: m.dirty, lastSyncAt: m.lastSyncAt, fileId: m.fileId }));
    } catch (e) {}
  };
  const markDirty = () => { meta.current.dirty = true; setDirty(true); if (running.current) again.current = true; };

  // ตรวจการแก้ไขในเครื่อง → จำงานที่ถูกลบ + ตั้งสถานะว่ามีการแก้ไขที่ยังไม่ซิงก์
  useEffect(() => {
    if (!cloud) return;
    const ids = new Set(gigs.map((g) => g.id));
    if (mounted.current && !applyingRemote.current) {
      const now = Date.now();
      prevIds.current.forEach((id) => { if (!ids.has(id)) meta.current.deleted[id] = now; });
      ids.forEach((id) => { delete meta.current.deleted[id]; });
      markDirty();
    }
    prevIds.current = ids;
    persist();
  }, [gigs]);
  useEffect(() => {
    if (!cloud) return;
    if (mounted.current && !applyingRemote.current) markDirty();
    persist();
  }, [venues, settings]);
  useEffect(() => { mounted.current = true; applyingRemote.current = false; });

  const syncNow = useCallback(async (interactive = false) => {
    if (!cloud || (meta.current && meta.current.disabled)) return;
    if (!tokenValid()) {
      if (!interactive) { setState('needs-auth'); return; }
      try { await requestGoogleToken({ prompt: '', hint: account.email }); }
      catch (e) { const t = authErrorText(e); if (t) toast(t, 'error'); setState('needs-auth'); return; }
    }
    if (navigator.onLine === false) { setState('offline'); return; }
    if (running.current) { again.current = true; return; }
    running.current = true;
    setState('saving');
    try {
      do {
        again.current = false;
        const m = meta.current;
        let fileId = m.fileId;
        let remote = null;
        if (fileId) {
          try { remote = await Drive.read(fileId); }
          catch (e) { if (e.code === 404) { fileId = null; } else throw e; }
        }
        if (!fileId) { const files = await Drive.list(); if (files[0]) { fileId = files[0].id; remote = await Drive.read(fileId); } }
        const merged = mergeSyncData({ ...latest.current, deleted: m.deleted }, remote, m.base);
        const payload = { app: 'GigFlow', format: 1, appVersion: APP_VERSION, updatedAt: Date.now(), ...merged };
        if (!fileId) fileId = (await Drive.create(payload)).id;
        else if (syncComparable(remote) !== syncComparable(payload)) await Drive.update(fileId, payload);
        if (syncComparable({ ...latest.current, deleted: m.deleted }) !== syncComparable(merged) && !again.current) {
          applyingRemote.current = true;
          setGigs(merged.gigs); setVenues(merged.venues); setSettings(merged.settings);
          prevIds.current = new Set(merged.gigs.map((g) => g.id));
        }
        m.fileId = fileId;
        m.deleted = merged.deleted;
        m.base = { venues: stableStr(merged.venues), settings: stableStr(normalizeSettings(merged.settings)) };
        m.dirty = again.current;
        m.lastSyncAt = Date.now();
        setLastSyncAt(m.lastSyncAt); setDirty(m.dirty);
        persist();
      } while (again.current);
      setState('synced');
    } catch (e) {
      if (e && e.code === 'no-token') setState('needs-auth');
      else if (e && e.code === 'offline') setState('offline');
      else {
        console.error('Drive sync error', e);
        setState('error');
        toast(e && e.code === 403 ? 'Google Drive ไม่อนุญาต — ตรวจสอบว่าเปิด Google Drive API แล้ว' : 'ซิงก์กับ Google Drive ไม่สำเร็จ ลองใหม่อีกครั้ง', 'error');
      }
    } finally { running.current = false; }
  }, [cloud, account && account.uid]);

  // ซิงก์อัตโนมัติ: ตอนเปิดแอป (ถ้ามี token), หลังแก้ไข 1.5 วิ, ตอนกลับมาออนไลน์/กลับมาที่แอป, ทุก 5 นาที
  useEffect(() => { if (cloud && tokenValid()) syncNow(false); }, []);
  useEffect(() => {
    if (!cloud || !dirty || !tokenValid()) return;
    const t = setTimeout(() => syncNow(false), 1500);
    return () => clearTimeout(t);
  }, [gigs, venues, settings, dirty]);
  useEffect(() => {
    if (!cloud) return;
    const kick = () => { if (tokenValid()) syncNow(false); else setState('needs-auth'); };
    const onVis = () => { if (document.visibilityState === 'visible') kick(); };
    window.addEventListener('online', kick);
    document.addEventListener('visibilitychange', onVis);
    const iv = setInterval(() => { if (tokenValid()) syncNow(false); }, 5 * 60 * 1000);
    return () => { window.removeEventListener('online', kick); document.removeEventListener('visibilitychange', onVis); clearInterval(iv); };
  }, [syncNow]);

  return { ready: true, state, lastSyncAt, dirty, syncNow, meta };
}

    { i: 'cloud_off', c: '#FF9500', t: 'ใช้ได้แม้ไม่มีเน็ต', d: 'บันทึกในเครื่องก่อน แล้วซิงก์ขึ้น Drive เมื่อออนไลน์' },

}

/* ---------- Gig row (shared) ---------- */
function GigRow({ gig, onClick, now, showDate = true }) {
  const st = STATUS[gig.status];
  const cancelled = gig.status === 'cancelled';
  const [s, e] = gigRange(gig);
  const live = !cancelled && now >= s && now < e;
  const [, m, d] = gig.date.split('-').map(Number);
  return (
    <button onClick={onClick} className="w-full flex items-center gap-3 px-4 py-3 text-left active:bg-black/[0.04] dark:active:bg-white/[0.06] transition-colors">
      {showDate ? (
        <div className="w-12 shrink-0 text-center rounded-[12px] py-1.5 bg-[#F2F2F7] dark:bg-[#2C2C2E] relative">
          <div className={`text-[11px] font-semibold ${weekdayOf(gig.date) === 0 ? 'text-[#FF3B30]' : 'text-[#8E8E93]'}`}>{TH_DAYS_SHORT[weekdayOf(gig.date)]}</div>
          <div className="text-[20px] font-bold leading-none tnum my-[1px]">{d}</div>
          <div className="text-[10px] text-[#8E8E93]">{TH_MONTHS_SHORT[m - 1]}</div>
          <span className="absolute -top-0.5 -right-0.5 w-3 h-3 rounded-full border-2 border-white dark:border-[#1C1C1E]" style={{ background: st.color }} />
        </div>
      ) : (
        <div className="w-1 self-stretch rounded-full" style={{ background: st.color }} />
      )}
      <div className="flex-1 min-w-0">
        <div className={`flex items-center gap-1.5 text-[16px] font-semibold ${cancelled ? 'line-through decoration-[#FF3B30]/70 text-[#8E8E93]' : ''}`}>
          <span className="truncate">{gig.venueName}</span>
          {gig.recurringGroupId && <Icon name="repeat" size={15} className="text-[#8E8E93] shrink-0" />}
        </div>
        <div className={`text-[13px] text-[#8E8E93] flex items-center gap-1 tnum mt-0.5 ${cancelled ? 'line-through' : ''}`}>
          <span>{gig.startTime}–{gig.endTime}</span>
          {isOvernight(gig) && <span className="inline-flex items-center text-[10px] font-bold px-1 rounded bg-[#5856D6]/15 text-[#5856D6] dark:text-[#A5A3FF]"><Icon name="bedtime" size={11} />+1</span>}
          {GIG_TYPES[gig.gigType] && <span className="text-[10px] font-bold px-1 rounded shrink-0" style={{ color: GIG_TYPES[gig.gigType].color, background: GIG_TYPES[gig.gigType].color + '1F' }}>{GIG_TYPES[gig.gigType].short}</span>}
          {gig.bandName && <span className="truncate">· {gig.bandName}</span>}
        </div>
      </div>
      <div className="text-right shrink-0 flex flex-col items-end gap-1">
        {live ? (
          <span className="text-[11px] font-bold text-white bg-[#FF3B30] rounded-full px-2 py-[2px] flex items-center gap-1"><span className="w-1.5 h-1.5 rounded-full bg-white animate-pulse" />LIVE</span>
        ) : <StatusBadge status={gig.status} small />}
        {(gig.baseFee > 0 || tipShare(gig) > 0) && (
          <div className={`text-[13px] font-semibold tnum flex items-center gap-1 ${cancelled ? 'text-[#8E8E93] line-through' : ''}`}>
            {!cancelled && INCOME.has(gig.status) && gig.date <= todayStr() && <Icon name={gig.isPaid ? 'check_circle' : 'schedule'} size={14} fill className={gig.isPaid ? 'text-[#34C759]' : 'text-[#FF9500]'} />}

/* =====================================================================
   HOME
   ===================================================================== */
function TodayWidget({ gigs, now, onEdit, onAdd, onDemo }) {
  const today = todayStr();
  const yest = addDays(today, -1);
  const active = gigs.filter((g) => g.status !== 'cancelled');
  let day = null;
  if (active.some((g) => g.date === yest && gigRange(g)[1] > now)) day = yest;      // งานกะดึกเมื่อคืนยังเล่นอยู่
  else if (active.some((g) => g.date === today)) day = today;
  else day = active.filter((g) => g.date > today).sort(cmpGig)[0]?.date || null;

  if (!day) {
    return (
      <Card className="mx-4 overflow-hidden">
        <EmptyState icon="music_note" title="ยังไม่มีคิวงานที่จะถึง" text="เพิ่มคิวแรกของคุณ หรือโหลดข้อมูลตัวอย่างเพื่อทดลองใช้">
          <button onClick={() => onAdd()} className="h-11 px-6 rounded-full bg-[#5856D6] text-white font-semibold active:opacity-80">+ เพิ่มคิวงาน</button>
          <button onClick={onDemo} className="h-9 px-4 text-[#5856D6] dark:text-[#A5A3FF] font-semibold text-[15px]">โหลดข้อมูลตัวอย่าง</button>
        </EmptyState>
      </Card>
    );
  }

  const dayGigs = active.filter((g) => g.date === day).sort(cmpGig);
  const isNowDay = day === today || day === yest;
  let focusIdx = 0;
  if (isNowDay) { const i = dayGigs.findIndex((g) => gigRange(g)[1] > now); focusIdx = i === -1 ? dayGigs.length - 1 : i; }
  const focus = dayGigs[focusIdx];
  const [fs, fe] = gigRange(focus);
  const multi = dayGigs.length > 1;

  // Smart routing: วิ่งรอก → นำทางจากร้านก่อนหน้าไปร้านถัดไป
  let legTo = 0;
  if (multi) {
    if (isNowDay) { const nextStart = dayGigs.findIndex((g) => gigRange(g)[0] > now); legTo = nextStart === -1 ? dayGigs.length - 1 : nextStart; }
    legTo = Math.min(Math.max(legTo, 1), dayGigs.length - 1);
  }
  const navUrl = multi ? mapsDirUrl(dayGigs[legTo - 1], dayGigs[legTo]) : mapsPlaceUrl(focus);
  const navLabel = multi ? `${dayGigs[legTo - 1].venueName} → ${dayGigs[legTo].venueName}` : focus.venueName;

  let countdown;
  if (now >= fe) countdown = 'เล่นจบแล้ว';
  else if (now >= fs) countdown = `กำลังเล่น · เหลืออีก ${fmtDur(fe - now)}`;
  else if (fs - now < 24 * 60) countdown = `เริ่มในอีก ${fmtDur(fs - now)}`;
  else countdown = `อีก ${dayNum(day) - dayNum(today)} วัน`;
  const leaveAt = absToTime(fs - (focus.travelMinutes || 0));
  const header = day === today ? 'งานคืนนี้' : day === yest ? 'งานกะดึก (เมื่อคืน)' : `งานถัดไป · ${relDay(day)}`;

  return (
    <div className="mx-4 rounded-[22px] overflow-hidden text-white shadow-[0_10px_30px_-10px_rgba(49,46,129,0.6)]" style={{ background: 'linear-gradient(145deg,#312E81 0%,#1E1B4B 100%)' }}>
      <div className="p-5 pb-4 relative">
        <div className="absolute -right-10 -top-10 w-40 h-40 rounded-full bg-white/[0.06]" />
        <div className="absolute right-6 top-14 w-24 h-24 rounded-full bg-[#34C759]/[0.08]" />
        <div className="flex items-center justify-between relative">
          <div className="flex items-center gap-1.5 text-[13px] font-semibold text-white/70 uppercase tracking-wide">
            <Icon name="graphic_eq" size={18} />{header}
          </div>
          {multi && <span className="text-[11px] font-bold px-2 py-[3px] rounded-full bg-[#FF9500] text-white flex items-center gap-1"><Icon name="directions_run" size={13} />วิ่งรอก {dayGigs.length} งาน</span>}
        </div>
        <button onClick={() => onEdit(focus)} className="block text-left mt-2 relative w-full">
          <div className="text-[26px] font-bold leading-tight tracking-tight truncate">{focus.venueName}</div>
          <div className="flex items-center gap-2 mt-1 text-[15px] text-white/85 tnum flex-wrap">
            <span className="font-semibold">{focus.startTime} – {focus.endTime}</span>
            {isOvernight(focus) && <span className="text-[11px] font-bold px-1.5 py-[1px] rounded bg-white/15 flex items-center gap-0.5"><Icon name="bedtime" size={12} />ข้ามคืน</span>}
            {focus.bandName && <span className="text-white/70">· {focus.bandName}</span>}
          </div>
          <div className="flex items-center gap-2 mt-3 flex-wrap">
            <span className="text-[12px] font-semibold px-2.5 py-[3px] rounded-full flex items-center gap-1" style={{ background: STATUS[focus.status].color + '33', color: focus.status === 'pending' ? '#FFE066' : '#fff' }}>
              <span className="w-1.5 h-1.5 rounded-full" style={{ background: STATUS[focus.status].color }} />{STATUS[focus.status].label}
            </span>
            <span className="text-[12px] text-white/75 flex items-center gap-1"><Icon name="timer" size={14} />{countdown}</span>
            {now < fs && focus.travelMinutes > 0 && <span className="text-[12px] text-white/75 flex items-center gap-1"><Icon name="directions_car" size={14} />ออกก่อน {leaveAt}</span>}
          </div>
        </button>

        {multi && (
          <div className="mt-4 rounded-[14px] bg-white/[0.08] divide-y divide-white/10 relative">
            {dayGigs.map((g, i) => {
              const [gs, ge] = gigRange(g);
              const done = isNowDay && now >= ge;
              return (
                <div key={g.id} className={`flex items-center gap-2.5 px-3 py-2 ${done ? 'opacity-50' : ''}`}>
                  <span className="w-5 h-5 rounded-full text-[11px] font-bold flex items-center justify-center" style={{ background: STATUS[g.status].color, color: g.status === 'pending' ? '#000' : '#fff' }}>{i + 1}</span>
                  <button onClick={() => onEdit(g)} className="flex-1 min-w-0 text-left">
                    <div className="text-[14px] font-semibold truncate">{g.venueName}</div>
                    <div className="text-[12px] text-white/65 tnum">{g.startTime}–{g.endTime}{i > 0 && ` · ห่างจากงานก่อน ${fmtDur(gs - gigRange(dayGigs[i - 1])[1])}`}</div>
                  </button>
                  <button aria-label="นำทางช่วงนี้" onClick={() => openUrl(i === 0 ? mapsPlaceUrl(g) : mapsDirUrl(dayGigs[i - 1], g))} className="w-8 h-8 rounded-full bg-white/10 flex items-center justify-center active:bg-white/20"><Icon name={i === 0 ? 'location_on' : 'alt_route'} size={18} /></button>
                  <button aria-label="ลงปฏิทิน" onClick={() => openUrl(calendarUrl(g))} className="w-8 h-8 rounded-full bg-white/10 flex items-center justify-center active:bg-white/20"><Icon name="calendar_add_on" size={18} /></button>
                </div>
              );
            })}
          </div>
        )}
      </div>
      <div className="grid grid-cols-2 gap-2.5 px-5 pb-5">
        <button onClick={() => openUrl(navUrl)} className="h-[54px] rounded-[16px] bg-white text-[#1E1B4B] font-semibold flex flex-col items-center justify-center leading-tight active:scale-[0.98] transition-transform px-2">
          <span className="flex items-center gap-1.5 text-[15px]"><Icon name={multi ? 'alt_route' : 'near_me'} fill size={20} />{multi ? 'นำทางวิ่งรอก' : 'นำทาง'}</span>
          <span className="text-[11px] font-medium text-[#1E1B4B]/60 truncate max-w-full">{navLabel}</span>
        </button>
        <button onClick={() => openUrl(calendarUrl(focus))} className="h-[54px] rounded-[16px] bg-white/15 text-white font-semibold flex flex-col items-center justify-center leading-tight active:scale-[0.98] transition-transform backdrop-blur">
          <span className="flex items-center gap-1.5 text-[15px]"><Icon name="event" size={20} />ลงปฏิทิน</span>
          <span className="text-[11px] font-medium text-white/60">Google Calendar</span>
        </button>
      </div>
    </div>
  );
}

    <div id="issue-alerts" className="mx-4 mb-4 rounded-[20px] overflow-hidden bg-white dark:bg-[#1C1C1E] border-2 border-[#FF9500] shadow-[0_8px_24px_-12px_rgba(255,149,0,0.6)] anim-pop">

          <div className="text-[16px] font-bold">ต้องตามงาน {list.length} งาน</div>

function HomeView({ gigs, now, theme, setTheme, onAdd, onEdit, onDemo, goTab, user, sync, onAccount, onResolveIssue }) {
  const today = todayStr();
  const upcoming = gigs.filter((g) => g.status !== 'cancelled' && gigRange(g)[1] > now && g.date !== today).sort(cmpGig).slice(0, 6);
  const hour = new Date().getHours();
  const greet = hour < 5 ? 'ดึกแล้ว พักผ่อนบ้างนะ 🌙' : hour < 12 ? 'สวัสดีตอนเช้า ☀️' : hour < 17 ? 'สวัสดีตอนบ่าย 🎵' : 'คืนนี้ร็อกให้สุด 🎸';
  return (
    <div className="page-pad">
      <PageHeader title="GigFlow" subtitle={`${fmtDateLong(today)}`} logo={<AppLogo size={36} />} right={<>
        <ThemeToggle mode={theme} setMode={setTheme} />
        {user && <button onClick={onAccount} aria-label="บัญชีผู้ใช้" className="active:opacity-70"><Avatar user={user} size={32} /></button>}
      </>} />
      <div className="px-5 pb-3 flex items-center justify-between gap-2">

function ScheduleView({ gigs, now, theme, setTheme, onEdit, onAdd, onLineShare }) {
  const t = todayStr();
  const [view, setView] = useState('list');
  const [filter, setFilter] = useState('all');
  const [cursor, setCursor] = useState(() => ({ y: +t.slice(0, 4), m: +t.slice(5, 7) }));
  const [selected, setSelected] = useState(t);
  const ym = `${cursor.y}-${pad(cursor.m)}`;
  const monthGigs = gigs.filter((g) => g.date.startsWith(ym)).sort(cmpGig);
  const filtered = filter === 'all' ? monthGigs : monthGigs.filter((g) => g.status === filter);
  const moveMonth = (d) => setCursor((c) => { let m = c.m + d, y = c.y; if (m < 1) { m = 12; y--; } if (m > 12) { m = 1; y++; } return { y, m }; });
  const goToday = () => { setCursor({ y: +t.slice(0, 4), m: +t.slice(5, 7) }); setSelected(t); };

  const groups = [];
  filtered.forEach((g) => { const last = groups[groups.length - 1]; if (last && last.date === g.date) last.items.push(g); else groups.push({ date: g.date, items: [g] }); });

  const first = `${ym}-01`;
  const lead = weekdayOf(first);
  const dim = daysInMonth(cursor.y, cursor.m);
  const cells = [...Array(lead).fill(null), ...Array.from({ length: dim }, (_, i) => `${ym}-${pad(i + 1)}`)];
  while (cells.length % 7) cells.push(null);
  const byDate = {};
  filtered.forEach((g) => { (byDate[g.date] = byDate[g.date] || []).push(g); });
  const selGigs = (byDate[selected] || []);

  return (
    <div className="page-pad">
      <PageHeader title="ตารางงาน" subtitle={`${monthGigs.filter((g) => g.status !== 'cancelled').length} งานในเดือนนี้`} right={<ThemeToggle mode={theme} setMode={setTheme} />} />
      <div className="px-4 space-y-3">
        <Segmented value={view} onChange={setView} options={[{ value: 'list', label: 'รายการ', icon: 'view_agenda' }, { value: 'calendar', label: 'ปฏิทิน', icon: 'calendar_month' }]} />
        <button onClick={() => onLineShare(cursor)} className="w-full h-12 rounded-[14px] bg-[#06C755] text-white font-semibold flex items-center justify-center gap-2 active:opacity-85 shadow-[0_6px_16px_-8px_rgba(6,199,85,0.8)]">
          <Icon name="content_copy" size={20} />ก๊อปปี้คิวงานส่ง LINE
        </button>
        <div className="flex items-center justify-between">
          <button onClick={() => moveMonth(-1)} aria-label="เดือนก่อน" className="w-9 h-9 rounded-full flex items-center justify-center text-[#5856D6] dark:text-[#A5A3FF] active:bg-black/5"><Icon name="chevron_left" size={26} /></button>
          <button onClick={goToday} className="text-[17px] font-semibold">{monthLabel(cursor.y, cursor.m)}{ym !== t.slice(0, 7) && <span className="ml-2 text-[13px] text-[#5856D6] dark:text-[#A5A3FF]">กลับวันนี้</span>}</button>
          <button onClick={() => moveMonth(1)} aria-label="เดือนถัดไป" className="w-9 h-9 rounded-full flex items-center justify-center text-[#5856D6] dark:text-[#A5A3FF] active:bg-black/5"><Icon name="chevron_right" size={26} /></button>
        </div>
        <div className="flex gap-2 overflow-x-auto no-scrollbar -mx-4 px-4">
          {[{ k: 'all', l: 'ทั้งหมด', c: null }, ...STATUS_ORDER.map((k) => ({ k, l: STATUS[k].label, c: STATUS[k].color }))].map((f) => {
            const n = f.k === 'all' ? monthGigs.length : monthGigs.filter((g) => g.status === f.k).length;
            const on = filter === f.k;
            return (
              <button key={f.k} onClick={() => setFilter(f.k)} className={`h-8 px-3 rounded-full text-[13px] font-semibold whitespace-nowrap flex items-center gap-1.5 transition-colors ${on ? 'bg-black text-white dark:bg-white dark:text-black' : 'bg-white dark:bg-[#1C1C1E] text-black/80 dark:text-white/80'}`}>
                {f.c && <span className="w-2 h-2 rounded-full" style={{ background: f.c }} />}{f.l}<span className={`tnum ${on ? 'opacity-70' : 'text-[#8E8E93]'}`}>{n}</span>
              </button>
            );
          })}
        </div>
      </div>

      {view === 'list' ? (
        <div className="mt-3">
          {groups.length ? groups.map((gr) => (
            <div key={gr.date} className="mb-4">
              <div className="px-5 pb-1.5 flex items-center gap-2 text-[13px] font-semibold text-[#8E8E93]">
                {fmtDateShort(gr.date)}
                {gr.date === t && <span className="text-[11px] font-bold px-1.5 py-[1px] rounded bg-[#5856D6] text-white">วันนี้</span>}
                {gr.items.filter((g) => g.status !== 'cancelled').length > 1 && <span className="text-[11px] font-bold px-1.5 py-[1px] rounded bg-[#FF9500]/15 st-issue">วิ่งรอก</span>}
              </div>
              <Card className="mx-4 overflow-hidden">
                {gr.items.map((g, i) => <React.Fragment key={g.id}>{i > 0 && <Sep />}<GigRow gig={g} now={now} showDate={false} onClick={() => onEdit(g)} /></React.Fragment>)}
              </Card>
            </div>
          )) : (
            <Card className="mx-4"><EmptyState icon="event_busy" title="ไม่มีคิวงาน" text={filter === 'all' ? 'เดือนนี้ยังว่างอยู่' : `ไม่มีงานสถานะ “${STATUS[filter].label}”`}><button onClick={() => onAdd()} className="h-10 px-5 rounded-full bg-[#5856D6] text-white font-semibold">+ เพิ่มคิวงาน</button></EmptyState></Card>
          )}
        </div>
      ) : (
        <div className="mt-3">
          <Card className="mx-4 p-3">
            <div className="grid grid-cols-7 mb-1">
              {TH_DAYS_MINI.map((d, i) => <div key={d} className={`text-center text-[12px] font-semibold py-1 ${i === 0 ? 'text-[#FF3B30]/80' : 'text-[#8E8E93]'}`}>{d}</div>)}
            </div>
            <div className="grid grid-cols-7 gap-y-1">
              {cells.map((d, i) => {
                if (!d) return <div key={'e' + i} />;
                const list = byDate[d] || [];
                const isSel = d === selected, isToday = d === t;
                return (
                  <button key={d} onClick={() => setSelected(d)} className="flex flex-col items-center py-1 rounded-[12px] active:bg-black/5">
                    <span className={`w-9 h-9 rounded-full flex items-center justify-center text-[16px] tnum transition-colors ${isSel ? (isToday ? 'bg-[#FF3B30] text-white font-bold' : 'bg-black text-white dark:bg-white dark:text-black font-bold') : isToday ? 'text-[#FF3B30] font-bold' : ''}`}>{+d.slice(8)}</span>
                    <span className="flex gap-[3px] h-[6px] mt-0.5">
                      {list.slice(0, 3).map((g) => <span key={g.id} className="w-[6px] h-[6px] rounded-full" style={{ background: STATUS[g.status].color }} />)}
                    </span>
                  </button>
                );
              })}
            </div>
          </Card>
          <div className="px-5 pt-4 pb-1.5 flex items-center justify-between">
            <div className="text-[15px] font-semibold">{fmtDateLong(selected)}</div>
            <button onClick={() => onAdd(selected)} className="text-[15px] font-semibold text-[#5856D6] dark:text-[#A5A3FF] flex items-center gap-0.5"><Icon name="add" size={20} />เพิ่ม</button>
          </div>
          <Card className="mx-4 overflow-hidden">
            {selGigs.length ? selGigs.map((g, i) => <React.Fragment key={g.id}>{i > 0 && <Sep />}<GigRow gig={g} now={now} showDate={false} onClick={() => onEdit(g)} /></React.Fragment>)
              : <div className="py-7 text-center text-[#8E8E93] text-[15px]">ว่าง — ไม่มีคิวงานวันนี้</div>}
          </Card>
        </div>
      )}
    </div>
  );
}

function FinanceView({ gigs, now, theme, setTheme, onEdit, onMarkPaid, onBatch, onExport, onImport, onDemo, onClear, user, sync, onSignOut, venueCount, onVenues, openPastCount, onClosePast }) {
  const t = todayStr();
  const [mode, setMode] = useState('month');
  const [cur, setCur] = useState(() => ({ y: +t.slice(0, 4), m: +t.slice(5, 7) }));

  const list = gigs.filter((g) => g.date.startsWith(prefix));
  const st = computeStats(list);
  const byType = breakdown(st.income, (g) => GIG_TYPES[g.gigType]?.label || 'ไม่ระบุประเภท');
  const byBand = breakdown(st.income, (g) => g.bandName || 'ไม่ระบุวง');
  const byVenue = breakdown(st.income, (g) => g.venueName);
  const allUnpaid = computeStats(gigs).unpaidGigs.sort(cmpGig);
  const move = (d) => setCur((c) => {
    if (mode === 'year') return { ...c, y: c.y + d };
    let m = c.m + d, y = c.y; if (m < 1) { m = 12; y--; } if (m > 12) { m = 1; y++; } return { y, m };

  return (

      <div className="px-4 space-y-3">

          <button onClick={() => move(-1)} aria-label="ก่อนหน้า" className="w-9 h-9 rounded-full flex items-center justify-center text-[#5856D6] dark:text-[#A5A3FF]"><Icon name="chevron_left" size={26} /></button>

          <button onClick={() => move(1)} aria-label="ถัดไป" className="w-9 h-9 rounded-full flex items-center justify-center text-[#5856D6] dark:text-[#A5A3FF]"><Icon name="chevron_right" size={26} /></button>

        <div className="grid grid-cols-2 gap-2 mt-4">

            { l: 'ยอดทิป (ส่วนของฉัน)', v: fmtMoney(st.tips), i: 'volunteer_activism', c: '#34C759' },
            { l: 'ค้างจ่าย', v: fmtMoney(st.outstanding), i: 'pending_actions', c: '#FF9500' },
            { l: 'คาดการณ์ (รอคอนเฟิร์ม)', v: '+' + fmtMoney(st.forecast), i: 'trending_up', c: '#FFCC00' },
            { l: 'จำนวนงาน', v: `${st.income.length} งาน${st.cancelled ? ` · แคนเซิล ${st.cancelled}` : ''}`, i: 'music_note', c: '#007AFF' },
            { l: 'เฉลี่ย/งาน · ชั่วโมงเล่น', v: `${fmtMoney(st.avg)} · ${Math.round(st.minutes / 6) / 10} ชม.`, i: 'equalizer', c: '#AF52DE' },
          ].map((x) => (
            <div key={x.l} className="rounded-[14px] bg-[#F2F2F7] dark:bg-[#2C2C2E] px-3 py-2.5">

      <BreakdownTable title="สัดส่วนตามประเภทงาน" icon="category" rows={byType} emptyText="ยังไม่มีรายได้ในช่วงนี้" />
      <BreakdownTable title="สัดส่วนตามชื่อวง" icon="groups" rows={byBand} emptyText="ยังไม่มีรายได้ในช่วงนี้" />
      <BreakdownTable title="สัดส่วนตามร้าน" icon="storefront" rows={byVenue} emptyText="ยังไม่มีรายได้ในช่วงนี้" />

          <React.Fragment key={g.id}>

      </Card>

      <Card className="mx-4 overflow-hidden">

        <Sep />

        <Sep />
        <ToolRow icon="upload" color="#34C759" label="Import กู้คืนข้อมูล (.json)" onClick={() => fileRef.current?.click()} />
        <Sep />
        <ToolRow icon="science" color="#FF9500" label="โหลดข้อมูลตัวอย่าง (Demo)" onClick={onDemo} />
        <Sep />
        <ToolRow icon="delete" color="#FF3B30" label="ล้างข้อมูลทั้งหมด" destructive onClick={onClear} />
      </Card>
      <input ref={fileRef} type="file" accept="application/json,.json" className="hidden" onChange={(e) => { const f = e.target.files?.[0]; if (f) onImport(f); e.target.value = ''; }} />
      <div className="text-center text-[12px] text-[#8E8E93] mt-5 px-8 leading-relaxed flex flex-col items-center gap-2">
        <AppLogo size={28} />
        {user
          ? <>ข้อมูลบันทึกในเครื่องและซิงก์ขึ้น Google Drive ของคุณ (โฟลเดอร์ซ่อนของแอป)<br />เฉพาะบัญชีของคุณเท่านั้นที่เข้าถึงได้ · ใช้งานออฟไลน์ได้</>
          : <>ข้อมูลทั้งหมดถูกบันทึกในเครื่องนี้ (localStorage) อัตโนมัติ<br />ไม่มีการส่งข้อมูลขึ้นเซิร์ฟเวอร์ · ควร Export สำรองไว้เป็นระยะ</>}
      </div>
    </div>
  );
}
